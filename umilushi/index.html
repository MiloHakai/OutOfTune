<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="ENVTuber!! doing vtuber things! — Umilushi on OutOfTune.">
  <!-- Open Graph / Social Media Sharing -->
  <meta property="og:type" content="website" />

  <meta property="og:url" content="https://outoftune.dev/umilushi/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Umilushi" />
  <meta name="twitter:description" content="ENVTuber!! doing vtuber things! — Umilushi on OutOfTune." />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #1a0f2e;
      --bg-light: #e8f4f8;
      --text-dark: #a8e6cf;
      --text-light: #2d5a6b;
      --border-color-dark: #4dd9d9;
      --border-color-light: #3ca0a0;
      --glow-color-dark: rgba(77, 217, 217, 0.8);
      --glow-color-light: rgba(60, 160, 160, 0.8);
      --accent-cyan: #4dd9d9;
      --accent-purple: #9b59b6;
      --accent-orange: #f39c12;
      --rampage-red: #ff2a2a;
      --rampage-orange: #ff8a00;
      --muted: #8899aa;

      /* Reveal easing */
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-draw: cubic-bezier(0.65, 0, 0.35, 1);
      --ease-pop: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-dark);
      transition: background 0.5s ease, color 0.5s ease;
      position: relative;
      background-image: url('./images/background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 10, 20, 0.57);
      z-index: 0;
      transition: background 0.4s ease;
    }
    body.ambient-active::before { animation: fadeInSimple 1.2s ease backwards; }

    [data-theme="light"] body {
      background-color: var(--bg-light);
      color: var(--text-light);
    }

    [data-theme="light"] body::before {
      background: linear-gradient(135deg,
          rgba(232, 244, 248, 0.85) 0%,
          rgba(168, 230, 207, 0.75) 50%,
          rgba(77, 217, 217, 0.65) 100%);
    }

    body.rampage {
      background-image: url('./images/1cbc3479-5b28-441d-8b18-e21f1c878949.png');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      animation: rampage-screen-shake 0.22s steps(2, end) infinite;
    }

    body.rampage::before {
      background: linear-gradient(180deg,
          rgba(40, 0, 0, 0.28) 0%,
          rgba(0, 0, 0, 0.10) 45%,
          rgba(120, 0, 0, 0.22) 100%);
    }

    [data-theme="light"] body.rampage::before {
      background: linear-gradient(180deg,
          rgba(55, 0, 0, 0.2) 0%,
          rgba(0, 0, 0, 0.08) 40%,
          rgba(130, 10, 10, 0.18) 100%);
    }

    .border-segments {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 1;
    }
    body.ambient-active .border-segments { animation: fadeInSimple 1.6s ease 0.2s backwards; }

    .border-top,
    .border-right,
    .border-bottom,
    .border-left {
      position: absolute;
      filter: drop-shadow(0 0 4px rgba(77, 217, 217, 0.45));
    }

    .border-top {
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, transparent 30%, #4dd9d9 40%, #9b59b6 50%, #4dd9d9 60%, transparent 70%, transparent 100%);
      background-size: 300% 100%;
      animation: move-horizontal 12s linear infinite;
    }

    .border-right {
      top: 0;
      right: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, transparent 0%, transparent 30%, #4dd9d9 40%, #9b59b6 50%, #4dd9d9 60%, transparent 70%, transparent 100%);
      background-size: 100% 300%;
      animation: move-vertical 12s linear infinite;
    }

    .border-bottom {
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(-90deg, transparent 0%, transparent 30%, #4dd9d9 40%, #9b59b6 50%, #4dd9d9 60%, transparent 70%, transparent 100%);
      background-size: 300% 100%;
      animation: move-horizontal-reverse 12s linear infinite;
    }

    .border-left {
      top: 0;
      left: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(-180deg, transparent 0%, transparent 30%, #4dd9d9 40%, #9b59b6 50%, #4dd9d9 60%, transparent 70%, transparent 100%);
      background-size: 100% 300%;
      animation: move-vertical-reverse 12s linear infinite;
    }

    [data-theme="light"] .border-top { background: linear-gradient(90deg, transparent 0%, transparent 30%, #3ca0a0 40%, #8e44ad 50%, #3ca0a0 60%, transparent 70%, transparent 100%) !important; }
    [data-theme="light"] .border-right { background: linear-gradient(180deg, transparent 0%, transparent 30%, #3ca0a0 40%, #8e44ad 50%, #3ca0a0 60%, transparent 70%, transparent 100%) !important; }
    [data-theme="light"] .border-bottom { background: linear-gradient(-90deg, transparent 0%, transparent 30%, #3ca0a0 40%, #8e44ad 50%, #3ca0a0 60%, transparent 70%, transparent 100%) !important; }
    [data-theme="light"] .border-left { background: linear-gradient(-180deg, transparent 0%, transparent 30%, #3ca0a0 40%, #8e44ad 50%, #3ca0a0 60%, transparent 70%, transparent 100%) !important; }

    body.rampage .border-top,
    body.rampage .border-right,
    body.rampage .border-bottom,
    body.rampage .border-left,
    [data-theme="light"] body.rampage .border-top,
    [data-theme="light"] body.rampage .border-right,
    [data-theme="light"] body.rampage .border-bottom,
    [data-theme="light"] body.rampage .border-left {
      background-image: linear-gradient(90deg, transparent 0%, transparent 25%, #ff2a2a 40%, #ff8a00 50%, #ff2a2a 60%, transparent 75%, transparent 100%) !important;
      box-shadow: 0 0 8px rgba(255, 80, 0, 0.8), 0 0 18px rgba(255, 30, 30, 0.55);
    }

    .border-line-1.border-top { animation-delay: 0s; }
    .border-line-1.border-right { animation-delay: 3s; }
    .border-line-1.border-bottom { animation-delay: 6s; }
    .border-line-1.border-left { animation-delay: 9s; }
    .border-line-2.border-top { animation-delay: 6s; }
    .border-line-2.border-right { animation-delay: 9s; }
    .border-line-2.border-bottom { animation-delay: 0s; }
    .border-line-2.border-left { animation-delay: 3s; }

    @keyframes move-horizontal { 0% { background-position: -100% 0; } 100% { background-position: 200% 0; } }
    @keyframes move-horizontal-reverse { 0% { background-position: 200% 0; } 100% { background-position: -100% 0; } }
    @keyframes move-vertical { 0% { background-position: 0 -100%; } 100% { background-position: 0 200%; } }
    @keyframes move-vertical-reverse { 0% { background-position: 0 200%; } 100% { background-position: 0 -100%; } }
    @keyframes rampage-screen-shake { 0% { transform: translate(0, 0); } 25% { transform: translate(-2px, 1px); } 50% { transform: translate(2px, -2px); } 75% { transform: translate(-1px, 2px); } 100% { transform: translate(0, 0); } }

    /* Left padding shift away from window edges */
    .container {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding-left: 3.5rem;
      text-align: left;
      max-width: 600px;
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s ease;
      position: relative;
      display: inline-block;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      line-height: 1.2;
      margin: 0;
    }

    .wave-text {
      background: linear-gradient(90deg, #4dd9d9 0%, #a8e6cf 35%, #9b59b6 50%, #a8e6cf 65%, #4dd9d9 100%);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: wave-effect 6s linear infinite;
      text-shadow: 0 0 20px rgba(77, 217, 217, 0.6), 0 0 40px rgba(155, 89, 182, 0.4), 0 0 60px rgba(168, 230, 207, 0.2);
      filter: drop-shadow(0 0 10px rgba(77, 217, 217, 0.5));
    }
    body.ambient-active .wave-text {
      animation: revealUp 1s var(--ease-out-expo) 0.35s backwards,
                 wave-effect 6s linear infinite;
    }

    [data-theme="light"] .wave-text {
      background: linear-gradient(90deg, #3ca0a0 0%, #2d5a6b 35%, #8e44ad 50%, #2d5a6b 65%, #3ca0a0 100%);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(60, 160, 160, 0.6), 0 0 40px rgba(142, 68, 173, 0.4), 0 0 60px rgba(45, 90, 107, 0.2);
      filter: drop-shadow(0 0 10px rgba(60, 160, 160, 0.5));
    }

    @keyframes wave-effect { 0% { background-position: 200% 0; } 100% { background-position: -100% 0; } }
    h1:active { transform: scale(0.98); }

    /* In rampage the name hides (not removed, so nothing replays when it comes back) and the cube gif takes over */
    body.rampage h1.wave-text {
      visibility: hidden;
      position: absolute;
      pointer-events: none;
    }

    .title-gif {
      display: none;
      max-width: min(90vw, 520px);
      width: min(90vw, 520px);
      height: auto;
      image-rendering: pixelated;
      cursor: pointer;
      filter: drop-shadow(0 0 10px rgba(255, 80, 0, 0.6));
    }
    body.rampage .title-gif { display: block; }

    /* Underline that draws itself in beneath the title */
    .title-bar {
      height: 2px;
      width: 140px;
      margin-top: 1rem;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple) 60%, rgba(155, 89, 182, 0));
      box-shadow: 0 0 10px rgba(77, 217, 217, 0.3);
    }
    [data-theme="light"] .title-bar {
      background: linear-gradient(90deg, #3ca0a0, #8e44ad 60%, rgba(142, 68, 173, 0));
      box-shadow: 0 0 10px rgba(60, 160, 160, 0.3);
    }
    body.rampage .title-bar {
      background: linear-gradient(90deg, #ff2a2a, #ff8a00 60%, rgba(255, 138, 0, 0));
      box-shadow: 0 0 10px rgba(255, 80, 0, 0.6);
    }
    body.ambient-active .title-bar { animation: barDraw 1.1s var(--ease-draw) 0.9s backwards; }

    p {
      margin-top: 1.5rem;
      font-size: 0.7rem;
      font-family: 'Press Start 2P', monospace;
      font-weight: 400;
      opacity: 0.9;
      animation: subtle-pulse 12s ease-in-out infinite;
      letter-spacing: 0.05em;
      line-height: 1.4;
    }
    body.ambient-active .container > p {
      animation: revealUpSub 0.9s var(--ease-out-expo) 0.55s backwards,
                 subtle-pulse 12s ease-in-out 1.5s infinite;
    }

    @keyframes subtle-pulse { 0%, 100% { opacity: 0.9; } 50% { opacity: 1; } }

    /* Left-aligned icon row container */
    .icons {
      margin-top: 1.5rem;
      display: flex;
      justify-content: flex-start;
      gap: 18px;
    }

    .click-counter {
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
    }

    .click-counter.show {
      opacity: 1;
      transform: translateY(0);
    }

    .click-counter p {
      font-size: 0.6rem;
      color: #4dd9d9;
      margin: 0;
      text-shadow: 0 0 10px rgba(77, 217, 217, 0.5);
      animation: none;
    }

    body.rampage .click-counter p {
      color: #ffd0b0;
      text-shadow: 0 0 10px rgba(255, 80, 0, 0.85);
    }

    [data-theme="light"] .click-counter p {
      color: #3ca0a0;
      text-shadow: 0 0 10px rgba(60, 160, 160, 0.5);
    }

    .icons a {
      font-size: 1.2rem;
      color: inherit;
      text-decoration: none;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
    }
    body.ambient-active .icons a { animation: iconPop 0.45s var(--ease-pop) backwards; }
    body.ambient-active .icons a:nth-child(1) { animation-delay: 0.7s; }
    body.ambient-active .icons a:nth-child(2) { animation-delay: 0.78s; }
    body.ambient-active .icons a:nth-child(3) { animation-delay: 0.86s; }
    body.ambient-active .icons a:nth-child(4) { animation-delay: 0.94s; }

    .icons a:hover {
      color: #4dd9d9;
      transform: scale(1.1);
    }

    body.rampage .icons a:hover {
      color: #ffb347;
      filter: drop-shadow(0 0 8px rgba(255, 68, 0, 0.7));
    }

    [data-theme="light"] .icons a:hover { color: #3ca0a0; }

    /* Bottom Left - Track info (same structure as Indura; no lyrics, so the author sits where lyrics would be) */
    .track-box {
      position: fixed;
      left: 40px;
      bottom: 40px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: min(540px, calc(100vw - 80px));
    }
    body.ambient-active .track-box { animation: revealUp 0.9s var(--ease-out-expo) 1.2s backwards; }

    .track-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .track-title {
      font-size: 0.5rem;
      font-weight: bold;
      color: var(--accent-cyan);
      letter-spacing: 0.04em;
      text-shadow: 0 0 10px rgba(77, 217, 217, 0.6), 0 0 22px rgba(77, 217, 217, 0.3);
    }

    .track-author {
      font-size: 0.43rem;
      line-height: 1.7;
      color: var(--muted);
      letter-spacing: 0.04em;
      min-height: 1.7em;
    }

    [data-theme="light"] .track-title {
      color: #3ca0a0;
      text-shadow: 0 0 10px rgba(60, 160, 160, 0.5);
    }
    [data-theme="light"] .track-author { color: #5a7a8a; }

    .mute-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .mute-btn:hover { transform: scale(1.15); }
    .mute-btn:focus,
    .mute-btn:focus-visible { outline: none; }
    .mute-btn:focus-visible .eq i { background: #ffffff; }

    /* Muted: bars freeze flat and grey, with a slash through them */
    .mute-btn.muted .eq i {
      animation: none !important;
      transform: scaleY(0.2);
      background: var(--muted);
    }
    .mute-btn.muted::after {
      content: "";
      position: absolute;
      left: 4px;
      right: 4px;
      top: 50%;
      height: 1.5px;
      background: var(--accent-purple);
      transform: rotate(-35deg);
    }

    .eq {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
      padding-left: 4px;
    }
    .eq i {
      display: block;
      width: 2px;
      height: 100%;
      background: var(--accent-cyan);
      transform-origin: bottom;
      transform: scaleY(0.25);
    }
    [data-theme="light"] .eq i { background: #3ca0a0; }
    body.ambient-active .eq i { animation: eqBar 0.9s ease-in-out infinite; }
    body.ambient-active .eq i:nth-child(2) { animation-duration: 0.7s; animation-delay: -0.3s; }
    body.ambient-active .eq i:nth-child(3) { animation-duration: 1.1s; animation-delay: -0.6s; }
    body.ambient-active .eq i:nth-child(4) { animation-duration: 0.8s; animation-delay: -0.15s; }
    @keyframes eqBar {
      0%, 100% { transform: scaleY(0.25); }
      50% { transform: scaleY(1); }
    }

    /* RAMPAGE: the track display goes feral */
    body.rampage .track-title {
      color: #ffb347;
      animation: glitchMove 0.5s steps(2, end) infinite,
                 glitchColor 0.22s steps(2, end) infinite;
    }
    body.rampage .track-author { color: #ffc9b3; }
    body.rampage .eq i { background: #ff2a2a; }
    body.rampage .eq i,
    body.rampage .eq i:nth-child(n) { animation-duration: 0.25s; }

    /* The swap itself: shake, skew, invert-flash */
    .track-row.swapping { animation: swapCrazy 1.7s steps(1, end); }
    .track-author.swapping { animation: swapCrazyAuthor 1.7s steps(1, end); }

    @keyframes glitchMove {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-2px, 1px) skewX(-6deg); }
      40% { transform: translate(2px, -1px); }
      60% { transform: translate(-1px, -2px) skewX(5deg); }
      80% { transform: translate(2px, 2px); }
      100% { transform: translate(0, 0); }
    }
    @keyframes glitchColor {
      0%, 100% { text-shadow: 2px 0 #ff2a2a, -2px 0 #4dd9d9, 0 0 12px rgba(255, 80, 0, 0.9); }
      50% { text-shadow: -3px 0 #ff2a2a, 3px 0 #4dd9d9, 0 0 18px rgba(255, 138, 0, 1); }
    }
    @keyframes swapCrazy {
      0% { transform: translate(0, 0) scale(1); filter: none; }
      8% { transform: translate(-14px, 3px) scale(1.5) skewX(-18deg); filter: invert(1) hue-rotate(90deg); }
      16% { transform: translate(18px, -4px) scale(0.8) skewX(14deg); filter: none; }
      24% { transform: translate(-10px, 6px) scale(1.7) rotate(-3deg); filter: invert(1); }
      32% { transform: translate(12px, -6px) scale(1.1) skewX(-10deg); filter: hue-rotate(180deg); }
      42% { transform: translate(-16px, 2px) scale(1.4) rotate(2deg); filter: invert(1) hue-rotate(40deg); }
      52% { transform: translate(14px, 5px) scale(0.9); filter: none; }
      64% { transform: translate(-8px, -4px) scale(1.3) skewX(12deg); filter: invert(1); }
      76% { transform: translate(10px, 3px) scale(1.15) rotate(-2deg); filter: hue-rotate(120deg); }
      88% { transform: translate(-4px, -2px) scale(1.05); filter: none; }
      100% { transform: translate(0, 0) scale(1); filter: none; }
    }
    @keyframes swapCrazyAuthor {
      0% { transform: translate(0, 0); opacity: 1; }
      10% { transform: translate(16px, 0) skewX(20deg); opacity: 0.2; }
      20% { transform: translate(-20px, 2px); opacity: 1; }
      35% { transform: translate(12px, -2px) skewX(-16deg); opacity: 0.4; }
      50% { transform: translate(-14px, 1px); opacity: 1; }
      70% { transform: translate(8px, 0) skewX(10deg); opacity: 0.6; }
      100% { transform: translate(0, 0); opacity: 1; }
    }

    /* Full-screen flash when rampage begins */
    .rampage-flash {
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;
      animation: flashPop 0.7s steps(7, end) forwards;
    }
    @keyframes flashPop {
      0% { background: #ffffff; opacity: 1; }
      20% { background: #ff2a2a; opacity: 0.85; }
      40% { background: #000000; opacity: 0.7; }
      60% { background: #ff8a00; opacity: 0.6; }
      80% { background: #ffffff; opacity: 0.35; }
      100% { background: #ff2a2a; opacity: 0; }
    }

    /* Bottom Right - copyright */
    footer {
      position: fixed;
      right: 40px;
      bottom: 40px;
      z-index: 100;
      text-align: right;
      font-size: 0.42rem;
      color: var(--muted);
      font-family: 'Press Start 2P', monospace;
      letter-spacing: 0.05em;
      line-height: 1.7;
      padding-top: 10px;
      border-top: 1px solid rgba(77, 217, 217, 0.22);
    }
    body.ambient-active footer { animation: revealUp 0.9s var(--ease-out-expo) 1.4s backwards; }

    footer a {
      color: #4dd9d9;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    footer a:hover { color: #9b59b6; }
    body.rampage footer, body.rampage footer a { color: #ffc9b3; }
    body.rampage footer { border-top-color: rgba(255, 80, 0, 0.45); }
    [data-theme="light"] footer { color: #5a7a8a; border-top-color: rgba(60, 160, 160, 0.3); }
    [data-theme="light"] footer a { color: #3ca0a0; }
    [data-theme="light"] footer a:hover { color: #8e44ad; }

    .theme-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 5;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 12px;
      color: inherit;
      font-size: 1.2rem;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    body.ambient-active .theme-toggle { animation: fadeInSimple 0.9s ease 0.3s backwards; }

    .theme-toggle:hover {
      background-color: rgba(255, 255, 255, 0.2);
      transform: scale(1.1);
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.15);
    }

    [data-theme="light"] .theme-toggle {
      background: rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(0, 0, 0, 0.2);
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
    }

    [data-theme="light"] .theme-toggle:hover {
      background-color: rgba(0, 0, 0, 0.2);
      box-shadow: 0 6px 25px rgba(255, 255, 255, 0.15);
    }

    .theme-icon { transition: all 0.3s ease; }
    .sun-icon { display: none; }
    .moon-icon { display: block; }
    [data-theme="light"] .sun-icon { display: block; }
    [data-theme="light"] .moon-icon { display: none; }

    .chaos-layer {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      overflow: hidden;
    }

    .chaos-cube {
      position: absolute;
      width: 90px;
      height: 90px;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 0 10px rgba(255, 55, 0, 0.65));
      will-change: transform;
    }

    /* Ghost flash: a frozen frame of rampage. Animations are paused (not removed) so nothing replays afterwards */
    body.ghost, body.ghost *, body.ghost *::before, body.ghost *::after { animation-play-state: paused !important; }

    /* Used for a couple of frames when rampage ends: kills transitions so everything snaps back instantly */
    html.snap *, html.snap *::before, html.snap *::after { transition: none !important; }

    /* Reveal keyframes */
    @keyframes revealUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes revealUpSub {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 0.9; transform: translateY(0); }
    }
    @keyframes iconPop {
      0% { opacity: 0; transform: translateY(14px) scale(0.4) rotate(-12deg); }
      100% { opacity: 1; transform: none; }
    }
    @keyframes barDraw {
      from { width: 0; opacity: 0; }
      to { width: 140px; opacity: 1; }
    }
    @keyframes fadeInSimple {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* CLICK TO CONTINUE INTRO */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-dark);
      cursor: pointer;
      transition: opacity 0.9s cubic-bezier(0.25, 1, 0.5, 1),
                  transform 1s var(--ease-draw),
                  filter 0.9s ease;
    }
    .overlay.hidden {
      opacity: 0;
      transform: scale(1.12);
      filter: blur(12px);
      pointer-events: none;
    }
    .intro-holder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      user-select: none;
    }
    .intro-title {
      font-size: clamp(1.1rem, 2.8vw, 1.6rem);
      color: var(--accent-cyan);
      opacity: 0;
      transform: translateY(25px);
      animation: introSlideUp 0.9s var(--ease-out-expo) forwards 0.2s,
                 introGlow 2.8s ease-in-out infinite 1.2s;
    }
    .intro-sub-click {
      font-size: clamp(0.45rem, 1.2vw, 0.52rem);
      color: var(--muted);
      letter-spacing: 1px;
      opacity: 0;
      animation: introFade 0.8s ease forwards 0.9s,
                 introBlink 2.2s ease-in-out infinite 1.8s;
    }
    @keyframes introSlideUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes introFade { to { opacity: 0.75; } }
    @keyframes introGlow {
      0%, 100% { text-shadow: 0 0 0 rgba(77, 217, 217, 0); }
      50% { text-shadow: 0 0 18px rgba(77, 217, 217, 0.7); }
    }
    @keyframes introBlink { 0%, 100% { opacity: 0.75; } 50% { opacity: 0.3; } }

    /* Ripple that expands from the click point */
    .click-ripple {
      position: fixed;
      z-index: 10000;
      width: 24px;
      height: 24px;
      margin: -12px 0 0 -12px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(77, 217, 217, 0.55) 0%, rgba(77, 217, 217, 0) 70%);
      animation: ripple 1s var(--ease-out-expo) forwards;
    }
    @keyframes ripple {
      from { transform: scale(1); opacity: 1; }
      to { transform: scale(90); opacity: 0; }
    }

    @media (max-width: 600px) {
      body {
        align-items: center;
        justify-content: center;
      }
      .container {
        padding-left: 1.5rem;
        padding-right: 1.5rem;
        align-items: center;
        text-align: center;
      }
      h1 { font-size: 1.5rem; }
      p { font-size: 0.6rem; }
      .icons {
        justify-content: center;
        gap: 16px;
      }
      .icons a { font-size: 1.1rem; }
      .track-box { left: 24px; bottom: 24px; }
      .track-title { font-size: 0.42rem; }
      .track-author { font-size: 0.36rem; }
      footer {
        right: 24px;
        bottom: 24px;
        font-size: 0.35rem;
      }
      .chaos-cube {
        width: 72px;
        height: 72px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div id="overlay" class="overlay" role="button" tabindex="0" aria-label="Click to continue">
    <div class="intro-holder">
      <div class="intro-title">Umilushi</div>
      <div class="intro-sub-click">click here to continue</div>
    </div>
  </div>

  <div class="border-segments">
    <div class="border-top border-line-1"></div>
    <div class="border-right border-line-1"></div>
    <div class="border-bottom border-line-1"></div>
    <div class="border-left border-line-1"></div>
    <div class="border-top border-line-2"></div>
    <div class="border-right border-line-2"></div>
    <div class="border-bottom border-line-2"></div>
    <div class="border-left border-line-2"></div>
  </div>

  <div id="chaosLayer" class="chaos-layer" aria-hidden="true"></div>

  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
    <i class="fas fa-sun theme-icon sun-icon"></i>
    <i class="fas fa-moon theme-icon moon-icon"></i>
  </button>

  <div class="container">
    <h1 id="username" class="wave-text" onclick="playClickSound()">Umilushi</h1>
    <img id="titleGif" class="title-gif" src="./images/cubeilushi.gif" alt="cubeilushi" onclick="playClickSound()">
    <div class="title-bar" aria-hidden="true"></div>
    <p id="subtitle">ENVTuber!! doing vtuber things!</p>

    <div id="clickCounter" class="click-counter" style="display: none;">
      <p id="clickCounterText">Hey! You clicked me <span>0</span> times.</p>
    </div>

    <div class="icons">
      <a href="https://discord.gg/JBXtzpRUcF" title="Discord" target="_blank"><i class="fab fa-discord"></i></a>
      <a href="https://x.com/umilushi" title="X" target="_blank"><i class="fab fa-x-twitter"></i></a>
      <a href="https://www.youtube.com/channel/UCENdrTBnznipUlIYcRQenOA" title="YouTube" target="_blank"><i class="fab fa-youtube"></i></a>
      <a href="https://www.twitch.tv/umilushi" title="Twitch" target="_blank"><i class="fab fa-twitch"></i></a>
    </div>
  </div>

  <div class="track-box">
    <div class="track-row" id="trackRow">
      <div id="track-name" class="track-title">Yume 2kki</div>
      <button type="button" id="mute-btn" class="mute-btn" aria-label="Mute audio" aria-pressed="false" title="Mute / unmute">
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </button>
    </div>
    <div id="track-author" class="track-author">Urotsuki</div>
  </div>

  <footer>
    © 2026 OutOfTune<br>
    Umilushi
  </footer>

  <audio id="backgroundAudio" preload="auto" loop>
    <source src="./bgm.flac" type="audio/flac">
    <source src="./audio/bgm.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <audio id="rampageAudio" preload="auto" loop>
    <source src="./audio/rampage-bgm.mp3" type="audio/mpeg">
    <source src="./rampage-bgm.ogg" type="audio/ogg">
  </audio>

  <audio id="clickSound" preload="auto">
    <source src="./audio/click-sound.mp3" type="audio/mpeg">
    <source src="./click-sound.ogg" type="audio/ogg">
    Your browser does not support the audio element.
  </audio>

  <script>
    const RAMPAGE_THRESHOLD = 20;
    const IDLE_MS = 15000; // no interaction for this long in rampage = back to normal, instantly

    // Edit these two when you have the real song names
    const NORMAL_TRACK = { title: 'Yume 2kki', author: 'Urotsuki' };
    const RAMPAGE_TRACK = { title: 'ROT IN HELL', author: 'YOU’RE ONLY GETTING CLOSER' };
    const NORMAL_SUBTITLE = 'ENVTuber!! doing vtuber things!';
    const RAMPAGE_SUBTITLE = 'You clicked too much. You have unleashed the cube.';

    // After the first rampage ends, a frozen rampage frame pops up now and then, for GHOST_MS, with zero transition
    const GHOST_MS = 500;        // half a second of pure suffering
    const GHOST_MIN_MS = 10000;  // leave time to see the normal site again
    const GHOST_MAX_MS = 60000;  // random appearance within a minute

    let clickCount = 0;
    let rampageTriggered = false;
    let idleTimer = null;
    let glitchInterval = null;
    let cubeRaf = null;
    let ghostTimer = null;
    let ghostHideTimer = null;
    let ghostActive = false;

    const audio = document.getElementById('backgroundAudio');
    const rampageAudio = document.getElementById('rampageAudio');
    const clickSound = document.getElementById('clickSound');
    const clickCounter = document.getElementById('clickCounter');
    const clickCounterText = document.getElementById('clickCounterText');
    const subtitle = document.getElementById('subtitle');
    const chaosLayer = document.getElementById('chaosLayer');
    const trackName = document.getElementById('track-name');
    const trackAuthor = document.getElementById('track-author');
    const trackRow = document.getElementById('trackRow');

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    }

    function renderCounter() {
      clickCounterText.innerHTML = 'Hey! You clicked me <span>' + clickCount + '</span> times.' +
        (rampageTriggered ? ' Now suffer.' : '');
    }

    function playClickSound() {
      clickSound.currentTime = 0;
      clickSound.play().catch(error => {
        console.log('Click sound could not be played:', error);
      });

      clickCount++;
      renderCounter();

      if (clickCount === 1) {
        clickCounter.style.display = 'block';
        setTimeout(() => clickCounter.classList.add('show'), 10);
      }

      if (!rampageTriggered && clickCount >= RAMPAGE_THRESHOLD) {
        triggerRampageMode();
      }
    }

    /* ---------- text scramble (used for the crazy track swap) ---------- */
    const GLYPHS = '!<>-_\\/[]{}=+*^?#%&$@01';
    function scrambleTo(el, finalText, duration, minReveal) {
      cancelAnimationFrame(el._scrambleRaf || 0);
      if (reduceMotion) { el.textContent = finalText; return; }
      const start = performance.now();
      const thresholds = Array.from(finalText, () => minReveal + Math.random() * (1 - minReveal));
      (function frame(now) {
        const t = Math.min(1, (now - start) / duration);
        let out = '';
        for (let i = 0; i < finalText.length; i++) {
          const ch = finalText[i];
          out += (ch === ' ' || t >= thresholds[i]) ? ch : GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
        }
        el.textContent = out;
        if (t < 1) el._scrambleRaf = requestAnimationFrame(frame);
      })(start);
    }

    function setTrackInstant(track) {
      cancelAnimationFrame(trackName._scrambleRaf || 0);
      cancelAnimationFrame(trackAuthor._scrambleRaf || 0);
      trackName.textContent = track.title;
      trackAuthor.textContent = track.author;
    }

    function crazySwapTrack(track) {
      trackRow.classList.remove('swapping');
      trackAuthor.classList.remove('swapping');
      void trackRow.offsetWidth; // restart the animation
      trackRow.classList.add('swapping');
      trackAuthor.classList.add('swapping');
      setTimeout(() => {
        trackRow.classList.remove('swapping');
        trackAuthor.classList.remove('swapping');
      }, 1750);
      scrambleTo(trackName, track.title, 1700, 0.25);
      scrambleTo(trackAuthor, track.author, 1700, 0.25);
    }

    function flashScreen() {
      const flash = document.createElement('div');
      flash.className = 'rampage-flash';
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 750);
    }

    /* ---------- rampage on / off ---------- */
    function triggerRampageMode() {
      clearTimeout(ghostTimer);
      if (ghostActive) hideGhost();
      rampageTriggered = true;
      document.body.classList.add('rampage');

      subtitle.textContent = RAMPAGE_SUBTITLE;
      renderCounter();
      spawnChaosCubes(10);
      switchToRampageBgm();

      flashScreen();
      crazySwapTrack(RAMPAGE_TRACK);
      // keep the track text twitching while rampage lasts
      glitchInterval = setInterval(() => {
        scrambleTo(trackName, RAMPAGE_TRACK.title, 450, 0);
        if (Math.random() > 0.5) scrambleTo(trackAuthor, RAMPAGE_TRACK.author, 450, 0);
      }, 2300);

      armIdle();
    }

    // Fever dream over: everything snaps back at once, no transitions, no animations.
    function exitRampageMode() {
      if (!rampageTriggered) return;
      rampageTriggered = false;
      clearTimeout(idleTimer);
      clearInterval(glitchInterval);
      glitchInterval = null;

      const html = document.documentElement;
      html.classList.add('snap');

      document.body.classList.remove('rampage');
      trackRow.classList.remove('swapping');
      trackAuthor.classList.remove('swapping');
      setTrackInstant(NORMAL_TRACK);
      subtitle.textContent = NORMAL_SUBTITLE;

      clickCount = 0;
      clickCounter.classList.remove('show');
      clickCounter.style.display = 'none';
      renderCounter();

      cancelAnimationFrame(cubeRaf);
      cubeRaf = null;
      chaosLayer.innerHTML = '';

      rampageAudio.pause();
      rampageAudio.currentTime = 0;
      audio.playbackRate = 1;
      audio.volume = 0.3;

      setTimeout(() => html.classList.remove('snap'), 150);

      scheduleGhost();
    }

    /* ---------- ghost flash: a one-second frozen frame of rampage, then straight back ---------- */
    function spawnStaticCubes(amount) {
      for (let i = 0; i < amount; i++) {
        const cube = document.createElement('img');
        const size = 58 + Math.random() * 70;
        const x = Math.random() * Math.max(1, window.innerWidth - size);
        const y = Math.random() * Math.max(1, window.innerHeight - size);
        cube.src = './images/cubeilushiReal.gif';
        cube.className = 'chaos-cube';
        cube.style.width = size + 'px';
        cube.style.height = size + 'px';
        cube.style.left = '0px';
        cube.style.top = '0px';
        cube.style.transform = 'translate(' + x + 'px, ' + y + 'px) rotate(' + Math.random() * 360 + 'deg)';
        chaosLayer.appendChild(cube);
      }
    }

    function showGhost() {
      // Never stack ghost effects or interrupt a real rampage.
      if (ghostActive || rampageTriggered || document.hidden) {
        scheduleGhost();
        return;
      }

      const html = document.documentElement;
      ghostActive = true;
      html.classList.add('snap');
      document.body.classList.add('rampage', 'ghost');
      setTrackInstant(RAMPAGE_TRACK);
      subtitle.textContent = RAMPAGE_SUBTITLE;
      spawnStaticCubes(10);

      // Briefly switch to the rampage track during the jumpscare, then restore normal audio.
      const wasNormalAudioPlaying = !audio.paused;
      const previousAudioTime = audio.currentTime;
      const previousAudioVolume = audio.volume;
      const previousRampageTime = rampageAudio.currentTime;
      const previousRampageVolume = rampageAudio.volume;
      const previousRampageMuted = rampageAudio.muted;

      audio.pause();
      rampageAudio.currentTime = 0;
      rampageAudio.volume = 0.45;
      rampageAudio.muted = audio.muted;
      const ghostAudioAttempt = rampageAudio.play();
      if (ghostAudioAttempt && typeof ghostAudioAttempt.catch === 'function') {
        ghostAudioAttempt.catch(error => {
          // Autoplay may be blocked; the visual jumpscare still works.
          console.log('Ghost rampage audio could not be played:', error);
        });
      }

      setTimeout(() => html.classList.remove('snap'), 150);

      clearTimeout(ghostHideTimer);
      ghostHideTimer = setTimeout(() => {
        hideGhost();

        // Restore the normal soundtrack and its position/volume.
        rampageAudio.pause();
        rampageAudio.currentTime = previousRampageTime;
        rampageAudio.volume = previousRampageVolume;
        rampageAudio.muted = previousRampageMuted;
        audio.currentTime = previousAudioTime;
        audio.volume = previousAudioVolume;
        if (wasNormalAudioPlaying) {
          audio.play().catch(error => console.log('Normal BGM could not be resumed:', error));
        }
      }, GHOST_MS);
    }

    function hideGhost() {
      if (!ghostActive) return;

      const html = document.documentElement;
      ghostActive = false;
      clearTimeout(ghostHideTimer);
      ghostHideTimer = null;

      // Restore every visible element changed by the ghost effect.
      html.classList.add('snap');
      document.body.classList.remove('rampage', 'ghost');
      setTrackInstant(NORMAL_TRACK);
      subtitle.textContent = NORMAL_SUBTITLE;
      chaosLayer.innerHTML = '';

      setTimeout(() => html.classList.remove('snap'), 150);
    }

    function scheduleGhost() {
      clearTimeout(ghostTimer);

      const delay = GHOST_MIN_MS + Math.random() * (GHOST_MAX_MS - GHOST_MIN_MS);
      ghostTimer = setTimeout(() => {
        ghostTimer = null;

        // If the tab is hidden or a real rampage is active, try again later.
        if (rampageTriggered || document.hidden) {
          if (!rampageTriggered) scheduleGhost();
          return;
        }

        showGhost();
        // Schedule the next random ghost only after this one has disappeared.
        ghostTimer = setTimeout(() => {
          ghostTimer = null;
          scheduleGhost();
        }, GHOST_MS + 150);
      }, delay);
    }

    function armIdle() {
      clearTimeout(idleTimer);
      if (rampageTriggered) idleTimer = setTimeout(exitRampageMode, IDLE_MS);
    }
    ['mousemove', 'mousedown', 'keydown', 'touchstart', 'wheel', 'scroll'].forEach(evt => {
      document.addEventListener(evt, armIdle, { passive: true });
    });

    function spawnChaosCubes(amount) {
      const cubes = [];

      for (let i = 0; i < amount; i++) {
        const cube = document.createElement('img');
        const size = 58 + Math.random() * 70;
        const x = Math.random() * Math.max(1, window.innerWidth - size);
        const y = Math.random() * Math.max(1, window.innerHeight - size);
        const vx = (Math.random() * 5 + 2) * (Math.random() > 0.5 ? 1 : -1);
        const vy = (Math.random() * 5 + 2) * (Math.random() > 0.5 ? 1 : -1);
        const rotationSpeed = (Math.random() * 6) - 3;

        cube.src = './images/cubeilushiReal.gif';
        cube.className = 'chaos-cube';
        cube.style.width = size + 'px';
        cube.style.height = size + 'px';
        cube.style.left = '0px';
        cube.style.top = '0px';
        chaosLayer.appendChild(cube);

        cubes.push({ el: cube, x, y, vx, vy, size, angle: Math.random() * 360, rotationSpeed });
      }

      function animate() {
        const maxX = window.innerWidth;
        const maxY = window.innerHeight;

        cubes.forEach(cube => {
          cube.x += cube.vx;
          cube.y += cube.vy;
          cube.angle += cube.rotationSpeed;

          if (cube.x <= 0 || cube.x + cube.size >= maxX) {
            cube.vx *= -1;
            cube.x = Math.max(0, Math.min(cube.x, maxX - cube.size));
          }

          if (cube.y <= 0 || cube.y + cube.size >= maxY) {
            cube.vy *= -1;
            cube.y = Math.max(0, Math.min(cube.y, maxY - cube.size));
          }

          cube.el.style.transform = 'translate(' + cube.x + 'px, ' + cube.y + 'px) rotate(' + cube.angle + 'deg)';
        });

        cubeRaf = requestAnimationFrame(animate);
      }

      cubeRaf = requestAnimationFrame(animate);
    }

    function switchToRampageBgm() {
      audio.volume = 0.15;
      rampageAudio.volume = 0.45;
      rampageAudio.muted = audio.muted;

      const rampageAttempt = rampageAudio.play();
      if (rampageAttempt && typeof rampageAttempt.catch === 'function') {
        rampageAttempt.catch(error => {
          console.log('Rampage BGM could not be played, keeping normal BGM:', error);
          audio.playbackRate = 1.15;
          audio.volume = 0.45;
        });
      }
    }

    function startBackgroundAudio() {
      audio.play().catch(error => {
        console.log('Audio autoplay prevented:', error);
        document.addEventListener('click', function () {
          if (audio.paused) {
            audio.play().catch(err => console.log('Audio play failed:', err));
          }
        }, { once: true });
      });
    }

    audio.volume = 0.3;
    clickSound.volume = 0.5;

    // Mute / unmute (equalizer button next to the song name)
    const muteBtn = document.getElementById('mute-btn');
    muteBtn.addEventListener('click', () => {
      audio.muted = !audio.muted;
      rampageAudio.muted = audio.muted;
      muteBtn.classList.toggle('muted', audio.muted);
      muteBtn.setAttribute('aria-pressed', String(audio.muted));
      muteBtn.setAttribute('aria-label', audio.muted ? 'Unmute audio' : 'Mute audio');
    });

    // Click-to-continue: ripple, dissolve the intro, start the reveal and the music
    const overlay = document.getElementById('overlay');
    function enterSite(e) {
      if (overlay.classList.contains('hidden')) return;
      const rect = overlay.getBoundingClientRect();
      const x = (e && e.clientX) || rect.width / 2;
      const y = (e && e.clientY) || rect.height / 2;
      const ripple = document.createElement('div');
      ripple.className = 'click-ripple';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 1100);

      overlay.classList.add('hidden');
      document.body.classList.add('ambient-active');
      startBackgroundAudio();
    }
    overlay.addEventListener('click', enterSite);
    overlay.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enterSite(); }
    });
  </script>
  <!-- Humanized: small dev signature + easter egg (non-destructive) -->
  <script>
  if (!window.__outoftune_humanized) {
    window.__outoftune_humanized = true;
    console.log('%cOutOfTune — patched with a human touch', 'color:#e0f0ff; font-weight:700');
    function revealTinyEgg(){
      console.log('%cTiny easter egg: you pressed Ctrl+Shift+H', 'color:#ffd1ee; font-weight:700');
      try { document.body.style.outline = '3px dashed rgba(255,160,200,0.08)'; setTimeout(()=>document.body.style.outline='',900); } catch(e){}
    }
    window.addEventListener('keydown', (e)=>{ if(e.ctrlKey && e.shiftKey && (e.key==='H' || e.key==='h')) revealTinyEgg(); });
    window.revealOutOfTune = revealTinyEgg;
  }
  </script>
