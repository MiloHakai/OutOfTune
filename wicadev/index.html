<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wicadev</title>
    <meta name="description" content="Small twitch streamer! :3 — Wicadev on OutOfTune.">
    <!-- Open Graph / Social Media Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wicadev" />
    <meta property="og:description" content="Small twitch streamer! :3 — Wicadev on OutOfTune." />
    <meta property="og:url" content="https://outoftune.dev/wicadev/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Wicadev" />
    <meta name="twitter:description" content="Small twitch streamer! :3 — Wicadev on OutOfTune." />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Moonlit Scene Palette - inspired by the image */
            --bg-dark: #0b1a36;
            /* deep night blue */
            --bg-overlay: rgba(10, 22, 40, 0.85);
            --text-dark: #cfe1f7;
            /* soft moonlight blue */
            --text-glow: #e4efff;
            /* pale moonlight */

            /* Scene Accents */
            --moon-gold: #f6d98e;
            /* warm golden moon */
            --deep-blue: #14305a;
            /* deep water blue */
            --sky-blue: #5f8fd0;
            /* evening sky blue */
            --cloud-blue: #9db9e6;
            /* cloud highlight */
            --horizon-peach: #f0b97f;
            /* warm horizon */
            --water-deep: #1b4a86;
            /* deep water */

            /* Dimmed versions */
            --moon-gold-dim: #c4a86d;
            --deep-blue-dim: #0f2638;
            --sky-blue-dim: #365a7f;

            /* Glows */
            --glow-moon: rgba(246, 217, 142, 0.35);
            --glow-blue: rgba(95, 143, 208, 0.3);
            --glow-water: rgba(27, 74, 134, 0.25);

            --muted: rgba(207, 225, 247, 0.62);

            /* Reveal easing */
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-draw: cubic-bezier(0.65, 0, 0.35, 1);
            --ease-pop: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-dark);
            position: relative;
            background-image: url('./images/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        /* Moonlit scene overlay with gradient */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(90deg, rgba(7, 16, 36, 0.62) 0%, rgba(7, 16, 36, 0.28) 45%, transparent 75%),
                linear-gradient(180deg,
                    rgba(7, 16, 36, 0.50) 0%,
                    rgba(7, 16, 36, 0.28) 45%,
                    rgba(7, 16, 36, 0.38) 78%,
                    rgba(7, 16, 36, 0.66) 100%);
            z-index: 0;
            transition: background 0.4s ease;
        }
        body.ambient-active::before { animation: fadeInSimple 1.2s ease backwards; }

        /* Animated border segments */
        .border-segments {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 1;
        }
        body.ambient-active .border-segments { animation: fadeInSimple 1.6s ease 0.2s backwards; }

        .border-top,
        .border-right,
        .border-bottom,
        .border-left {
            position: absolute;
        }

        /* Moonlit gradient borders */
        .border-top {
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg,
                    transparent 0%,
                    transparent 25%,
                    var(--deep-blue) 35%,
                    var(--moon-gold) 50%,
                    var(--sky-blue) 65%,
                    transparent 75%,
                    transparent 100%);
            background-size: 300% 100%;
            animation: move-horizontal 10s linear infinite;
            filter: blur(0.5px);
            box-shadow: 0 0 15px var(--glow-blue);
        }

        .border-right {
            top: 0;
            right: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg,
                    transparent 0%,
                    transparent 25%,
                    var(--sky-blue) 35%,
                    var(--water-deep) 50%,
                    var(--cloud-blue) 65%,
                    transparent 75%,
                    transparent 100%);
            background-size: 100% 300%;
            animation: move-vertical 10s linear infinite;
            filter: blur(0.5px);
            box-shadow: 0 0 15px var(--glow-water);
        }

        .border-bottom {
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(-90deg,
                    transparent 0%,
                    transparent 25%,
                    var(--moon-gold) 35%,
                    var(--deep-blue) 50%,
                    var(--sky-blue) 65%,
                    transparent 75%,
                    transparent 100%);
            background-size: 300% 100%;
            animation: move-horizontal-reverse 10s linear infinite;
            filter: blur(0.5px);
            box-shadow: 0 0 15px var(--glow-moon);
        }

        .border-left {
            top: 0;
            left: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(-180deg,
                    transparent 0%,
                    transparent 25%,
                    var(--water-deep) 35%,
                    var(--cloud-blue) 50%,
                    var(--deep-blue) 65%,
                    transparent 75%,
                    transparent 100%);
            background-size: 100% 300%;
            animation: move-vertical-reverse 10s linear infinite;
            filter: blur(0.5px);
            box-shadow: 0 0 15px var(--glow-blue);
        }

        /* Border animation timings */
        .border-line-1.border-top { animation-delay: 0s; }
        .border-line-1.border-right { animation-delay: 2.5s; }
        .border-line-1.border-bottom { animation-delay: 5s; }
        .border-line-1.border-left { animation-delay: 7.5s; }
        .border-line-2.border-top { animation-delay: 5s; }
        .border-line-2.border-right { animation-delay: 7.5s; }
        .border-line-2.border-bottom { animation-delay: 0s; }
        .border-line-2.border-left { animation-delay: 2.5s; }

        @keyframes move-horizontal { 0% { background-position: -100% 0; } 100% { background-position: 200% 0; } }
        @keyframes move-horizontal-reverse { 0% { background-position: 200% 0; } 100% { background-position: -100% 0; } }
        @keyframes move-vertical { 0% { background-position: 0 -100%; } 100% { background-position: 0 200%; } }
        @keyframes move-vertical-reverse { 0% { background-position: 0 200%; } 100% { background-position: 0 -100%; } }

        /* Left-aligned content container */
        .container {
            position: relative;
            z-index: 3;
            width: 100%;
            padding-left: 40px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 2.4rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
            position: relative;
            display: inline-block;
            line-height: 1.3;
            padding: 0.5rem 0;
        }

        /* Moonlit wave effect: the colors flow through the name */
        .wave-text {
            background: linear-gradient(100deg, #f6d98e 0%, #f0b97f 18%, #9db9e6 42%, #5f8fd0 62%, #9db9e6 82%, #f6d98e 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: wave-flow 8s linear infinite;
            filter: drop-shadow(0 0 8px rgba(95, 143, 208, 0.25)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
            position: relative;
        }
        body.ambient-active .wave-text {
            animation: revealUp 1s var(--ease-out-expo) 0.35s backwards,
                       wave-flow 8s linear infinite;
        }

        @keyframes wave-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* Per-letter version (the script splits the name into letters so the color flow runs continuously across them; the rules above are the no-JS fallback) */
        .wave-text.split { background: none; animation: none; }
        body.ambient-active .wave-text.split { animation: revealUp 1s var(--ease-out-expo) 0.35s backwards; }

        .wave-text .ch {
            display: inline-block;
            background-image: linear-gradient(100deg, #f6d98e 0%, #f0b97f 18%, #9db9e6 42%, #5f8fd0 62%, #9db9e6 82%, #f6d98e 100%);
            background-repeat: repeat-x;
            /* two word-widths wide, so the flow loops seamlessly and runs continuously across the letters */
            background-size: calc(var(--n) * 2.24em) 100%;
            background-position: calc(var(--i) * -1.12em) 50%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: letterFlow 8s linear infinite;
        }

        @keyframes letterFlow {
            from { background-position: calc(var(--i) * -1.12em) 50%; }
            to { background-position: calc(var(--i) * -1.12em - var(--n) * 2.24em) 50%; }
        }

        h1:hover {
            transform: scale(1.02);
        }

        h1:active {
            transform: scale(0.98);
        }

        /* Underline that draws itself in beneath the title */
        .title-bar {
            height: 2px;
            width: 140px;
            margin-top: 0.5rem;
            background: linear-gradient(90deg, var(--moon-gold), var(--sky-blue) 60%, rgba(95, 143, 208, 0));
            box-shadow: 0 0 10px var(--glow-moon);
        }
        body.ambient-active .title-bar { animation: barDraw 1.1s var(--ease-draw) 0.9s backwards; }

        p {
            margin-top: 2rem;
            font-size: 0.75rem;
            font-family: 'Press Start 2P', monospace;
            font-weight: 400;
            opacity: 0.85;
            letter-spacing: 0.06em;
            line-height: 1.6;
            text-shadow: 0 0 10px var(--glow-blue);
            animation: subtle-glow 8s ease-in-out infinite;
        }
        body.ambient-active .container > p {
            animation: revealUpSub 0.9s var(--ease-out-expo) 0.55s backwards,
                       subtle-glow 8s ease-in-out 1.5s infinite;
        }

        @keyframes subtle-glow {
            0%, 100% {
                opacity: 0.85;
                text-shadow: 0 0 10px var(--glow-blue);
            }

            50% {
                opacity: 0.95;
                text-shadow: 0 0 15px var(--glow-blue),
                    0 0 25px var(--glow-moon);
            }
        }

        .icons {
            margin-top: 1.6rem;
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: flex-start;
        }

        .icons a {
            font-size: 1.2rem;
            color: var(--text-dark);
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            display: inline-block;
        }
        body.ambient-active .icons a { animation: iconPop 0.45s var(--ease-pop) backwards; }
        body.ambient-active .icons a:nth-child(1) { animation-delay: 0.7s; }
        body.ambient-active .icons a:nth-child(2) { animation-delay: 0.78s; }
        body.ambient-active .icons a:nth-child(3) { animation-delay: 0.86s; }
        body.ambient-active .icons a:nth-child(4) { animation-delay: 0.94s; }

        .icons a::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border-radius: 50%;
            background: radial-gradient(circle, var(--glow-moon) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        .icons a:hover {
            color: var(--moon-gold);
            transform: scale(1.15) translateY(-3px);
            filter: drop-shadow(0 0 15px var(--glow-moon)) drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
        }

        .icons a:hover::after {
            opacity: 1;
        }

        .click-counter {
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .click-counter.show {
            opacity: 1;
            transform: translateY(0);
        }

        .click-counter p {
            font-size: 0.65rem;
            color: var(--sky-blue);
            margin: 0;
            text-shadow: 0 0 15px var(--glow-blue),
                0 0 25px var(--glow-moon);
            animation: counter-pulse 2s ease-in-out infinite;
        }

        @keyframes counter-pulse {
            0%, 100% {
                text-shadow: 0 0 15px var(--glow-blue),
                    0 0 25px var(--glow-moon);
            }

            50% {
                text-shadow: 0 0 20px var(--glow-blue),
                    0 0 35px var(--glow-moon),
                    0 0 45px var(--glow-water);
            }
        }

        /* Bottom Left - Track info (same structure as Indura; no lyrics, so the author sits where lyrics would be) */
        .track-box {
            position: fixed;
            left: 40px;
            bottom: 40px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: min(540px, calc(100vw - 80px));
        }
        body.ambient-active .track-box { animation: revealUp 0.9s var(--ease-out-expo) 1.2s backwards; }

        .track-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .track-title {
            font-size: 0.5rem;
            font-weight: bold;
            color: var(--moon-gold);
            letter-spacing: 0.04em;
            text-shadow: 0 0 10px rgba(246, 217, 142, 0.6), 0 0 22px rgba(246, 217, 142, 0.3);
        }

        .track-author {
            font-size: 0.43rem;
            line-height: 1.7;
            color: var(--muted);
            letter-spacing: 0.04em;
        }

        .mute-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .mute-btn:hover { transform: scale(1.15); }
        .mute-btn:focus,
        .mute-btn:focus-visible { outline: none; }
        .mute-btn:focus-visible .eq i { background: #ffffff; }

        /* Muted: bars freeze flat and grey, with a slash through them */
        .mute-btn.muted .eq i {
            animation: none !important;
            transform: scaleY(0.2);
            background: var(--muted);
        }
        .mute-btn.muted::after {
            content: "";
            position: absolute;
            left: 4px;
            right: 4px;
            top: 50%;
            height: 1.5px;
            background: var(--sky-blue);
            transform: rotate(-35deg);
        }

        .eq {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 10px;
            padding-left: 4px;
        }
        .eq i {
            display: block;
            width: 2px;
            height: 100%;
            background: var(--moon-gold);
            transform-origin: bottom;
            transform: scaleY(0.25);
        }
        body.ambient-active .eq i { animation: eqBar 0.9s ease-in-out infinite; }
        body.ambient-active .eq i:nth-child(2) { animation-duration: 0.7s; animation-delay: -0.3s; }
        body.ambient-active .eq i:nth-child(3) { animation-duration: 1.1s; animation-delay: -0.6s; }
        body.ambient-active .eq i:nth-child(4) { animation-duration: 0.8s; animation-delay: -0.15s; }
        @keyframes eqBar {
            0%, 100% { transform: scaleY(0.25); }
            50% { transform: scaleY(1); }
        }

        /* Bottom Right - credits */
        footer {
            position: fixed;
            right: 40px;
            bottom: 40px;
            z-index: 100;
            text-align: right;
            font-size: 0.42rem;
            color: var(--muted);
            font-family: 'Press Start 2P', monospace;
            letter-spacing: 0.05em;
            line-height: 1.7;
            text-shadow: 0 0 8px rgba(95, 143, 208, 0.3);
            padding-top: 10px;
            border-top: 1px solid rgba(246, 217, 142, 0.25);
        }
        body.ambient-active footer { animation: revealUp 0.9s var(--ease-out-expo) 1.4s backwards; }

        footer a {
            color: var(--moon-gold);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        footer a:hover {
            color: var(--sky-blue);
            text-shadow: 0 0 12px var(--glow-blue);
        }

        /* Reveal keyframes */
        @keyframes revealUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes revealUpSub {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 0.85; transform: translateY(0); }
        }
        @keyframes iconPop {
            0% { opacity: 0; transform: translateY(14px) scale(0.4) rotate(-12deg); }
            100% { opacity: 1; transform: none; }
        }
        @keyframes barDraw {
            from { width: 0; opacity: 0; }
            to { width: 140px; opacity: 1; }
        }
        @keyframes fadeInSimple {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* CLICK TO CONTINUE INTRO */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-dark);
            cursor: pointer;
            transition: opacity 0.9s cubic-bezier(0.25, 1, 0.5, 1),
                        transform 1s var(--ease-draw),
                        filter 0.9s ease;
        }
        .overlay.hidden {
            opacity: 0;
            transform: scale(1.12);
            filter: blur(12px);
            pointer-events: none;
        }
        .intro-holder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
            user-select: none;
        }
        .intro-title {
            font-size: clamp(1.1rem, 2.8vw, 1.6rem);
            color: var(--moon-gold);
            opacity: 0;
            transform: translateY(25px);
            animation: introSlideUp 0.9s var(--ease-out-expo) forwards 0.2s,
                       introGlow 2.8s ease-in-out infinite 1.2s;
        }
        .intro-sub-click {
            font-size: clamp(0.45rem, 1.2vw, 0.52rem);
            color: var(--muted);
            letter-spacing: 1px;
            opacity: 0;
            animation: introFade 0.8s ease forwards 0.9s,
                       introBlink 2.2s ease-in-out infinite 1.8s;
        }
        @keyframes introSlideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes introFade { to { opacity: 0.75; } }
        @keyframes introGlow {
            0%, 100% { text-shadow: 0 0 0 rgba(246, 217, 142, 0); }
            50% { text-shadow: 0 0 18px rgba(246, 217, 142, 0.7); }
        }
        @keyframes introBlink { 0%, 100% { opacity: 0.75; } 50% { opacity: 0.3; } }

        /* Ripple that expands from the click point */
        .click-ripple {
            position: fixed;
            z-index: 10000;
            width: 24px;
            height: 24px;
            margin: -12px 0 0 -12px;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(246, 217, 142, 0.55) 0%, rgba(246, 217, 142, 0) 70%);
            animation: ripple 1s var(--ease-out-expo) forwards;
        }
        @keyframes ripple {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(90); opacity: 0; }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            p {
                font-size: 0.65rem;
            }

        }

        @media (max-width: 600px) {
            body { align-items: center; justify-content: center; }

            .container { padding-left: 0; align-items: center; text-align: center; }

            h1 {
                font-size: 1.4rem;
            }

            p {
                font-size: 0.6rem;
                margin-top: 1.5rem;
            }

            .icons {
                gap: 1rem;
                margin-top: 1.5rem;
                justify-content: center;
            }

            .icons a {
                font-size: 1.1rem;
            }

            .track-box { left: 24px; bottom: 24px; }
            .track-title { font-size: 0.42rem; }
            .track-author { font-size: 0.36rem; }

            footer {
                right: 24px;
                bottom: 24px;
                font-size: 0.35rem;
            }

        }

        /* Scanline effect */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 0, 0, 0.05) 0px,
                    transparent 1px,
                    transparent 2px,
                    rgba(0, 0, 0, 0.05) 3px);
            pointer-events: none;
            z-index: 4;
            opacity: 0.3;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-delay: 0s !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div id="overlay" class="overlay" role="button" tabindex="0" aria-label="Click to continue">
        <div class="intro-holder">
            <div class="intro-title">Wicadev</div>
            <div class="intro-sub-click">click here to continue</div>
        </div>
    </div>

    <!-- Animated Border Lines -->
    <div class="border-segments">
        <div class="border-top border-line-1"></div>
        <div class="border-right border-line-1"></div>
        <div class="border-bottom border-line-1"></div>
        <div class="border-left border-line-1"></div>
        <div class="border-top border-line-2"></div>
        <div class="border-right border-line-2"></div>
        <div class="border-bottom border-line-2"></div>
        <div class="border-left border-line-2"></div>
    </div>

    <div class="container">
        <h1 id="username" class="wave-text" onclick="playClickSound()">Wicadev</h1>
        <div class="title-bar" aria-hidden="true"></div>
        <p>Small twitch streamer! :3</p>

        <div id="clickCounter" class="click-counter" style="display: none;">
            <p>Hey! You clicked me <span id="clickCount">0</span> times.</p>
        </div>

        <div class="icons">

    <!-- Audio element for background music -->

    <!-- Audio element for click sound effect -->
    <audio id="clickSound" preload="auto">
        <source src="./click-sound.mp3" type="audio/mpeg">
        <source src="./click-sound.ogg" type="audio/ogg">
        Your browser does not support the audio element.
    </audio>

    <script>
        // Split the name into letters for the wave
        (function splitName() {
            const h1 = document.getElementById('username');
            const text = h1.textContent.trim();
            h1.setAttribute('aria-label', text);
            h1.textContent = '';
            h1.style.setProperty('--n', text.length);
            Array.from(text).forEach((c, i) => {
                const span = document.createElement('span');
                span.className = 'ch';
                span.setAttribute('aria-hidden', 'true');
                span.style.setProperty('--i', i);
                span.textContent = c;
                h1.appendChild(span);
            });
            h1.classList.add('split');
        })();

        // Click counter functionality
        let clickCount = 0;
        const clickCounter = document.getElementById('clickCounter');
        const clickCountSpan = document.getElementById('clickCount');

        // Function to play click sound and update counter
        function playClickSound() {
            const clickSound = document.getElementById('clickSound');
            clickSound.currentTime = 0;
            clickSound.play().catch(error => {
                console.log('Click sound could not be played:', error);
            });

            // Update click counter
            clickCount++;
            clickCountSpan.textContent = clickCount;

            // Show the counter after first click
            if (clickCount === 1) {
                clickCounter.style.display = 'block';
                setTimeout(() => {
                    clickCounter.classList.add('show');
                }, 10);
            }
        }

        // Audio functionality for background music
        const audio = document.getElementById('backgroundAudio');

        // Function to start background audio
        function startBackgroundAudio() {
            audio.play().catch(error => {
                console.log('Audio autoplay prevented:', error);
                document.addEventListener('click', function () {
                    if (audio.paused) {
                        audio.play().catch(err => console.log('Audio play failed:', err));
                    }
                }, {
                    once: true
                });
            });
        }

        // Set audio volumes
        audio.volume = 0.3;
        const clickSound = document.getElementById('clickSound');
        clickSound.volume = 0.5;

        // Mute / unmute (equalizer button next to the song name)
        const muteBtn = document.getElementById('mute-btn');
        muteBtn.addEventListener('click', () => {
            audio.muted = !audio.muted;
            muteBtn.classList.toggle('muted', audio.muted);
            muteBtn.setAttribute('aria-pressed', String(audio.muted));
            muteBtn.setAttribute('aria-label', audio.muted ? 'Unmute audio' : 'Mute audio');
        });

        // Click-to-continue: ripple, dissolve the intro, start the reveal and the music
        const overlay = document.getElementById('overlay');
        function enterSite(e) {
            if (overlay.classList.contains('hidden')) return;
            const rect = overlay.getBoundingClientRect();
            const x = (e && e.clientX) || rect.width / 2;
            const y = (e && e.clientY) || rect.height / 2;
            const ripple = document.createElement('div');
            ripple.className = 'click-ripple';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 1100);

            overlay.classList.add('hidden');
            document.body.classList.add('ambient-active');
            startBackgroundAudio();
        }
        overlay.addEventListener('click', enterSite);
        overlay.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enterSite(); }
        });
    </script>

    <!-- Humanized: small dev signature + easter egg (non-destructive) -->
    <script>
        if (!window.__outoftune_humanized) {
            window.__outoftune_humanized = true;
            console.log('%cOutOfTune — patched with a human touch', 'color:#9ee6ff; font-weight:700');
            function revealTinyEgg(){
                console.log('%cTiny easter egg: you pressed Ctrl+Shift+H', 'color:#ffd1ee; font-weight:700');
                try { document.body.style.outline = '3px dashed rgba(255,160,200,0.08)'; setTimeout(()=>document.body.style.outline='',900); } catch(e){}
            }
            window.addEventListener('keydown', (e)=>{ if(e.ctrlKey && e.shiftKey && (e.key==='H' || e.key==='h')) revealTinyEgg(); });
            window.revealOutOfTune = revealTinyEgg;
        }
    </script>
