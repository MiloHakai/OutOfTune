  <style>
    @property --sky-top { syntax: '<color>'; inherits: true; initial-value: #070a1c; }
    @property --sky-mid { syntax: '<color>'; inherits: true; initial-value: #0b1030; }
    @property --sky-bottom { syntax: '<color>'; inherits: true; initial-value: #1a1440; }
    @property --sun-core { syntax: '<color>'; inherits: true; initial-value: #fff1d0; }
    @property --sun-mid { syntax: '<color>'; inherits: true; initial-value: #ffb347; }
    @property --sun-edge { syntax: '<color>'; inherits: true; initial-value: #ff7a2f; }
    @property --sun-glow { syntax: '<color>'; inherits: true; initial-value: rgba(255,160,90,0.4); }
    @property --horizon-color { syntax: '<color>'; inherits: true; initial-value: rgba(255,150,80,0); }

    :root {
      transition: --sky-top 1.2s ease, --sky-mid 1.2s ease, --sky-bottom 1.2s ease,
        --sun-core 1.2s ease, --sun-mid 1.2s ease, --sun-edge 1.2s ease,
        --sun-glow 1.2s ease, --horizon-color 1.2s ease;
      /* --- Palette: pastel moonlight default (night) --- */
      --bg: #050505;
      --bg2: #070707;
      --text: #f2f0ff;
      --text-dim: rgba(220, 226, 255, 0.82);
      --line: rgba(255, 250, 255, 0.92);
      --line-soft: rgba(230, 228, 255, 0.55);
      --glow: rgba(190, 198, 255, 0.38);

      /* Layout offsets matching image_86448b.jpg */
      --gutter: 20px;

      /* Space plate background elements */
      --band-strong: rgba(255, 255, 255, 0.20);
      --band-soft: rgba(255, 255, 255, 0.08);
      --mist: rgba(255, 255, 255, 0.06);
      --dust: rgba(255, 255, 255, 0.12);

      /* CRT Overlays */
      --scanline: rgba(0, 0, 0, 0.18);
      --vignette: rgba(0, 0, 0, 0.4);

      /* Dynamic sky variables (controlled by calendar scripts) */
      --sky-top: #070a1c;
      --sky-mid: #0b1030;
      --sky-bottom: #1a1440;
      --accent: #d4c4ff;
      --star-rgb: 255,255,255; 
      --star-density: 1; 
      --wave-a: #f8f6ff;
      --wave-b: #c4b5fd;
      --flicker-overlay: rgba(255,255,255,0.006);
      --icon: rgba(208, 214, 255, 0.9);

      /* Sun / Moon light profiles */
      --sun-core: #fff1d0;
      --sun-mid: #ffb347;
      --sun-edge: #ff7a2f;
      --sun-glow: rgba(255, 160, 90, 0.40);
      --sun-opacity: 1;
      --sun-sink: 0;
      --sun-ray-opacity: 0.35;
      --horizon-color: rgba(255, 150, 80, 0);
      --horizon-opacity: 0;
      --moon-rim: rgba(248, 246, 255, 0.95);
      --moon-rim-soft: rgba(198, 192, 235, 0.55);
      --moon-halo: rgba(165, 158, 220, 0.45);

      /* Solar path coordinates */
      --sun-left: 8%;
      --sun-top: 55%;
      --sun-scale: 1.0;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: 'Press Start 2P', 'Lexend', 'Noto Sans JP', monospace;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }

    body {
      position: relative;
      background: var(--bg);
      transition: background 0.35s ease, color 0.35s ease;
      padding-left: 8px;
      padding-right: 8px;
    }

    /* ─────────────────────────────────────────────────────────────
       SPACE PLATE BACKGROUND (galaxy band + dithering + crescents)
       ───────────────────────────────────────────────────────────── */

    .wave-text {
      background: linear-gradient(90deg,
          var(--wave-a) 0%,
          var(--wave-a) 38%,
          var(--wave-b) 50%,
          var(--wave-a) 62%,
          var(--wave-a) 100%);

      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: wave-effect 6s linear infinite;

      text-shadow:
        0 0 12px var(--glow),
        0 0 22px color-mix(in srgb, var(--accent) 55%, transparent);
      -webkit-text-stroke: 0.22px color-mix(in srgb, var(--line-soft) 70%, transparent);
    }

    .space-plate {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 90% 65% at 50% 18%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 75%),
        radial-gradient(ellipse 120% 40% at 50% 108%, var(--horizon-color), transparent 70%),
        linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bottom) 100%);
    }

    /* Warm band of light hugging the horizon during golden hour / dusk */
    .horizon-glow {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 46vh;
      z-index: 1;
      pointer-events: none;
      opacity: var(--horizon-opacity);
      background: linear-gradient(0deg, var(--horizon-color) 0%, transparent 100%);
      mix-blend-mode: screen;
      transition: opacity 1.2s ease;
    }

    /* Cosmic visual noise & breathing galactic nebulae */
    .space-plate::before {
      content: "";
      position: absolute;
      inset: -30%;
      transform: rotate(-16deg) scale(1.22);
      opacity: 0.96;
      background:
        radial-gradient(ellipse 160% 32% at 70% 58%,
          var(--band-strong) 0%,
          var(--band-soft) 36%,
          var(--band-soft) 56%,
          transparent 76%),
        radial-gradient(ellipse 85% 50% at 20% 30%,
          var(--mist) 0%,
          color-mix(in srgb, var(--accent) 9%, transparent) 45%,
          transparent 74%),
        radial-gradient(ellipse 70% 45% at 88% 80%,
          color-mix(in srgb, var(--accent) 10%, transparent) 0%,
          transparent 72%);
      filter: blur(1.5px);
      animation: galaxy-drift 45s ease-in-out infinite alternate;
    }

    @keyframes galaxy-drift {
      0% { transform: rotate(-16deg) scale(1.22) translateY(0); }
      100% { transform: rotate(-14deg) scale(1.24) translateY(-14px); }
    }

    .space-plate::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.24;
      mix-blend-mode: screen;
      background-image: radial-gradient(var(--dust) 1px, transparent 1px);
      background-size: 2px 2px;
    }

    /* Single high-fidelity crescent moon placed in top-right of page */
    .moon {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
      opacity: 0.75;
      filter: drop-shadow(0 0 16px var(--moon-halo, var(--glow)));
      transition: opacity 1.2s ease, transform 1.2s ease, filter 1.2s ease;
      width: 180px;
      height: 180px;
      top: 15%;
      right: 12%;
      background:
        radial-gradient(circle at 30% 30%,
          transparent 58%,
          var(--moon-rim, var(--line)) 59%,
          var(--moon-rim, var(--line)) 62%,
          var(--moon-rim-soft, var(--line-soft)) 66%,
          transparent 72%);
    }

    /* ── SUN: layered halo + rays + shaded disc + lens streak ── */
    .sun {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      width: 220px;
      height: 220px;
      top: 12%;
      left: 78%;
      transform: translate(-50%, 0) scale(1);
      opacity: 0;
      transition: opacity 1s ease, left 1.5s cubic-bezier(0.4, 0, 0.2, 1), top 1.5s cubic-bezier(0.4, 0, 0.2, 1), transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sun > * { position: absolute; pointer-events: none; }

    .sun-halo {
      inset: -130%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--sun-glow) 0%,
        color-mix(in srgb, var(--sun-glow) 40%, transparent) 22%, transparent 58%);
      animation: sun-breathe 7s ease-in-out infinite;
    }

    .sun-rays {
      inset: -45%;
      border-radius: 50%;
      opacity: calc(var(--sun-ray-opacity) * 0.45);
      background: repeating-conic-gradient(from 0deg,
        transparent 0deg,
        color-mix(in srgb, var(--sun-core) 55%, transparent) 9deg,
        transparent 18deg);
      filter: blur(9px);
      -webkit-mask-image: radial-gradient(circle, transparent 24%, rgba(0,0,0,0.9) 36%, transparent 66%);
      mask-image: radial-gradient(circle, transparent 24%, rgba(0,0,0,0.9) 36%, transparent 66%);
      animation: sun-spin 240s linear infinite;
      transition: opacity 1.2s ease;
    }

    .sun-disc {
      inset: 14%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 36% 32%, color-mix(in srgb, var(--sun-core) 55%, var(--sun-mid)) 0%,
          var(--sun-mid) 48%, var(--sun-edge) 100%);
      box-shadow:
        0 0 34px 8px var(--sun-glow),
        0 0 90px 28px color-mix(in srgb, var(--sun-glow) 55%, transparent),
        inset -10px -14px 28px color-mix(in srgb, var(--sun-edge) 70%, transparent);
      /* the lower part melts into the horizon haze as the sun sinks */
      -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - var(--sun-sink) * 62%), transparent 100%);
      mask-image: linear-gradient(180deg, #000 calc(100% - var(--sun-sink) * 62%), transparent 100%);
    }

    /* Logo wireframe wrapped on the disc: a slowly turning globe */

      inset: 0;
      border-radius: 50%;
      background: var(--sun-core);

      -webkit-mask: var(--globe-img) center / 100% 100% no-repeat;
      mask: var(--globe-img) center / 100% 100% no-repeat;
      animation: globe-turn 90s linear infinite;
      filter: drop-shadow(0 1px 1px color-mix(in srgb, var(--sun-edge) 55%, transparent));
    }

    /* sphere shading so the flat logo reads as a ball */
    .sun-disc::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      background:
        radial-gradient(circle at 33% 28%, rgba(255,255,255,0.22) 0%, transparent 32%),
        radial-gradient(circle at 50% 50%, transparent 52%, rgba(40,10,0,0.22) 100%);
    }

    @keyframes globe-turn { to { transform: rotate(360deg); } }

    .sun-streak {
      left: -90%; right: -90%;
      top: 50%;
      height: 3px;
      margin-top: -1px;
      border-radius: 50%;
      background: linear-gradient(90deg, transparent, var(--sun-glow) 35%,
        var(--sun-core) 50%, var(--sun-glow) 65%, transparent);
      filter: blur(1.5px);
      opacity: calc(0.25 + var(--sun-sink) * 0.55);
    }

    @keyframes sun-breathe {
      0%, 100% { transform: scale(1); opacity: 0.92; }
      50% { transform: scale(1.06); opacity: 1; }
    }

    @keyframes sun-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes moon-bob {
      0% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-6px) rotate(0.2deg); }
      100% { transform: translateY(0) rotate(0); }
    }

    [data-sky="day"] .sun,
    [data-sky="sunset"] .sun,
    [data-sky="indigo"] .sun {
      opacity: var(--sun-opacity);
      left: var(--sun-left);
      top: var(--sun-top);
      transform: translate(-50%, 0) scale(var(--sun-scale));
    }
    [data-sky="night"] .sun { opacity: 0; transform: translate(-50%, 10%) scale(0.7); }

    [data-sky="day"] .moon { opacity: 0; transform: translateY(-28px) scale(0.9); filter: blur(0.6px); pointer-events: none; }
    [data-sky="sunset"] .moon { opacity: 0.35; transform: translateY(-8px) scale(0.95); filter: blur(0); }
    [data-sky="indigo"] .moon { opacity: 0.7; transform: translateY(-4px) scale(0.98); filter: blur(0); }
    [data-sky="night"] .moon { opacity: 0.98; transform: translateY(0) scale(1); animation: moon-bob 12s ease-in-out infinite; }

    #trailCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 900;
      pointer-events: none;
    }

    #starCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* ─────────────────────────────────────────────────────────────
       CRT OVERLAY & NOISE
       ───────────────────────────────────────────────────────────── */

    .crt-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }

    .crt-overlay::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg,
          var(--scanline) 0px,
          var(--scanline) 2px,
          transparent 2px,
          transparent 5px);
      animation: scanScroll 10s linear infinite;
    }

    @keyframes scanScroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(5px); }
    }

    .crt-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 130% 115% at 50% 48%,
          transparent 0%,
          transparent 58%,
          color-mix(in srgb, var(--vignette) 72%, transparent) 85%,
          var(--vignette) 100%);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: var(--flicker-overlay);
      pointer-events: none;
      z-index: 998;
      animation: flicker 6.5s ease-in-out infinite;
      opacity: 0;
    }

    @keyframes flicker {
      0%, 100% { opacity: 0; }
      50% { opacity: 0.28; }
    }

    /* ─────────────────────────────────────────────────────────────
       NEON BORDER FRAME SYSTEM
       ───────────────────────────────────────────────────────────── */

    .border-segments {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 6;
    }

    .border-top,
    .border-right,
    .border-bottom,
    .border-left {
      position: absolute;
      box-shadow: 0 0 10px var(--glow);
      animation: border-glow 4.5s ease-in-out infinite;
      transition: box-shadow 1s ease, filter 1s ease;
    }

    .border-top { top: 0; left: 0; right: 0; height: 3px; }
    .border-right { top: 0; right: 0; bottom: 0; width: 3px; }
    .border-bottom { bottom: 0; left: 0; right: 0; height: 3px; }
    .border-left { top: 0; left: 0; bottom: 0; width: 3px; }

    .border-top::after,
    .border-right::after,
    .border-bottom::after,
    .border-left::after {
      content: '';
      position: absolute;
      will-change: transform, opacity;
      border-radius: 4px;
      opacity: 0;
    }

    .border-top::after,
    .border-bottom::after {
      top: -1px;
      bottom: -1px;
      width: 15vw;
    }

    .border-top::after {
      left: 0;
      background: linear-gradient(90deg, transparent, var(--line-soft), var(--line), var(--line-soft), transparent);
      animation: snake-ltr 12s linear infinite;
    }

    .border-bottom::after {
      right: 0;
      background: linear-gradient(270deg, transparent, var(--line-soft), var(--line), var(--line-soft), transparent);
      animation: snake-rtl 12s linear infinite;
    }

    .border-right::after,
    .border-left::after {
      left: -1px;
      right: -1px;
      height: 15vh;
    }

    .border-right::after {
      top: 0;
      background: linear-gradient(180deg, transparent, var(--line-soft), var(--line), var(--line-soft), transparent);
      animation: snake-ttb 12s linear infinite;
    }

    .border-left::after {
      bottom: 0;
      background: linear-gradient(0deg, transparent, var(--line-soft), var(--line), var(--line-soft), transparent);
      animation: snake-btt 12s linear infinite;
    }

    .border-line-1.border-top::after { animation-delay: 0s; }
    .border-line-1.border-right::after { animation-delay: 3s; }
    .border-line-1.border-bottom::after { animation-delay: 6s; }
    .border-line-1.border-left::after { animation-delay: 9s; }
    .border-line-2.border-top::after { animation-delay: 6s; }
    .border-line-2.border-right::after { animation-delay: 9s; }
    .border-line-2.border-bottom::after { animation-delay: 0s; }
    .border-line-2.border-left::after { animation-delay: 3s; }

    @keyframes snake-ltr {
      0% { transform: translateX(-15vw); opacity: 1; }
      25% { transform: translateX(100vw); opacity: 1; }
      25.01%, 100% { transform: translateX(100vw); opacity: 0; }
    }

    @keyframes snake-ttb {
      0% { transform: translateY(-15vh); opacity: 1; }
      25% { transform: translateY(100vh); opacity: 1; }
      25.01%, 100% { transform: translateY(100vh); opacity: 0; }
    }

    @keyframes snake-rtl {
      0% { transform: translateX(15vw); opacity: 1; }
      25% { transform: translateX(-100vw); opacity: 1; }
      25.01%, 100% { transform: translateX(-100vw); opacity: 0; }
    }

    @keyframes snake-btt {
      0% { transform: translateY(15vh); opacity: 1; }
      25% { transform: translateY(-100vh); opacity: 1; }
      25.01%, 100% { transform: translateY(-100vh); opacity: 0; }
    }

    @keyframes border-glow {
      0%, 100% {
        opacity: 0.75;
        filter: drop-shadow(0 0 8px var(--glow));
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 14px var(--glow)) drop-shadow(0 0 6px var(--line-soft));
      }
    }

    /* ─────────────────────────────────────────────────────────────
       CORE LAYOUT & GRID ALIGNMENT (20px INNER SPACING)
       ───────────────────────────────────────────────────────────── */

    .container {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start; 
      justify-content: center;
      padding-left: calc(var(--gutter) + 12px); 
      padding-right: calc(var(--gutter) + 12px); 
      text-align: left;
      box-sizing: border-box;
      width: calc(100% - 24px);
      max-width: none;
    }

    /* Hero block: title, tagline, icons. One consistent vertical rhythm,
       and the click counter floats below it so nothing ever jumps. */
    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: 100%;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      cursor: pointer;
      user-select: none;
      position: relative;
      display: inline-block;
      line-height: 1.25;
      color: var(--text);
      text-shadow:
        0 0 10px var(--glow),
        0 0 8px color-mix(in srgb, var(--accent) 45%, transparent);
      animation: titlePulse 4s ease-in-out infinite;
    }

    @keyframes titlePulse {
      0%, 100% {
        text-shadow:
          0 0 10px var(--glow),
          0 0 8px color-mix(in srgb, var(--accent) 45%, transparent);
      }
      50% {
        text-shadow:
          0 0 14px var(--glow),
          0 0 12px color-mix(in srgb, var(--accent) 55%, transparent);
      }
    }

    @keyframes wave-effect {
      0% { background-position: 200% 0; }
      100% { background-position: -100% 0; }
    }

    p {
      font-size: 0.55rem;
      line-height: 2.1;
      margin: 0.9rem 0 0;
      color: var(--text-dim);
      text-shadow:
        0 0 1px color-mix(in srgb, var(--text) 22%, transparent),
        0 0 8px var(--glow);
      letter-spacing: 0.05em;
    }

    .icons {
      display: flex;
      gap: 1.8rem;
      margin-top: 1.5rem;
    }

    .icons a {
      color: var(--icon);
      font-size: 1.2rem;
      transition: all 0.25s ease;
      position: relative;
      text-shadow:
        0 0 1px color-mix(in srgb, var(--icon) 35%, transparent),
        0 0 10px var(--glow);
    }

    .icons a:hover {
      color: var(--accent);
      transform: translateY(-4px) scale(1.1);
      text-shadow: 0 0 18px var(--accent);
    }

    .icons a::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%) scaleX(0);
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, var(--accent) 0%, var(--line) 100%);
      box-shadow: 0 0 10px var(--accent);
      transition: transform 0.25s ease;
    }

    .icons a:hover::after {
      transform: translateX(-50%) scaleX(1);
    }

    /* Click counter system */
    @property --m { syntax: '<percentage>'; inherits: false; initial-value: 100%; }

    .click-counter {
      position: absolute;
      top: calc(100% + 1.1rem - 6px);
      left: -10px;
      margin: 0;
      padding: 6px 10px;      /* room so the text glow is never clipped */
      white-space: nowrap;
      font-size: 0.52rem;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      will-change: opacity, transform;
    }

    /* enter: a soft edge sweeps left to right while the text settles in.
       Frame 0 already shows the start of the text, so there is never a blank frame. */
    .click-counter.show {
      visibility: visible;
      animation: counter-in 0.5s cubic-bezier(0.25, 0.6, 0.35, 1) both;
      -webkit-mask-image: linear-gradient(90deg, #000 var(--m), transparent calc(var(--m) + 35%));
      mask-image: linear-gradient(90deg, #000 var(--m), transparent calc(var(--m) + 35%));
    }

    @keyframes counter-in {
      0%   { --m: -8%;  opacity: 0.55; transform: translateX(-12px); filter: blur(2.5px); }
      100% { --m: 100%; opacity: 1;    transform: translateX(0);      filter: blur(0); }
    }

    /* leave: continues in the same direction and dissolves */
    .click-counter.show.leaving {
      animation: counter-out 0.3s ease-in both;
      -webkit-mask-image: none;
      mask-image: none;
    }

    @keyframes counter-out {
      0%   { opacity: 1; transform: translateX(0);    filter: blur(0); }
      100% { opacity: 0; transform: translateX(14px); filter: blur(2px); }
    }

    .click-counter p {
      margin: 0;
      color: var(--text-dim);
      text-shadow:
        0 0 1px color-mix(in srgb, var(--text) 20%, transparent),
        0 0 8px var(--glow);
    }

    #clickCount {
      display: inline-block;
      color: var(--text);
      text-shadow:
        0 0 1px color-mix(in srgb, var(--text) 25%, transparent),
        0 0 10px var(--glow);
    }

    #clickCount.bump { animation: count-bump 0.2s ease-out; }
    @keyframes count-bump {
      0% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-3px) scale(1.35); color: var(--accent); }
      100% { transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .sun-rays, .sun-halo, .sun-globe { animation: none; }
      .click-counter.show, .click-counter.show.leaving { animation-duration: 0.01s; }
      .click-counter.show { -webkit-mask-image: none; mask-image: none; }
    }

    /* ─────────────────────────────────────────────────────────────
       PREMIUM DOCK FOOTER LAYOUT
       ───────────────────────────────────────────────────────────── */

    footer {
      position: fixed;
      bottom: var(--gutter);
      left: calc(var(--gutter) + 12px);
      right: calc(var(--gutter) + 12px);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 10;
      box-sizing: border-box;
      pointer-events: none;
    }

    .footer-left {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: flex-start;
      text-align: left;
      pointer-events: auto;
      max-width: 55vw;
    }

    .song-title {
      font-family: 'Press Start 2P', 'Noto Sans JP', monospace;
      font-size: 0.50rem;
      line-height: 1.4;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-shadow:
        0 0 1px color-mix(in srgb, var(--text) 18%, transparent),
        0 0 8px var(--glow);
    }

    /* PREMIUM VIEWPORT SCROLLER SYSTEM FOR LYRICS (Tightened Line spacing) */
    .lyrics-viewport {
      position: relative;
      height: 1.1rem; 
      width: 100%;
      overflow: hidden;
      padding-left: 12px;
      padding-right: 12px;
      box-sizing: border-box;
    }

    .lyric-line {
      position: absolute;
      left: 0;
      right: 0;
      font-family: 'Lexend', 'Noto Sans JP', sans-serif;
      font-weight: 400;
      font-size: 0.50rem; /* Perfectly scaled to fit tight spaces without clipping */
      font-stretch: expanded;
      color: var(--text-dim);
      opacity: 0;
      letter-spacing: 0.08em;
      text-shadow: 0 0 6px var(--glow);
      line-height: 1.3; /* Tight line heights remove vertically stretched illusion */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transform: translateY(14px); /* starting coordinate */
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    }

    .lyric-line.active {
      opacity: 0.95;
      transform: translateY(0);
    }

    .lyric-line.exit {
      opacity: 0;
      transform: translateY(-14px); /* smooth push-up exit */
    }

    .footer-right {
      text-align: right;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.48rem;
      line-height: 1.4; /* Compact line spacing eliminates visual stretching */
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-shadow:
        0 0 1px color-mix(in srgb, var(--text) 18%, transparent),
        0 0 8px var(--glow);
      pointer-events: auto;
      padding-right: 12px;
      box-sizing: border-box;
    }

    /* ─────────────────────────────────────────────────────────────
       SPLASH REVEAL — hide UI chrome until the splash is dismissed
       ───────────────────────────────────────────────────────────── */

    body.splash-active .container,
    body.splash-active footer,
    body.splash-active .border-segments,
    body.splash-active .sky-widget,
    body.splash-active .lanyard-card {
      opacity: 0;
      pointer-events: none;
      /* no transition here — transition fires on the way OUT (class removal) */
    }

    /* Fade-in for every revealed element once splash-active is removed */
    .container,
    footer,
    .border-segments,
    .sky-widget,
    .lanyard-card {
      transition: opacity 0.9s ease;
    }

    /* ─────────────────────────────────────────────────────────────
       SPLASH AUDIO GATEWAY SYSTEM
       ───────────────────────────────────────────────────────────── */

    .splash-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.85s ease, visibility 0.85s ease;
    }

    .splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
    }

    .typing-text {
      display: inline-block;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid color-mix(in srgb, var(--accent) 55%, var(--line));
      padding-right: 6px;
      color: var(--text);
      text-shadow:
        0 0 1px color-mix(in srgb, var(--text) 30%, transparent),
        0 0 12px var(--glow);
      letter-spacing: 0.15em;
      font-size: 1.25rem;
    }

    .typing-text.typing {
      animation: blinkCaret 0.75s step-end infinite;
    }

    @keyframes blinkCaret {
      from, to { border-color: transparent; }
      50% { border-color: var(--line); }
    }

    .splash-hint {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.45rem;
      color: var(--text-dim);
      letter-spacing: 0.15em;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      margin-top: 0.8rem;
      pointer-events: none;
    }

    .splash-hint.show {
      opacity: 0.75;
      transform: translateY(0);
      animation: hintBlink 2.2s ease-in-out infinite;
    }

    @keyframes hintBlink {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.85; }
    }

    /* ─────────────────────────────────────────────────────────────
       MOBILE VIEWPORT ADAPTATION
       ───────────────────────────────────────────────────────────── */

    @media (max-width: 768px) {
      .container {
        height: 100%;
        height: 100dvh;
        width: 100%;              /* body already has 8px side padding, so this is dead centre */
        padding-left: calc(var(--gutter) - 8px);
        padding-right: calc(var(--gutter) - 8px);
        /* symmetric padding = hero sits on the true vertical centre of the screen */
        padding-top: 76px;
        padding-bottom: 76px;
        align-items: center;
        text-align: center;
      }
      .hero {
        align-items: center;
        /* centred on tall phones; only lifts when the Discord card (measured live) would be too close */
        transform: translateY(min(-8px, calc(50dvh - 300px - var(--card-h, 72px))));
      }
      /* cancel the trailing letter-spacing so centred text is optically centred */
      h1 { font-size: clamp(1.3rem, 6.4vw, 1.6rem); margin-right: -0.08em; }
      .hero p { margin-right: -0.05em; }
      .hero p { max-width: 34ch; text-wrap: balance; }
      .icons { justify-content: center; }

      .click-counter {
        left: 0;
        right: 0;
        text-align: center;
      }

      .moon {
        width: 130px;
        height: 130px;
        top: 8%;
        right: 8%;
      }

      /* smaller sun that stays on screen */
      .sun { width: 150px; height: 150px; }
      [data-sky="day"] .sun,
      [data-sky="sunset"] .sun,
      [data-sky="indigo"] .sun { left: calc(var(--sun-left) - 9%); }

      /* footer stacks and centres: song, lyric, copyright */
      footer {
        left: var(--gutter);
        right: var(--gutter);
        bottom: var(--gutter);
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        text-align: center;
      }
      .footer-left {
        width: 100%;
        max-width: 100%;
        align-items: center;
      }
      .footer-audio-header { justify-content: center; flex-wrap: wrap; }
      .song-title { text-align: center; }
      .lyrics-viewport { padding-left: 0; padding-right: 0; }
      .lyric-line { text-align: center; }
      .footer-right { text-align: center; padding-right: 0; width: 100%; opacity: 0.8; }
    }

    @media (max-width: 768px) and (max-height: 640px) {
      .container { padding-top: 64px; padding-bottom: 64px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .border-top,
      .border-right,
      .border-bottom,
      .border-left {
        animation: none !important;
      }
      .border-top::after,
      .border-right::after,
      .border-bottom::after,
      .border-left::after {
        animation: none !important;
        opacity: 0 !important;
      }
      .crt-overlay::before,
      body::before,
      h1,
      .splash-hint {
        animation: none !important;
      }
    }

    /* ─────────────────────────────────────────────────────────────
       CELESTIAL CLOCK & THEME DROPDOWN (Pure Floating Typography)
       ───────────────────────────────────────────────────────────── */
    .sky-widget {
      position: fixed;
      top: calc(var(--gutter) + 12px);
      left: calc(var(--gutter) + 14px);
      z-index: 1002;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .sky-clock-trigger {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-dim);
      transition: color 0.25s ease, text-shadow 0.25s ease;
      font-family: 'Press Start 2P', monospace;
      outline: none;
      text-shadow: 0 0 6px var(--glow);
    }

    .sky-clock-trigger:hover,
    .sky-clock-trigger.open {
      color: var(--text);
      text-shadow: 0 0 10px var(--accent);
    }

    .clock-live {
      font-size: 0.50rem;
      letter-spacing: 0.06em;
    }

    .clock-tz {
      font-size: 0.38rem;
      color: var(--text-dim);
      opacity: 0.8;
      letter-spacing: 0.04em;
    }

    .dropdown-chevron {
      width: 8px;
      height: 8px;
      stroke: var(--text-dim);
      transition: transform 0.25s ease, stroke 0.25s ease;
    }

    .sky-clock-trigger:hover .dropdown-chevron,
    .sky-clock-trigger.open .dropdown-chevron {
      stroke: var(--accent);
    }

    .sky-clock-trigger.open .dropdown-chevron {
      transform: rotate(180deg);
    }

    .sky-dropdown-menu {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 2px 0 0 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);
      transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.2s ease;
      pointer-events: none;
    }

    .sky-dropdown-menu.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }

    .sky-dropdown-item {
      background: transparent;
      border: none !important;
      box-shadow: none !important;
      outline: none;
      cursor: pointer;
      padding: 3px 0;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text-dim);
      opacity: 0.70;
      transition: all 0.2s ease;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.40rem;
      letter-spacing: 0.06em;
      text-align: left;
      text-shadow: 0 0 4px var(--glow);
    }

    .sky-dropdown-item svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .sky-dropdown-item:hover {
      color: var(--text);
      opacity: 1;
      text-shadow: 0 0 8px var(--glow);
      transform: translateX(3px);
    }

    .sky-dropdown-item.active {
      color: var(--accent);
      opacity: 1;
      text-shadow: 0 0 10px var(--accent);
    }

    .sky-dropdown-item.active svg {
      transform: scale(1.15);
    }

    /* ─────────────────────────────────────────────────────────────
       FOOTER AUDIO CONTROLS & PIXEL EQUALIZER
       ───────────────────────────────────────────────────────────── */
    .footer-audio-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .audio-equalizer {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      transition: background 0.2s ease;
    }

    .audio-equalizer:hover {
      background: color-mix(in srgb, var(--accent) 15%, transparent);
    }

    .eq-bar {
      width: 2px;
      background: var(--accent);
      border-radius: 1px;
      transition: height 0.2s ease, opacity 0.3s ease;
      opacity: 0.85;
      box-shadow: 0 0 4px var(--glow);
    }

    .audio-equalizer.playing .bar-1 {
      animation: eq-bounce 1.1s ease-in-out infinite alternate;
      height: 8px;
    }
    .audio-equalizer.playing .bar-2 {
      animation: eq-bounce 0.8s ease-in-out 0.2s infinite alternate;
      height: 10px;
    }
    .audio-equalizer.playing .bar-3 {
      animation: eq-bounce 1.3s ease-in-out 0.4s infinite alternate;
      height: 6px;
    }

    .audio-equalizer.paused .eq-bar {
      height: 2px !important;
      animation: none !important;
      opacity: 0.35;
    }

    @keyframes eq-bounce {
      0% { height: 2px; }
      100% { height: 10px; }
    }

    /* ─────────────────────────────────────────────────────────────
       LANYARD WIDGET SYSTEM (Discord Status & Rich Activity Card)
       ───────────────────────────────────────────────────────────── */
    .lanyard-card {
      position: fixed;
      right: calc(var(--gutter) + 24px);
      top: 50%;
      transform: translateY(-50%);
      width: 280px;
      padding: 14px;
      background: color-mix(in srgb, var(--bg2) 65%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 15px var(--glow);
      z-index: 1001;
      transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      font-family: 'Lexend', 'Noto Sans JP', sans-serif;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      overflow: visible; /* allow outer border glow to show */
    }

    /* Animated snake border for Lanyard card */
    .lanyard-border-top,
    .lanyard-border-right,
    .lanyard-border-bottom,
    .lanyard-border-left {
      position: absolute;
      pointer-events: none;
      z-index: 2;
    }
    .lanyard-border-top    { top: 0;    left: 0;   right: 0;    height: 2px; }
    .lanyard-border-right  { top: 0;    right: 0;  bottom: 0;   width: 2px; }
    .lanyard-border-bottom { bottom: 0; left: 0;   right: 0;    height: 2px; }
    .lanyard-border-left   { top: 0;    left: 0;   bottom: 0;   width: 2px; }

    /* Single rounded border glow for the card */
    .lanyard-card::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 16px;
      pointer-events: none;
      z-index: -1;
      background: radial-gradient(ellipse at center, color-mix(in srgb, var(--accent) 60%, transparent 40%), transparent 60%);
      filter: blur(14px) saturate(120%);
      opacity: 0.9;
      mix-blend-mode: screen;
    }

    .lanyard-card.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .lanyard-card:hover {
      transform: translateY(-52%) scale(1.02);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 25px var(--glow);
      border-color: var(--line);
    }

    .lanyard-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lanyard-avatar-container {
      position: relative;
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }

    .lanyard-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--line-soft);
      transition: border-color 0.3s ease;
    }

    .lanyard-status-dot {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid var(--bg);
      background-color: #80848e;
      transition: background-color 0.3s ease;
    }

    .lanyard-status-dot.online { background-color: #23a55a; animation: status-pulse-green 2s infinite; }
    .lanyard-status-dot.idle { background-color: #f0b232; }
    .lanyard-status-dot.dnd { background-color: #f23f43; }
    .lanyard-status-dot.offline { background-color: #80848e; }

    @keyframes status-pulse-green {
      0% { box-shadow: 0 0 0 0 rgba(35, 165, 90, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(35, 165, 90, 0); }
      100% { box-shadow: 0 0 0 0 rgba(35, 165, 90, 0); }
    }

    .lanyard-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .lanyard-username {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.52rem;
      letter-spacing: 0.05em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lanyard-custom-status {
      font-size: 0.52rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0;
      line-height: 1.3;
      letter-spacing: 0.02em;
    }

    .lanyard-status-text {
      font-size: 0.55rem;
      color: var(--text-dim);
      opacity: 0.8;
      letter-spacing: 0.03em;
    }

    /* Universal Rich Activity Section (Spotify, Games, Dev, Stream) */
    .lanyard-activity {
      border-top: 1px solid var(--line-soft);
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lanyard-activity-header {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.40rem;
      letter-spacing: 0.08em;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .lanyard-activity-header svg {
      width: 11px;
      height: 11px;
      stroke: currentColor;
      flex-shrink: 0;
    }

    .lanyard-activity-content {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .lanyard-activity-image {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--line-soft);
      flex-shrink: 0;
      background: color-mix(in srgb, var(--bg2) 80%, transparent);
    }

    .lanyard-activity-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex-grow: 1;
    }

    .lanyard-activity-title {
      font-weight: 500;
      font-size: 0.54rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .lanyard-activity-subtitle {
      font-size: 0.48rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .lanyard-activity-state {
      font-size: 0.45rem;
      color: var(--text-dim);
      opacity: 0.75;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .lanyard-activity-progress-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .lanyard-activity-progress-bar {
      height: 3px;
      width: 100%;
      background: var(--line-soft);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .lanyard-activity-progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.5s linear;
      border-radius: 2px;
    }

    .lanyard-activity-time {
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 0.45rem;
      color: var(--text-dim);
      opacity: 0.7;
    }

    .lanyard-activity-elapsed {
      font-family: monospace;
      font-size: 0.45rem;
      color: var(--text-dim);
      opacity: 0.75;
      letter-spacing: 0.04em;
    }

    /* Responsive Adaptation */
    @media (max-width: 768px) {
      .sky-widget {
        top: calc(var(--gutter) + 8px);
        left: 50%;
        transform: translateX(-50%);
        align-items: center;
      }

      .lanyard-card {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(var(--gutter) + 150px); /* floats well above the footer */
        top: auto;
        width: auto;
        min-width: 240px;
        max-width: calc(100% - var(--gutter) * 2 - 24px);
        padding: 10px 14px;
        box-sizing: border-box;
      }
      .lanyard-card:hover {
        transform: translateX(-50%) scale(1.01);
      }
      @media (max-height: 640px) {
        .lanyard-card { bottom: calc(var(--gutter) + 120px); }
      }
      .lanyard-header {
        justify-content: center;
      }
      .lanyard-username {
        font-size: 0.62rem;
      }
      .lanyard-custom-status {
        font-size: 0.62rem;
      }
      .lanyard-status-text {
        font-size: 0.54rem;
      }
      .lanyard-activity-title {
        font-size: 0.64rem;
      }
      .lanyard-activity-subtitle {
        font-size: 0.56rem;
      }
      .lanyard-activity-time {
        font-size: 0.52rem;
      }
    }
  
    /* ═════════ NEW INTRO: letters rise from below, hint wipes left -> right ═════════ */
    .splash-content .typing-text {
      display: inline-flex;
      border-right: none;
      padding: 0.3em 0.2em;
      margin: -0.3em -0.2em;
      overflow: hidden;
    }
    .splash-content .typing-text .ch {
      display: inline-block;
      opacity: 0;
      transform: translateY(115%);
      filter: blur(3px);
      animation: chRise 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 150ms;
    }
    @keyframes chRise {
      0%   { transform: translateY(115%); opacity: 0; filter: blur(3px); }
      60%  { opacity: 1; }
      100% { transform: translateY(0);    opacity: 1; filter: blur(0); }
    }

    .splash-hint {
      transform: none;
      transition: none;
      opacity: 0;
      visibility: hidden;
    }
    .splash-hint.show {
      visibility: visible;
      opacity: 0.75;
      transform: none;
      -webkit-mask-image: linear-gradient(90deg, #000 var(--m), transparent calc(var(--m) + 28%));
      mask-image: linear-gradient(90deg, #000 var(--m), transparent calc(var(--m) + 28%));
      animation: hintWipe 1.1s cubic-bezier(0.3, 0.6, 0.3, 1) both,
                 hintBlink 2.2s ease-in-out 1.1s infinite;
    }
    @keyframes hintWipe {
      0%   { --m: -28%; }
      100% { --m: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-content .typing-text .ch {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
    }

    /* ═════════ NIGHT COMET: falling star -> Discord card -> border trace ═════════ */
    .card-comet {
      position: fixed;
      left: 0;
      top: 0;
      width: 150px;
      height: 2px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 1003;
      transform-origin: 100% 50%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35) 60%, #fff);
      box-shadow: 0 0 8px 1px rgba(160, 185, 255, 0.55);
      will-change: transform, opacity;
    }
    .card-impact {
      position: fixed;
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1003;
      background: radial-gradient(circle, #fff 0%, rgba(190,205,255,0.7) 40%, transparent 70%);
    }
    .card-trace {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
      z-index: 3;
    }
    .card-trace path {
      fill: none;
      stroke: #fff;
      stroke-width: 1.6;
      stroke-linecap: round;
      filter: drop-shadow(0 0 4px rgba(170,190,255,0.9)) drop-shadow(0 0 9px rgba(140,160,255,0.55));
    }
  
    /* ═════════ REVEAL AFTER CLICK: soft rise from below, staggered ═════════ */
    .container, footer, .sky-widget { transition: none; }

    @keyframes rvUp {
      from { opacity: 0; translate: 0 26px; filter: blur(6px); }
      to   { opacity: 1; translate: 0 0;    filter: blur(0); }
    }
    @keyframes rvUpSoft {
      from { opacity: 0; translate: 0 30px; }
      to   { opacity: 1; translate: 0 0; }
    }
    @keyframes rvFade { from { opacity: 0; } to { opacity: 1; } }

    body:not(.splash-active) .sky-widget          { animation: rvUp 1s cubic-bezier(0.16,1,0.3,1) 0.10s backwards; }
    body:not(.splash-active) .hero > h1           { animation: wave-effect 6s linear infinite,
                                                               rvUp 1.2s cubic-bezier(0.16,1,0.3,1) 0.20s backwards; }
    body:not(.splash-active) .hero > p            { animation: rvUp 1.1s cubic-bezier(0.16,1,0.3,1) 0.38s backwards; }
    body:not(.splash-active) .icons a             { animation: rvUp 1s cubic-bezier(0.16,1,0.3,1) backwards; }
    body:not(.splash-active) .icons a:nth-child(1){ animation-delay: 0.55s; }
    body:not(.splash-active) .icons a:nth-child(2){ animation-delay: 0.63s; }
    body:not(.splash-active) .icons a:nth-child(3){ animation-delay: 0.71s; }
    body:not(.splash-active) .icons a:nth-child(4){ animation-delay: 0.79s; }
    body:not(.splash-active) .lanyard-card.visible{ animation: rvUpSoft 1.2s cubic-bezier(0.16,1,0.3,1) 0.60s backwards; }
    body:not(.splash-active) .footer-left         { animation: rvUp 1s cubic-bezier(0.16,1,0.3,1) 0.85s backwards; }
    body:not(.splash-active) .footer-right        { animation: rvUp 1s cubic-bezier(0.16,1,0.3,1) 0.97s backwards; }
    body:not(.splash-active) .border-segments     { animation: rvFade 1.6s ease 0.1s backwards; }

    /* splash letters lift away upward as it dismisses */
    .splash-screen.hidden .typing-text .ch { animation: chOut 0.6s cubic-bezier(0.5,0,0.75,0) forwards; animation-delay: 0s; }
    @keyframes chOut { to { transform: translateY(-115%); opacity: 0; filter: blur(3px); } }

    @media (prefers-reduced-motion: reduce) {
      body:not(.splash-active) .sky-widget,
      body:not(.splash-active) .hero > p,
      body:not(.splash-active) .icons a,
      body:not(.splash-active) .lanyard-card.visible,
      body:not(.splash-active) .footer-left,
      body:not(.splash-active) .footer-right,
      body:not(.splash-active) .border-segments { animation: none !important; }
    }
  
    /* ═════════ SUN GLINT (day / sunset): the sun catches the Discord card ═════════ */
    .card-trace.warm path.g { stroke: var(--sun-mid); stroke-width: 4; opacity: 0.55; filter: blur(2.5px); }
    .card-trace.warm path.c { stroke: var(--sun-edge); stroke-width: 1.5; filter: drop-shadow(0 0 3px var(--sun-glow)); }
    .card-flare {
      position: fixed; width: 22px; height: 22px; margin: -11px 0 0 -11px;
      border-radius: 50%; pointer-events: none; z-index: 1003;
      background: radial-gradient(circle, #fff 0%, var(--sun-mid) 30%, var(--sun-glow) 55%, transparent 72%);
    }
    .card-sheen { position: absolute; inset: 0; border-radius: 12px; overflow: hidden; pointer-events: none; z-index: 2; }
    .card-sheen i {
      position: absolute; top: -20%; bottom: -20%; left: 0; width: 45%; opacity: 0;
      background: linear-gradient(100deg, transparent 0%, color-mix(in srgb, var(--sun-mid) 60%, transparent) 50%, transparent 100%);
      transform: skewX(-18deg) translateX(-130%);
    }
  
    /* ═════════ SOFTER INTRO (no clipping) ═════════ */
    .splash-content .typing-text { overflow: visible; padding: 0; margin: 0; }
    .splash-content .typing-text .ch {
      animation: chSoftIn 1.5s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
    }
    @keyframes chSoftIn {
      0%   { opacity: 0; transform: translateY(0.7em); filter: blur(10px); }
      55%  { filter: blur(2px); }
      100% { opacity: 1; transform: translateY(0);     filter: blur(0); }
    }
    .splash-screen.hidden .typing-text .ch {
      animation: chSoftOut 0.8s cubic-bezier(0.4, 0, 0.6, 1) forwards;
    }
    @keyframes chSoftOut {
      from { opacity: 1; transform: translateY(0);      filter: blur(0); }
      to   { opacity: 0; transform: translateY(-0.5em); filter: blur(8px); }
    }
    .splash-hint.show {
      -webkit-mask-image: linear-gradient(90deg, #000 var(--m), transparent calc(var(--m) + 60%));
      mask-image: linear-gradient(90deg, #000 var(--m), transparent calc(var(--m) + 60%));
      animation: hintWipeSoft 1.6s cubic-bezier(0.3, 0.5, 0.2, 1) both,
                 hintBlink 2.2s ease-in-out 1.6s infinite;
    }
    @keyframes hintWipeSoft {
      0%   { --m: -60%; }
      100% { --m: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash-content .typing-text .ch { animation: none !important; opacity: 1 !important; transform: none !important; filter: none !important; }
    }
  
    /* ═════════ SIMPLE, BLUR-FREE ANIMATIONS (later keyframes override earlier ones) ═════════ */
    @keyframes chSoftIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }

    @keyframes chSoftOut {

  <script>
    (function () {
      const canvas = document.getElementById('starCanvas');
      const ctx = canvas.getContext('2d', { alpha: true });
      let W = 0, H = 0;
      let stars = [];
      let sparks = [];
      let shooting = null;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = canvas.width = Math.floor(window.innerWidth * dpr);
        H = canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); 
        initStars();
      }

      function rand(min, max) { return min + Math.random() * (max - min); }

      function initStars() {
        stars = [];
        const area = window.innerWidth * window.innerHeight;
        const css = getComputedStyle(document.documentElement);
        const multiplier = (window.__sky && window.__sky.starDensity) || parseFloat(css.getPropertyValue('--star-density')) || 1;
        const count = Math.min(Math.floor(area / 2600 * multiplier), 900);

        for (let i = 0; i < count; i++) {
          const r = Math.random();
          stars.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: r < 0.70 ? rand(0.35, 0.9) : r < 0.93 ? rand(0.9, 1.3) : rand(1.3, 1.9),
            a: rand(0.20, 0.90),
            tw: rand(0.004, 0.010),
            off: rand(0, Math.PI * 2),
            spike: Math.random() < 0.016
          });
        }
      }

      function starColor(alpha) {
        const css = getComputedStyle(document.documentElement);
        const rgb = (css.getPropertyValue('--star-rgb') || '255,255,255').trim();
        return `rgba(${rgb},${alpha})`;
      }

      function drawStar(s, t) {
        const twinkle = Math.sin(t * s.tw * 60 + s.off);
        const a = s.a * (0.75 + 0.25 * twinkle);
        const sz = s.size * (0.9 + 0.1 * twinkle);

        if (s.spike) {
          ctx.save();
          ctx.translate(s.x, s.y);
          ctx.strokeStyle = starColor(a);
          ctx.lineWidth = 0.6;
          const len = sz * 3.6;
          for (let i = 0; i < 4; i++) {
            ctx.save();
            ctx.rotate(i * Math.PI / 4);
            ctx.globalAlpha = (i < 2 ? 1 : 0.55);
            ctx.beginPath();
            ctx.moveTo(0, -len); ctx.lineTo(0, len);
            ctx.stroke();
            ctx.restore();
          }
          ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(s.x, s.y, sz, 0, Math.PI * 2);
        ctx.fillStyle = starColor(a);
        ctx.fill();

        if (s.spike) {
          const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, sz * 5);
          const css = getComputedStyle(document.documentElement);
          const starRgb = (css.getPropertyValue('--star-rgb') || '255,255,255').trim();
          g.addColorStop(0, `rgba(${starRgb},${a * 0.22})`);
          g.addColorStop(1, 'transparent');
          ctx.beginPath();
          ctx.arc(s.x, s.y, sz * 5, 0, Math.PI * 2);
          ctx.fillStyle = g;
          ctx.fill();
        }
      }

      function maybeShoot() {
        if (!shooting && Math.random() < 0.0028) {
          shooting = {
            x: Math.random() * window.innerWidth * 0.65,
            y: Math.random() * window.innerHeight * 0.35,
            vx: rand(7, 12),
            vy: rand(2.5, 5),
            life: 1
          };
        }
        if (shooting) {
          const css = getComputedStyle(document.documentElement);
          const rgb = (css.getPropertyValue('--star-rgb') || '255,255,255').trim();
          ctx.strokeStyle = `rgba(${rgb},${shooting.life * 0.55})`;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(shooting.x, shooting.y);
          ctx.lineTo(shooting.x - shooting.vx * 10, shooting.y - shooting.vy * 10);
          ctx.stroke();

          shooting.x += shooting.vx;
          shooting.y += shooting.vy;
          shooting.life -= 0.03;

          if (shooting.life <= 0 || shooting.x > window.innerWidth || shooting.y > window.innerHeight) {
            shooting = null;
          }
        }
      }

      function spawnSparks(x, y) {
        const num = Math.floor(rand(5, 8));
        for (let i = 0; i < num; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = rand(0.4, 1.4);
          sparks.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: rand(0.8, 1.7),
            life: 1.0,
            decay: rand(0.016, 0.024),
            spike: Math.random() < 0.25
          });
        }
      }

      document.addEventListener('pointerdown', (e) => {
        if (e.target.closest('a, button, input, .sky-switcher, .lanyard-card, #username')) return;
        spawnSparks(e.clientX, e.clientY);
      });

      function draw(t) {
        const skyPhase = document.documentElement.getAttribute('data-sky');
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        
        if (skyPhase !== 'day') {
          for (const s of stars) drawStar(s, t);
          maybeShoot();
        }

        // Relaxed stardust click sparks
        for (let i = sparks.length - 1; i >= 0; i--) {
          const sp = sparks[i];
          sp.x += sp.vx;
          sp.y += sp.vy;
          sp.vx *= 0.96;
          sp.vy *= 0.96;
          sp.life -= sp.decay;
          if (sp.life <= 0) {
            sparks.splice(i, 1);
            continue;
          }
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, sp.size * sp.life, 0, Math.PI * 2);
          ctx.fillStyle = starColor(sp.life * 0.85);
          ctx.fill();
          if (sp.spike) {
            ctx.save();
            ctx.strokeStyle = starColor(sp.life * 0.5);
            ctx.lineWidth = 0.5;
            const len = sp.size * 2.8 * sp.life;
            ctx.beginPath();
            ctx.moveTo(sp.x - len, sp.y); ctx.lineTo(sp.x + len, sp.y);
            ctx.moveTo(sp.x, sp.y - len); ctx.lineTo(sp.x, sp.y + len);
            ctx.stroke();
            ctx.restore();
          }
        }

        requestAnimationFrame(draw);
      }

      window.__starfield = {
        setSkyVars(vars) {
          window.__sky = Object.assign(window.__sky || {}, vars || {});
          if (typeof initStars === 'function') initStars();
        }
      };

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(draw);
    })();
  </script>

  <script>
    let clickCount = 0;
    const clickCounter = document.getElementById('clickCounter');
    const clickCountSpan = document.getElementById('clickCount');
    const COUNTER_IDLE_MS = 4500;   // no clicks for this long -> counter disappears and resets
    const COUNTER_LEAVE_MS = 300;   // matches the CSS exit transition
    let counterIdleTimer = null;
    let counterLeaveTimer = null;

    function finishHideCounter() {
      clearTimeout(counterLeaveTimer);
      clickCounter.classList.remove('show', 'leaving');
      clickCountSpan.textContent = '0';
    }

    function hideCounter() {
      clickCount = 0; // reset: the next click counts as a first click again
      clickCounter.classList.add('leaving');
      counterLeaveTimer = setTimeout(finishHideCounter, COUNTER_LEAVE_MS);
    }

    function playClickSound() {
      const s = document.getElementById('clickSound');
      if (s) {
        s.currentTime = 0;
        s.play().catch(() => { });
      }

      // clicked again while the counter was still leaving -> start fresh
      if (clickCounter.classList.contains('leaving')) finishHideCounter();

      clickCount++;
      clickCountSpan.textContent = clickCount;
      document.getElementById('clickWord').textContent = clickCount === 1 ? 'time' : 'times';

      if (!clickCounter.classList.contains('show')) {
        void clickCounter.offsetWidth; // flush styles so the wipe-in plays
        clickCounter.classList.add('show');
      }

      clickCountSpan.classList.remove('bump');
      void clickCountSpan.offsetWidth;
      clickCountSpan.classList.add('bump');

      clearTimeout(counterIdleTimer);
      counterIdleTimer = setTimeout(hideCounter, COUNTER_IDLE_MS);
    }

  <script>
    (function () {
      const tracks = {
        day: document.getElementById('bgmDay'),
        sunset: document.getElementById('bgmSunset'),
        night: document.getElementById('bgmNight')
      };

      const DEFAULT_VOLUME = 0.22;
      let current = null;
      let isMuted = false;

      function updateAudioUI() {
        const eq = document.getElementById('audioEqualizer');
        if (eq) {
          if (isMuted) {
            eq.classList.remove('playing');
            eq.classList.add('paused');
          } else {
            eq.classList.add('playing');
            eq.classList.remove('paused');
          }
        }
      }

      function ensureTrack(t) {
        if (!t) return;
        t.loop = true;
        t.preload = 'auto';
        t.volume = 0;
        t.muted = true;
        t.play().catch(() => { });
      }

      function ensureAll() {
        Object.values(tracks).forEach(ensureTrack);
      }

      function fadeTo(el, to, ms = 900) {
        if (!el) return;
        el.muted = false;
        const start = (typeof el.volume === 'number') ? el.volume : 0;
        if (ms <= 0) {
          const v = Math.max(0, Math.min(1, to));
          try { el.volume = v; } catch (e) { }
          if (v === 0) try { el.pause(); } catch (e) { }
          return;
        }
        const startT = performance.now();
        function clamp(v) { return Math.max(0, Math.min(1, v)); }
        function step(now) {
          const t = Math.min(1, (now - startT) / Math.max(1, ms));
          const v = start + (to - start) * t;
          try { el.volume = clamp(v); } catch (e) { }
          if (t < 1) requestAnimationFrame(step);
          else {
            try { el.volume = clamp(to); } catch (e) { }
            if (Math.abs(clamp(to)) < 1e-6) try { el.pause(); } catch (e) { }
          }
        }
        requestAnimationFrame(step);
      }

      function setFor(paletteName) {
        const map = { day: 'day', sunset: 'sunset', indigo: 'sunset', night: 'night' };
        const key = map[paletteName] || 'night';
        if (current === key) return;
        const newT = tracks[key];
        const oldT = current ? tracks[current] : null;
        current = key;
        if (newT) {
          try { newT.play().catch(() => { }); } catch (e) { }
          if (!isMuted) fadeTo(newT, DEFAULT_VOLUME);
          else fadeTo(newT, 0);
        }
        if (oldT && oldT !== newT) fadeTo(oldT, 0);
      }

      function toggleMute() {
        isMuted = !isMuted;
        const curTrack = current ? tracks[current] : null;
        if (isMuted) {
          if (curTrack) fadeTo(curTrack, 0, 350);
        } else {
          if (curTrack) {
            try { curTrack.play().catch(() => {}); } catch(e){}
            fadeTo(curTrack, DEFAULT_VOLUME, 450);
          }
        }
        updateAudioUI();
      }

      window.__bgmManager = { setFor, ensureAll, tracks, toggleMute };
      ensureAll();

      const onFirstGesture = () => {
        Object.values(tracks).forEach(t => {
          if (!t) return;
          t.muted = false;
          try { t.play().catch(() => { }); } catch (e) { }
        });
        if (current && tracks[current] && !isMuted) fadeTo(tracks[current], DEFAULT_VOLUME, 700);
        // Sync equalizer UI — switches from paused → playing once audio actually starts
        updateAudioUI();
      };

      window.__bgmManager.onFirstGesture = onFirstGesture;

      ['pointerdown', 'touchstart', 'mousedown', 'keydown'].forEach(ev =>
        document.addEventListener(ev, onFirstGesture, { once: true, capture: true })
      );

      const audioEq = document.getElementById('audioEqualizer');
      if (audioEq) audioEq.addEventListener('click', toggleMute);
    })();
  </script>

  <script>
    (function () {
      const splash = document.getElementById('splashScreen');
      const splashTitle = document.getElementById('splashTitle');
      const splashHint = document.getElementById('splashHint');
      const mainTitle = document.getElementById('username');
      const text = (mainTitle && mainTitle.textContent.trim()) || 'MiloHakai';

      function typeText(el, str, delay, done) {
        el.textContent = '';
        el.classList.add('typing');
        let i = 0;
        const t = setInterval(() => {
          el.textContent += str[i++];
          if (i >= str.length) {
            clearInterval(t);
            el.classList.remove('typing');
            if (done) done();
          }
        }, delay);
      }

      function hide() {
        if (splash) {
          splash.classList.add('hidden');
          // Reveal all page chrome with a fade-in
          document.body.classList.remove('splash-active');
          // Activate and unmute audio on dismissal
          if (window.__bgmManager && typeof window.__bgmManager.onFirstGesture === 'function') {
            window.__bgmManager.onFirstGesture();
          }
        }
      }

      if (splash && splashTitle) {
        // Run Typing sequence, then smoothly show "click to continue"
        splashTitle.textContent = '';
        splashTitle.setAttribute('aria-label', text);
        Array.from(text).forEach((c, i) => {
          const s = document.createElement('span');
          s.className = 'ch';
          s.setAttribute('aria-hidden', 'true');
          s.textContent = c === ' ' ? '\u00a0' : c;
          s.style.setProperty('--i', i);
          splashTitle.appendChild(s);
        });
        /* letters finish rising, then the hint wipes in left -> right */
        const riseDone = 150 + 950;
        setTimeout(() => {
          if (splashHint) splashHint.classList.add('show');
        }, riseDone - 600);
        splash.addEventListener('pointerdown', hide, { once: true });
      }
    })();
  </script>

  <script>
    (function () {
      const SKY_LAT = 40.8518;
      const SKY_LON = 14.2681;

      const SC_PI = Math.PI,
        SC_sin = Math.sin,
        SC_cos = Math.cos,
        SC_tan = Math.tan,
        SC_asin = Math.asin,
        SC_atan = Math.atan2,
        SC_acos = Math.acos,
        SC_rad = SC_PI / 180,
        SC_dayMs = 1000 * 60 * 60 * 24,
        SC_J1970 = 2440588,
        SC_J2000 = 2451545,
        SC_e = SC_rad * 23.4397;

      function SC_toJulian(date) { return date.valueOf() / SC_dayMs - 0.5 + SC_J1970; }
      function SC_fromJulian(j) { return new Date((j + 0.5 - SC_J1970) * SC_dayMs); }
      function SC_toDays(date) { return SC_toJulian(date) - SC_J2000; }

      function SC_rightAscension(l, b) {
        return SC_atan(SC_sin(l) * SC_cos(SC_e) - SC_tan(b) * SC_sin(SC_e), SC_cos(l));
      }
      function SC_declination(l, b) {
        return SC_asin(SC_sin(b) * SC_cos(SC_e) + SC_cos(b) * SC_sin(SC_e) * SC_sin(l));
      }
      function SC_siderealTime(d, lw) { return SC_rad * (280.16 + 360.9856235 * d) - lw; }
      function SC_solarMeanAnomaly(d) { return SC_rad * (357.5291 + 0.98560028 * d); }

      function SC_eclipticLongitude(M) {
        const C = SC_rad * (1.9148 * SC_sin(M) + 0.02 * SC_sin(2 * M) + 0.0003 * SC_sin(3 * M));
        const P = SC_rad * 102.9372;
        return M + C + P + SC_PI;
      }

      function SC_sunCoords(d) {
        const M = SC_solarMeanAnomaly(d);
        const L = SC_eclipticLongitude(M);
        return { dec: SC_declination(L, 0), ra: SC_rightAscension(L, 0) };
      }

      const SC_J0 = 0.0009;
      function SC_julianCycle(d, lw) { return Math.round(d - SC_J0 - lw / (2 * SC_PI)); }
      function SC_approxTransit(Ht, lw, n) { return SC_J0 + (Ht + lw) / (2 * SC_PI) + n; }
      function SC_solarTransitJ(ds, M, L) { return SC_J2000 + ds + 0.0053 * SC_sin(M) - 0.0069 * SC_sin(2 * L); }
      function SC_hourAngle(h, phi, d) {
        return SC_acos((SC_sin(h) - SC_sin(phi) * SC_sin(d)) / (SC_cos(phi) * SC_cos(d)));
      }
      function SC_observerAngle(height) { return -2.076 * Math.sqrt(height || 0) / 60; }

      function SC_getSetJ(h, lw, phi, dec, n, M, L) {
        const w = SC_hourAngle(h, phi, dec);
        const a = SC_approxTransit(w, lw, n);
        return SC_solarTransitJ(a, M, L);
      }

      const SC_SUN_EVENTS = [
        [-0.833, 'sunrise', 'sunset'],
        [-6, 'dawn', 'dusk'],
        [-12, 'nauticalDawn', 'nauticalDusk'],
        [-18, 'nightEnd', 'night']
      ];

      function astroGetTimes(date, lat, lng, height) {
        height = height || 0;
        const lw = SC_rad * -lng;
        const phi = SC_rad * lat;
        const dh = SC_observerAngle(height);
        const d = SC_toDays(date);
        const n = SC_julianCycle(d, lw);
        const ds = SC_approxTransit(0, lw, n);
        const M = SC_solarMeanAnomaly(ds);
        const L = SC_eclipticLongitude(M);
        const dec = SC_declination(L, 0);
        const Jnoon = SC_solarTransitJ(ds, M, L);
        const result = { solarNoon: SC_fromJulian(Jnoon), nadir: SC_fromJulian(Jnoon - 0.5) };
        for (let i = 0; i < SC_SUN_EVENTS.length; i++) {
          const ev = SC_SUN_EVENTS[i];
          const h0 = (ev[0] + dh) * SC_rad;
          const Jset = SC_getSetJ(h0, lw, phi, dec, n, M, L);
          const Jrise = Jnoon - (Jset - Jnoon);
          result[ev[1]] = SC_fromJulian(Jrise);
          result[ev[2]] = SC_fromJulian(Jset);
        }
        return result;
      }

      function getRomeDateKey(d) {
        return new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Europe/Rome',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }).format(d || new Date());
      }

      let sunInstCache = { key: '', data: null };
      function getCachedSunInstants(refDate) {
        const ref = refDate || new Date();
        const key = getRomeDateKey(ref);
        if (sunInstCache.key !== key || !sunInstCache.data) {
          sunInstCache = { key, data: astroGetTimes(ref, SKY_LAT, SKY_LON, 0) };
        }
        return sunInstCache.data;

      const SUN_BAND = { dayFadeBeforeSet: 22, civilAfterDusk: 28, indigoAfterNautical: 52 };

      function pickPaletteFromInstant(now) {
        const st = getCachedSunInstants(now);
        const t = now.getTime();
        const rise = st.sunrise.getTime();
        const set = st.sunset.getTime();
        const dusk = st.dusk.getTime();
        const nav = st.nauticalDusk.getTime();
        const MIN = 60 * 1000;
        if (t < rise) return 'night';
        if (t < set - SUN_BAND.dayFadeBeforeSet * MIN) return 'day';
        if (t < dusk + SUN_BAND.civilAfterDusk * MIN) return 'sunset';
        if (t < nav + SUN_BAND.indigoAfterNautical * MIN) return 'indigo';
        return 'night';
      }

      /* HIGHER-FIDELITY SCROLL-UP LYRICS CONTROLLER */
      function pushLyricText(newText) {
        const viewport = document.getElementById('lyricsViewport');
        if (!viewport) return;

        // Skip duplicates to prevent screen jitter
        if (viewport.dataset.currentText === newText) return;
        viewport.dataset.currentText = newText;

        const currentActive = viewport.querySelector('.lyric-line.active');
        if (currentActive) {
          currentActive.classList.remove('active');
          currentActive.classList.add('exit');
          setTimeout(() => currentActive.remove(), 420);

        const newLine = document.createElement('div');

      function setupLyricsForMode(name) {

        if (titleEl) {

        }

        if (lyricSyncListener) {
          dayBgm.removeEventListener('timeupdate', lyricSyncListener);
          lyricSyncListener = null;
        }

        if (name === 'day') {
          lyricSyncListener = function () {
            const curTime = dayBgm.currentTime;
            let currentLine = "...";
            for (let i = 0; i < lyricsData.length; i++) {
              if (curTime >= lyricsData[i].time) {
                currentLine = lyricsData[i].text;
              } else {
                break;

        if (!p) return;
        const root = document.documentElement.style;
        root.setProperty('--bg', p.bg);
        root.setProperty('--bg2', p.bg2);
        root.setProperty('--text', p.text);
        root.setProperty('--text-dim', p.textDim);
        root.setProperty('--line', p.line);

        const rgb = p.starRgb && p.starRgb.indexOf('#') === 0 ? hexToRgb(p.starRgb) : (p.starRgb || '255,255,255');

        if (p.sunEdge != null) root.setProperty('--sun-edge', p.sunEdge);
        if (p.sunGlow != null) root.setProperty('--sun-glow', p.sunGlow);
        if (p.moonRim != null) root.setProperty('--moon-rim', p.moonRim);
        if (p.moonRimSoft != null) root.setProperty('--moon-rim-soft', p.moonRimSoft);
        if (p.moonHalo != null) root.setProperty('--moon-halo', p.moonHalo);

        document.documentElement.setAttribute('data-sky', name);

        setupLyricsForMode(name);

        try { if (window.__bgmManager && typeof window.__bgmManager.setFor === 'function') window.__bgmManager.setFor(name); } catch (e) { }

        try {
          const el = document.documentElement;
          el.classList.add('palette-swap');
          window.clearTimeout(el.__paletteSwapTimer);
          el.__paletteSwapTimer = window.setTimeout(() => el.classList.remove('palette-swap'), 1400);
        } catch (e) { }

        if (window.__starfield && typeof window.__starfield.setSkyVars === 'function') {
