        } else {
          window.__sky = Object.assign(window.__sky || {}, { starDensity: p.starDensity || 1, starRgb: rgb });
        }

        updateSunFromClock();
      }

      /* ── Sunset → dusk timeline (0 = golden hour, 1 = last light, 2 = deep dusk) ── */
      const TL_STOPS = [
        { t: 0.0, top: '#6a97d6', mid: '#f7c8ad', bot: '#ffd9a6', core: '#fff1d0', sun: '#ffb347', edge: '#ff7a2f', glow: [255,160,90,0.50],  hor: [255,150,80,0.35],  horOp: 0.55, ray: 0.30, sink: 0.00 },
        { t: 0.5, top: '#8d6cba', mid: '#f0aab6', bot: '#ffb47c', core: '#ffd9a8', sun: '#ff7a4d', edge: '#e8452f', glow: [255,110,80,0.50],  hor: [255,110,90,0.45],  horOp: 0.80, ray: 0.22, sink: 0.35 },
        { t: 1.0, top: '#2f2670', mid: '#9b5fa8', bot: '#ff8f7a', core: '#ffb184', sun: '#e8476a', edge: '#a62a5e', glow: [235,80,120,0.45],  hor: [225,85,130,0.50],  horOp: 1.00, ray: 0.14, sink: 0.70 },
        { t: 1.5, top: '#1f1f5c', mid: '#51408f', bot: '#c779a8', core: '#c25a8a', sun: '#7a2f78', edge: '#4a1f66', glow: [160,70,170,0.32],  hor: [160,85,190,0.40],  horOp: 0.80, ray: 0.06, sink: 0.95 },
        { t: 2.0, top: '#0e1230', mid: '#1b1a4a', bot: '#3a3470', core: '#3a2a5a', sun: '#2a2150', edge: '#1d1840', glow: [100,80,180,0.00],  hor: [90,80,170,0.12],   horOp: 0.30, ray: 0.00, sink: 1.00 }
      ];

      function lerp(a, b, k) { return a + (b - a) * k; }
      function hexToArr(h) { return hexToRgb(h).split(',').map(Number); }
      function mixColor(h1, h2, k) {
        const a = hexToArr(h1), b = hexToArr(h2);
        return `rgb(${Math.round(lerp(a[0], b[0], k))},${Math.round(lerp(a[1], b[1], k))},${Math.round(lerp(a[2], b[2], k))})`;
      }
      function mixRgba(a, b, k) {
        return `rgba(${Math.round(lerp(a[0], b[0], k))},${Math.round(lerp(a[1], b[1], k))},${Math.round(lerp(a[2], b[2], k))},${lerp(a[3], b[3], k).toFixed(3)})`;
      }

      function applyTimeline(tl) {
        const root = document.documentElement.style;
        tl = Math.max(0, Math.min(2, tl));
        let i = 0;
        while (i < TL_STOPS.length - 2 && tl > TL_STOPS[i + 1].t) i++;
        const A = TL_STOPS[i], B = TL_STOPS[i + 1];
        const k = (tl - A.t) / (B.t - A.t);

        root.setProperty('--sky-top', mixColor(A.top, B.top, k));
        root.setProperty('--sky-mid', mixColor(A.mid, B.mid, k));
        root.setProperty('--sky-bottom', mixColor(A.bot, B.bot, k));
        root.setProperty('--sun-core', mixColor(A.core, B.core, k));
        root.setProperty('--sun-mid', mixColor(A.sun, B.sun, k));
        root.setProperty('--sun-edge', mixColor(A.edge, B.edge, k));
        root.setProperty('--sun-glow', mixRgba(A.glow, B.glow, k));
        root.setProperty('--horizon-color', mixRgba(A.hor, B.hor, k));
        root.setProperty('--horizon-opacity', lerp(A.horOp, B.horOp, k).toFixed(3));
        root.setProperty('--sun-ray-opacity', lerp(A.ray, B.ray, k).toFixed(3));
        root.setProperty('--sun-sink', lerp(A.sink, B.sink, k).toFixed(3));

        /* readable ink: dark plum in golden hour, cream once the sky turns deep */
        const sstep = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
        const tk = sstep((tl - 0.84) / 0.12);
        const mixA = (a, b) => a.map((v, n) => Math.round(lerp(v, b[n], tk)));
        const ink = mixA([88, 30, 112], [255, 248, 242]).join(',');
        root.setProperty('--text', `rgb(${ink})`);
        root.setProperty('--text-dim', `rgba(${ink},${lerp(0.96, 0.86, tk).toFixed(2)})`);
        root.setProperty('--line', `rgba(${ink},0.92)`);
        root.setProperty('--line-soft', `rgba(${ink},0.5)`);
        root.setProperty('--icon', `rgb(${ink})`);
        root.setProperty('--accent', `rgb(${mixA([176, 34, 112], [255, 212, 196]).join(',')})`);
        root.setProperty('--wave-a', `rgb(${ink})`);
        root.setProperty('--wave-b', `rgb(${mixA([224, 62, 104], [255, 184, 158]).join(',')})`);
        root.setProperty('--glow', `rgba(${mixA([255, 232, 214], [255, 205, 188]).join(',')},${lerp(0.75, 0.30, tk).toFixed(2)})`);
        root.setProperty('--bg2', `rgb(${mixA([255, 226, 208], [123, 99, 179]).join(',')})`);
      }

      function clearSunVars() {
        const root = document.documentElement.style;
        ['--sun-left', '--sun-top', '--sun-scale', '--sun-opacity', '--sun-sink',
          '--sun-ray-opacity', '--horizon-opacity'].forEach(v => root.removeProperty(v));
        root.setProperty('--horizon-color', 'rgba(255,150,80,0)');
      }

      function updateSunFromClock() {
        const root = document.documentElement.style;
        const sky = document.documentElement.getAttribute('data-sky');
        if (sky === 'night') { clearSunVars(); return; }

        const auto = window.__skyMode === 'auto';
        const now = new Date();
        const nowT = now.getTime();
        const st = getCachedSunInstants(now);
        const MIN = 60 * 1000;
        const rise = st.sunrise.getTime();
        const set = st.sunset.getTime();
        const dusk = st.dusk.getTime();
        const nav = st.nauticalDusk.getTime();

        if (sky === 'day') {
          const span = Math.max(1, set - rise);
          let t = (nowT - rise) / span;
          t = auto ? Math.max(0, Math.min(1, t)) : 0.55; /* manual pick = a nice high-sun moment */

          /* gentle arc; it ends exactly where the sunset phase begins (76%, 56%) */
          const left = 10 + t * 66;
          const top = 56 - 46 * Math.sin(Math.PI * t);
          const scale = 1.0 + 0.08 * Math.sin(Math.PI * t);

          root.setProperty('--sun-left', left.toFixed(2) + '%');
          root.setProperty('--sun-top', top.toFixed(2) + '%');
          root.setProperty('--sun-scale', scale.toFixed(3));
          root.setProperty('--sun-opacity', '1');
          root.setProperty('--sun-sink', '0');
          root.setProperty('--sun-ray-opacity', '0.38');
          root.setProperty('--horizon-opacity', '0');
          root.setProperty('--horizon-color', 'rgba(255,214,150,0)');
          return;
        }

        /* sunset + indigo share one continuous timeline */
        const ss0 = set - SUN_BAND.dayFadeBeforeSet * MIN;
        const ss1 = dusk + SUN_BAND.civilAfterDusk * MIN;
        const ss2 = nav + SUN_BAND.indigoAfterNautical * MIN;
        let tl;
        if (auto) {
          if (sky === 'sunset') tl = (nowT - ss0) / Math.max(1, ss1 - ss0);
          else tl = 1 + (nowT - ss1) / Math.max(1, ss2 - ss1);
        } else {
          tl = sky === 'sunset' ? 0.4 : 1.5; /* manual picks show a representative moment */
        }
        tl = Math.max(0, Math.min(2, tl));
        applyTimeline(tl);

        /* sun slides toward the horizon, grows slightly, then dissolves into the dusk */
        /* the sun barely moves: it sinks slowly, reddens, melts into the horizon haze and fades */
        const sst = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
        const left = 76 + tl * 2;
        const top = 56 + tl * 12;
        const scale = 1.0 + 0.2 * Math.min(tl, 1) - 0.2 * Math.max(0, tl - 1);
        const fade = 1 - sst((tl - 0.7) / 1.3);

        root.setProperty('--sun-left', left.toFixed(2) + '%');
        root.setProperty('--sun-top', top.toFixed(2) + '%');
        root.setProperty('--sun-scale', scale.toFixed(3));
        root.setProperty('--sun-opacity', fade.toFixed(3));
      }

      window.__skyMode = 'auto';

      function choosePaletteByTime() {
        if (window.__skyMode === 'auto') {
          applyPalette(pickPaletteFromInstant(new Date()));
        }
      }

      choosePaletteByTime();
      setInterval(choosePaletteByTime, 60 * 1000);
      setInterval(updateSunFromClock, 30 * 1000);

      window.applySkyPalette = applyPalette;
      window.updateSunFromClock = updateSunFromClock;
      window.getCachedSunInstants = getCachedSunInstants;
      window.pickPaletteFromInstant = pickPaletteFromInstant;

      // CET Clock & Dropdown Logic
      const clockTrigger = document.getElementById('skyClockTrigger');
      const dropdownMenu = document.getElementById('skyDropdownMenu');
      const clockLive = document.getElementById('clockLive');
      const dropdownItems = document.querySelectorAll('.sky-dropdown-item');

      function updateCETClock() {
        if (!clockLive) return;
        const now = new Date();
        const timeStr = new Intl.DateTimeFormat('en-US', {
          timeZone: 'Europe/Rome',
          hour: 'numeric',
          minute: '2-digit',
          hour12: true
        }).format(now);
        clockLive.textContent = timeStr;
      }

      updateCETClock();
      setInterval(updateCETClock, 1000);

      function toggleDropdown(open) {
        if (!dropdownMenu || !clockTrigger) return;
        const isOpen = (typeof open === 'boolean') ? open : !dropdownMenu.classList.contains('show');
        if (isOpen) {
          dropdownMenu.classList.add('show');
          clockTrigger.classList.add('open');
          clockTrigger.setAttribute('aria-expanded', 'true');
        } else {
          dropdownMenu.classList.remove('show');
          clockTrigger.classList.remove('open');
          clockTrigger.setAttribute('aria-expanded', 'false');
        }
      }

      if (clockTrigger) {
        clockTrigger.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleDropdown();
        });
      }

      dropdownItems.forEach(item => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          const mode = item.dataset.skyMode;
          window.__skyMode = mode;
          dropdownItems.forEach(b => b.classList.remove('active'));
          item.classList.add('active');
          if (mode === 'auto') {
            applyPalette(pickPaletteFromInstant(new Date()));
          } else {
            applyPalette(mode);
          }
          toggleDropdown(false);
        });
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#skyWidget')) {
          toggleDropdown(false);
        }
      });
    })();
  </script>

  <!-- Lanyard Integration Script -->
  <script>
    (function() {
      const discordId = '379002314226401320';

      const timeTotal = document.getElementById('lanyardTimeTotal');
      const elapsedContainer = document.getElementById('lanyardActivityElapsed');
      const elapsedTime = document.getElementById('lanyardElapsedTime');

      let spotifyProgressTimer = null;
      let spotifyStart = 0;
      let spotifyEnd = 0;
      let gameElapsedTimer = null;
      let gameStart = 0;

      const ICONS = {
        music: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>`,
        game: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="4"></rect><path d="M6 12h4M8 10v4M15 13h.01M18 11h.01"></path></svg>`,
        code: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>`,
        stream: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.93 4.93a10 10 0 0 0 0 14.14M19.07 4.93a10 10 0 0 1 0 14.14M7.76 7.76a6 6 0 0 0 0 8.48M16.24 7.76a6 6 0 0 1 0 8.48"></path><circle cx="12" cy="12" r="2"></circle></svg>`
      };

      function formatTime(ms) {
        if (isNaN(ms) || ms < 0) return '0:00';
        const seconds = Math.floor(ms / 1000);
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return mins + ':' + (secs < 10 ? '0' : '') + secs;
      }

      function formatElapsed(ms) {
        if (isNaN(ms) || ms < 0) return '00:00 elapsed';
        const totalSecs = Math.floor(ms / 1000);
        const hrs = Math.floor(totalSecs / 3600);
        const mins = Math.floor((totalSecs % 3600) / 60);
        const secs = totalSecs % 60;
        if (hrs > 0) {
          return `${hrs}:${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs} elapsed`;
        }
        return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs} elapsed`;
      }

      function updateSpotifyProgress() {
        if (!spotifyStart || !spotifyEnd) return;
        const now = Date.now();
        const total = spotifyEnd - spotifyStart;
        const current = Math.min(total, Math.max(0, now - spotifyStart));
        
        const pct = (current / total) * 100;
        if (progressFill) progressFill.style.width = pct.toFixed(1) + '%';
        if (timeCurrent) timeCurrent.textContent = formatTime(current);

        if (now < spotifyEnd) {
          spotifyProgressTimer = requestAnimationFrame(updateSpotifyProgress);
        } else {
          if (progressFill) progressFill.style.width = '100%';
          if (timeCurrent) timeCurrent.textContent = formatTime(total);
        }
      }

      function updateGameElapsed() {
        if (!gameStart) return;
        const now = Date.now();
        const diff = Math.max(0, now - gameStart);
        if (elapsedTime) elapsedTime.textContent = formatElapsed(diff);
      }

      function fetchLanyard() {
        fetch(`https://api.lanyard.rest/v1/users/${discordId}`)
          .then(res => res.json())
          .then(res => {
            if (!res.success) return;
            const data = res.data;

            card.classList.add('visible');

            // 1. Profile Information
            const user = data.discord_user;
            username.textContent = user.global_name || user.username || 'MiloHakai';
            
            if (user.avatar) {
              const ext = user.avatar.startsWith('a_') ? 'gif' : 'png';
              avatar.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=128`;
            } else {
              const defaultIndex = user.discriminator === '0' 
                ? (BigInt(user.id) >> 22n) % 6n 
                : parseInt(user.discriminator) % 5;
              avatar.src = `https://cdn.discordapp.com/embed/avatars/${defaultIndex}.png`;
            }

            // 2. Status Dot & Status Text
            const status = data.discord_status;
            statusDot.className = 'lanyard-status-dot ' + status;
            
            let displayStatus = status;
            if (status === 'dnd') displayStatus = 'Do Not Disturb';
            else if (status === 'online') displayStatus = 'Online';
            else if (status === 'idle') displayStatus = 'Idle';
            else if (status === 'offline') displayStatus = 'Offline';
            statusText.textContent = displayStatus;

            // 3. Custom Status Message (Strictly without emojis for unique typography)
            const customActivity = data.activities.find(act => act.type === 4);
            if (customActivity && customActivity.state) {
              const cleanText = customActivity.state
                .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{FE00}-\u{FE0F}\u{1F900}-\u{1F9FF}\u{1FA70}-\u{1FAFF}\u{200D}\u{200C}\u{E0020}-\u{E007F}]/gu, '')
                .trim();
              if (cleanText) {
                customStatus.textContent = cleanText;
                customStatus.style.display = 'block';
              } else {
                customStatus.textContent = '';
                customStatus.style.display = 'none';
              }
            } else {
              customStatus.textContent = '';
              customStatus.style.display = 'none';
            }

            // 4. Universal Activity Detection (Spotify, Game, Dev, Stream)
            cancelAnimationFrame(spotifyProgressTimer);
            if (gameElapsedTimer) {
              clearInterval(gameElapsedTimer);
              gameElapsedTimer = null;
            }

            let music = null;
            if (data.listening_to_spotify && data.spotify) {
              music = data.spotify;
            } else {
              const act = data.activities.find(a => a.type === 2 || a.name === 'Spotify');
              if (act) {
                music = {
                  song: act.details || act.name,
                  artist: act.state || 'Unknown Artist',
                  album: act.assets ? act.assets.large_text : '',
                  album_art_url: '',
                  timestamps: act.timestamps
                };
                if (act.assets && act.assets.large_image) {
                  const img = act.assets.large_image;
                  if (img.startsWith('spotify:')) {
                    music.album_art_url = `https://i.scdn.co/image/${img.substring(8)}`;
                  } else if (img.startsWith('mp:')) {
                    music.album_art_url = img.replace('mp:', 'https://media.discordapp.net/');
                  } else if (act.application_id) {
                    music.album_art_url = `https://cdn.discordapp.com/app-assets/${act.application_id}/${img}.png`;
                  }
                }
              }
            }

            const streamAct = data.activities.find(a => a.type === 1);
            const gameAct = data.activities.find(a => a.type === 0 || a.type === 5);

            if (music) {
              // Spotify / Music mode
              activitySection.style.display = 'flex';
              activityIcon.innerHTML = ICONS.music;
              activityBadge.textContent = 'LISTENING';
              activityTitle.textContent = music.song;
              activitySubtitle.textContent = music.artist;
              activityState.style.display = 'none';
              
              if (music.album_art_url) {
                activityImage.src = music.album_art_url;
                activityImage.style.display = 'block';
              } else {
                activityImage.src = '';
                activityImage.style.display = 'none';

              if (music.timestamps && music.timestamps.start && music.timestamps.end) {
                timeTotal.textContent = formatTime(music.timestamps.end - music.timestamps.start);
                spotifyStart = music.timestamps.start;
                spotifyEnd = music.timestamps.end;
                updateSpotifyProgress();
                progressContainer.style.display = 'flex';
              } else {
                progressContainer.style.display = 'none';

              activityIcon.innerHTML = isDev ? ICONS.code : ICONS.game;

                if (img.startsWith('mp:')) {

              activityState.style.display = 'none';

      fetchLanyard();
      setInterval(fetchLanyard, 15000);
    })();
  </script>

  <!-- Cursor trail: silky smooth fluid celestial ribbon + stardust -->
  <script>
    (function () {
      const canvas = document.getElementById('trailCanvas');
      if (!canvas) return;
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) { canvas.remove(); return; }

      const ctx = canvas.getContext('2d');
      const TRAIL_MS = 380;       // exact lifespan in milliseconds (refresh-rate independent)
      const SPARK_MS = 550;
      let w = 0, h = 0, dpr = 1;
      let rgb = '212,196,255', colorCheckAt = 0;
      const path = [];            // { x, y, t }
      const sparks = [];          // { x, y, vx, vy, size, birth, maxLife }
      let lastPoint = null;
      let rafId = 0;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      function updateColor() {
        try {
          const v = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
          if (v) {
            ctx.save();
            ctx.fillStyle = v;
            const col = ctx.fillStyle;
            ctx.restore();
            if (col.startsWith('#')) {
              const hex = col.slice(1);
              const n = parseInt(hex.length === 3 ? hex.split('').map(c => c + c).join('') : hex, 16);
              rgb = `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`;
            } else {
              const m = col.match(/\d+/g);
              if (m && m.length >= 3) rgb = `${m[0]},${m[1]},${m[2]}`;
            }
          }
        } catch (e) {}
      }
      updateColor();

      function addSpark(x, y) {
        if (sparks.length > 25) sparks.shift();
        const angle = Math.random() * 6.283;
        const speed = 0.15 + Math.random() * 0.45;
        sparks.push({
          x: x + (Math.random() - 0.5) * 4,
          y: y + (Math.random() - 0.5) * 4,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 0.08,
          size: 1.0 + Math.random() * 1.5,
          birth: performance.now(),
          maxLife: SPARK_MS * (0.7 + Math.random() * 0.6)
        });
      }

      function render(now) {
        ctx.clearRect(0, 0, w, h);

        // Periodically refresh accent color to sync with sky shifts
        if (now - colorCheckAt > 600) {
          colorCheckAt = now;
          updateColor();
        }

        // 1. Purge expired path points
        while (path.length > 0 && now - path[0].t > TRAIL_MS) {
          path.shift();
        }

        // 2. Draw smooth continuous tapered ribbon
        if (path.length >= 2) {
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          // Multi-pass: outer glow pass then crisp inner core pass
          for (let pass = 0; pass < 2; pass++) {
            const isGlow = pass === 0;
            for (let i = 0; i < path.length - 1; i++) {
              const p0 = path[i];
              const p1 = path[i + 1];
              const age0 = now - p0.t;
              const age1 = now - p1.t;
              const life = Math.max(0, 1 - ((age0 + age1) * 0.5) / TRAIL_MS);
              if (life <= 0) continue;

              const ease = life * life; // smooth quadratic decay towards tail
              const lineWidth = isGlow ? (ease * 7.5 + 0.5) : (ease * 2.8 + 0.5);
              const alpha = isGlow ? (ease * 0.22) : (ease * 0.85);

              ctx.strokeStyle = `rgba(${rgb},${alpha.toFixed(3)})`;
              ctx.lineWidth = lineWidth;

              ctx.beginPath();
              ctx.moveTo(p0.x, p0.y);
              ctx.lineTo(p1.x, p1.y);
              ctx.stroke();
            }
          }
        }

        // 3. Render micro stardust sparks
        for (let i = sparks.length - 1; i >= 0; i--) {
          const s = sparks[i];
          const age = now - s.birth;
          if (age >= s.maxLife) {
            sparks.splice(i, 1);
            continue;
          }
          const life = 1 - age / s.maxLife;
          s.x += s.vx;
          s.y += s.vy;
          s.vx *= 0.98;
          s.vy *= 0.98;

          const r = s.size * (0.4 + 0.6 * life);
          const alpha = life * 0.7;

          // Sparkle halo
          ctx.fillStyle = `rgba(${rgb},${(alpha * 0.25).toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, r * 2.2, 0, 6.2832);
          ctx.fill();

          // Sparkle core
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, r, 0, 6.2832);
          ctx.fill();
        }

        // Keep loop running while trail points or sparks exist
        if (path.length > 0 || sparks.length > 0) {
          rafId = requestAnimationFrame(render);
        } else {
          rafId = 0;
        }
      }

      function onPointerMove(e) {
        const now = performance.now();
        const x = e.clientX;
        const y = e.clientY;

        if (lastPoint) {
          const dx = x - lastPoint.x;
          const dy = y - lastPoint.y;
          const dist = Math.hypot(dx, dy);

          if (dist > 3) {
            // Smooth linear interpolation for fast movements (eliminates sharp polygonal breaks)
            const steps = Math.min(Math.ceil(dist / 5), 10);
            for (let i = 1; i <= steps; i++) {
              const k = i / steps;
              path.push({
                x: lastPoint.x + dx * k,
                y: lastPoint.y + dy * k,
                t: lastPoint.t + (now - lastPoint.t) * k
              });
            }

            // Occasionally drop a delicate stardust spark
            if (dist > 12 && Math.random() < 0.45) {
              addSpark(x, y);
            }
          }
        } else {
          path.push({ x, y, t: now });
        }

        lastPoint = { x, y, t: now };

        if (!rafId) {
          rafId = requestAnimationFrame(render);
        }
      }

      window.addEventListener('pointermove', onPointerMove, { passive: true });
      document.addEventListener('pointerleave', () => { lastPoint = null; });
      window.addEventListener('blur', () => { lastPoint = null; });
    })();
  </script>

  <!-- Night comet: a falling star hits the Discord card, two lines wrap its border -->
  <script>
    (function () {
      const card = document.getElementById('lanyardCard');
      if (!card || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const NS = 'http://www.w3.org/2000/svg';
      let busy = false;

      function canRun() {
        return !busy && !document.hidden &&
          document.documentElement.getAttribute('data-sky') === 'night' &&
          !document.body.classList.contains('splash-active') &&
          card.classList.contains('visible');
      }

      /* two lines leave the impact corner (top-left) and meet in the opposite corner */
      function trace() {
        const W = card.offsetWidth, H = card.offsetHeight;
        const w = W - 1, h = H - 1, r = 11.5;
        const m = r * (1 - Math.SQRT1_2);
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('class', 'card-trace');
        svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
        svg.setAttribute('aria-hidden', 'true');
        const grp = document.createElementNS(NS, 'g');
        grp.setAttribute('transform', 'translate(0.5 0.5)');
        svg.appendChild(grp);
        card.appendChild(svg);

        const paths = [
          `M ${m} ${m} A ${r} ${r} 0 0 1 ${r} 0 L ${w - r} 0 A ${r} ${r} 0 0 1 ${w} ${r} L ${w} ${h - r} A ${r} ${r} 0 0 1 ${w - r} ${h}`,
          `M ${m} ${m} A ${r} ${r} 0 0 0 0 ${r} L 0 ${h - r} A ${r} ${r} 0 0 0 ${r} ${h} L ${w - r} ${h}`
        ];
        paths.forEach(d => {
          const p = document.createElementNS(NS, 'path');
          p.setAttribute('d', d);
          grp.appendChild(p);
          const len = p.getTotalLength();
          p.style.strokeDasharray = len;
          p.style.strokeDashoffset = len;
          p.animate(
            [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
            { duration: 1700, easing: 'cubic-bezier(0.45, 0, 0.25, 1)', fill: 'forwards' }
          );
        });
        svg.animate(
          [{ opacity: 1 }, { opacity: 1, offset: 0.55 }, { opacity: 0 }],
          { duration: 3200, easing: 'ease-out' }
        ).onfinish = () => svg.remove();
      }

      function fire() {
        if (!canRun()) return false;
        busy = true;

        const rect = card.getBoundingClientRect();
        const tx = rect.left + 1, ty = rect.top + 1;
        const deg = 30, ang = deg * Math.PI / 180;
        const dist = Math.max(window.innerWidth, window.innerHeight) * 0.6;
        const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist, L = 150;
        const tf = (x, y) => `translate(${x - L}px, ${y - 1}px) rotate(${deg}deg)`;

        const comet = document.createElement('div');
        comet.className = 'card-comet';
        document.body.appendChild(comet);
        const anim = comet.animate(
          [
            { transform: tf(tx - dx, ty - dy), opacity: 0 },
            { opacity: 1, offset: 0.12 },
            { transform: tf(tx, ty), opacity: 1 }
          ],
          { duration: 900, easing: 'cubic-bezier(0.4, 0, 0.8, 0.6)', fill: 'forwards' }
        );
        anim.onfinish = () => {
          comet.remove();
          const hit = document.createElement('div');
          hit.className = 'card-impact';
          hit.style.left = tx + 'px';
          hit.style.top = ty + 'px';
          document.body.appendChild(hit);
          hit.animate(
            [{ transform: 'scale(0.6)', opacity: 1 }, { transform: 'scale(5)', opacity: 0 }],
            { duration: 650, easing: 'ease-out' }
          ).onfinish = () => hit.remove();
          trace();
          setTimeout(() => { busy = false; }, 3300);
        };
        return true;
      }

      function schedule(first) {
        setTimeout(() => { fire(); schedule(false); }, first ? 7000 : 20000 + Math.random() * 25000);
      }
      schedule(true);

      /* try it by hand from the console (night mode only) */
      window.cardComet = function () {
        if (!fire()) console.log('Comets only fly at night, once the card is visible.');
      };
    })();
  </script>


  <!-- Sun glint: in day / sunset the sun's light catches the Discord card -->
  <script>
    (function () {
      const card = document.getElementById('lanyardCard');
      const sunEl = document.querySelector('.sun');
      if (!card || !sunEl || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const NS = 'http://www.w3.org/2000/svg';
      let busy = false;

      function canRun() {
        const sky = document.documentElement.getAttribute('data-sky');
        return !busy && !document.hidden && (sky === 'day' || sky === 'sunset') &&
          parseFloat(getComputedStyle(sunEl).opacity) > 0.6 &&
          !document.body.classList.contains('splash-active') &&
          card.classList.contains('visible');
      }

      function trace(right, bottom) {
        const W = card.offsetWidth, H = card.offsetHeight;
        const w = W - 1, h = H - 1, r = 11.5, m = r * (1 - Math.SQRT1_2);
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('class', 'card-trace warm');
        svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
        svg.setAttribute('aria-hidden', 'true');
        const g = document.createElementNS(NS, 'g');
        g.setAttribute('transform', `translate(0.5 0.5) translate(${right ? w : 0} ${bottom ? h : 0}) scale(${right ? -1 : 1} ${bottom ? -1 : 1})`);
        svg.appendChild(g);
        card.appendChild(svg);
        const ds = [
          `M ${m} ${m} A ${r} ${r} 0 0 1 ${r} 0 L ${w - r} 0 A ${r} ${r} 0 0 1 ${w} ${r} L ${w} ${h - r} A ${r} ${r} 0 0 1 ${w - r} ${h}`,
          `M ${m} ${m} A ${r} ${r} 0 0 0 0 ${r} L 0 ${h - r} A ${r} ${r} 0 0 0 ${r} ${h} L ${w - r} ${h}`
        ];
        ds.forEach(d => ['g', 'c'].forEach(cls => {
          const p = document.createElementNS(NS, 'path');
          p.setAttribute('d', d);
          p.setAttribute('class', cls);
          g.appendChild(p);
          const len = p.getTotalLength();
          p.style.strokeDasharray = len;
          p.style.strokeDashoffset = len;
          p.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
            { duration: 2400, easing: 'cubic-bezier(0.45, 0, 0.25, 1)', fill: 'forwards' });
        }));
        svg.animate([{ opacity: 1 }, { opacity: 1, offset: 0.55 }, { opacity: 0 }],
          { duration: 4200, easing: 'ease-out' }).onfinish = () => svg.remove();
      }

      function sheen(right) {
        const box = document.createElement('div');
        box.className = 'card-sheen';
        if (right) box.style.transform = 'scaleX(-1)';
        const i = document.createElement('i');
        box.appendChild(i);
        card.appendChild(box);
        i.animate([
          { transform: 'skewX(-18deg) translateX(-130%)', opacity: 0 },
          { opacity: 1, offset: 0.3 },
          { transform: 'skewX(-18deg) translateX(330%)', opacity: 0 }
        ], { duration: 1800, easing: 'ease-in-out' }).onfinish = () => box.remove();
      }

      function fire() {
        if (!canRun()) return false;
        busy = true;
        const disc = sunEl.querySelector('.sun-disc') || sunEl;
        const sr = disc.getBoundingClientRect(), cr = card.getBoundingClientRect();
        const right = (sr.left + sr.width / 2) > (cr.left + cr.width / 2);
        const bottom = (sr.top + sr.height / 2) > (cr.top + cr.height / 2);
        const tx = right ? cr.right - 1 : cr.left + 1;
        const ty = bottom ? cr.bottom - 1 : cr.top + 1;

        const fl = document.createElement('div');
        fl.className = 'card-flare';
        fl.style.left = tx + 'px';
        fl.style.top = ty + 'px';
        document.body.appendChild(fl);
        fl.animate([
          { transform: 'scale(0.4)', opacity: 0 },
          { transform: 'scale(2.6)', opacity: 1, offset: 0.25 },
          { transform: 'scale(5)', opacity: 0 }
        ], { duration: 1300, easing: 'ease-out' }).onfinish = () => fl.remove();

        setTimeout(() => { trace(right, bottom); sheen(right); }, 250);
        setTimeout(() => { busy = false; }, 4700);
        return true;
      }

      function schedule(first) {
        setTimeout(() => { fire(); schedule(false); }, first ? 9000 : 28000 + Math.random() * 30000);
      }
      schedule(true);
      window.sunGlint = function () {
        if (!fire()) console.log('The sun only glints in day / sunset mode, once the card is visible.');
      };
    })();
  </script>
