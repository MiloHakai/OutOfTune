<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

  <meta property="og:type" content="website" />

  <title>MiloHakai</title>

  <link rel="icon" type="image/png" href="../assets/icons/logo.png">
  <link rel="shortcut icon" type="image/png" href="../assets/icons/logo.png">
  <link rel="apple-touch-icon" type="image/png" href="../assets/icons/logo.png">

  <!-- External Styles & Icon Sets -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" />
  
  <!-- GOOGLE FONTS: Added Lexend for English/French lyrics readability alongside Noto Sans JP fallback and Press Start 2P for retro accents -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Lexend:wght@300;400&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* --- Palette: pastel moonlight default (night) --- */
      --bg: #050505;
      --bg2: #070707;
      --text: #f2f0ff;
      --text-dim: rgba(220, 226, 255, 0.82);
      --line: rgba(255, 250, 255, 0.92);
      --line-soft: rgba(230, 228, 255, 0.55);
      --glow: rgba(190, 198, 255, 0.38);

      /* Layout offsets matching image_86448b.jpg */
      --gutter: 20px;

      /* Space plate background elements */
      --band-strong: rgba(255, 255, 255, 0.20);
      --band-soft: rgba(255, 255, 255, 0.08);
      --mist: rgba(255, 255, 255, 0.06);
      --dust: rgba(255, 255, 255, 0.12);

      /* CRT Overlays */
      --scanline: rgba(0, 0, 0, 0.18);
      --vignette: rgba(0, 0, 0, 0.4);

      /* Dynamic sky variables (controlled by calendar scripts) */
      --sky-top: #050505;
      --sky-mid: #070707;
      --sky-bottom: #121214;
      --accent: #d4c4ff;
      --star-rgb: 255,255,255; 
      --star-density: 1; 
      --wave-a: #f8f6ff;
      --wave-b: #c4b5fd;
      --flicker-overlay: rgba(255,255,255,0.006);
      --icon: rgba(208, 214, 255, 0.9);

      /* Sun / Moon light profiles */
      --sun-core: #FFD66A;
      --sun-mid: #FF9E4A;
      --sun-glow: rgba(255, 170, 110, 0.28);
      --moon-rim: rgba(248, 246, 255, 0.95);
      --moon-rim-soft: rgba(198, 192, 235, 0.55);
      --moon-halo: rgba(165, 158, 220, 0.45);

      /* Solar path coordinates */
      --sun-left: 8%;
      --sun-top: 55%;
      --sun-scale: 1.0;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: 'Press Start 2P', 'Lexend', 'Noto Sans JP', monospace;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }

    body {
      position: relative;
      background: var(--bg);
      transition: background 0.35s ease, color 0.35s ease;
      padding-left: 8px;
      padding-right: 8px;
    }

    /* ─────────────────────────────────────────────────────────────
       SPACE PLATE BACKGROUND (galaxy band + dithering + crescents)
       ───────────────────────────────────────────────────────────── */

    .wave-text {
      background: linear-gradient(90deg,
          var(--wave-a) 0%,
          var(--wave-a) 38%,
          var(--wave-b) 50%,
          var(--wave-a) 62%,
          var(--wave-a) 100%);

      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: wave-effect 6s linear infinite;

      text-shadow:
        0 0 12px var(--glow),
        0 0 22px color-mix(in srgb, var(--accent) 55%, transparent);
      -webkit-text-stroke: 0.22px color-mix(in srgb, var(--line-soft) 70%, transparent);
    }

    .space-plate {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 60%, var(--sky-bottom) 100%),
        radial-gradient(ellipse at 50% 40%, var(--bg2), var(--bg));
      transition: background 1.2s ease;
    }

    /* Cosmic visual noise layout */
    .space-plate::before {
      content: "";
      position: absolute;
      inset: -25%;
      transform: rotate(-18deg) scale(1.25);
      opacity: 0.98;

      background:
        radial-gradient(ellipse 170% 22% at 72% 62%,
          var(--band-strong) 0%,
          var(--band-soft) 38%,
          var(--band-soft) 58%,
          transparent 78%),

        radial-gradient(ellipse 70% 45% at 18% 28%,
          var(--mist) 0%,
          transparent 72%),

        radial-gradient(ellipse 60% 40% at 90% 84%,
          var(--mist) 0%,
          transparent 75%);
    }

    .space-plate::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.22;
      mix-blend-mode: screen;
      background-image: radial-gradient(var(--dust) 1px, transparent 1px);
      background-size: 2px 2px;
    }

    /* Single high-fidelity crescent moon placed in top-right of page */
    .moon {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
      opacity: 0.75;
      filter: drop-shadow(0 0 16px var(--moon-halo, var(--glow)));
      transition: opacity 1.2s ease, transform 1.2s ease, filter 1.2s ease;
      width: 180px;
      height: 180px;
      top: 15%;
      right: 12%;
      background:
        radial-gradient(circle at 30% 30%,
          transparent 58%,
          var(--moon-rim, var(--line)) 59%,
          var(--moon-rim, var(--line)) 62%,
          var(--moon-rim-soft, var(--line-soft)) 66%,
          transparent 72%);
    }

    .sun {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      width: 220px;
      height: 220px;
      top: 12%;
      left: 78%;
      transform: translate(-50%, 0) scale(1);
      opacity: 0;
      background: radial-gradient(circle at 30% 30%, var(--sun-core, #FFD66A) 0%, var(--sun-mid, #FF9E4A) 45%, transparent 70%);
      filter: drop-shadow(0 0 40px var(--sun-glow, rgba(255,158,74,0.18)));
      transition: opacity 1.2s ease, filter 1.2s ease, left 2s ease-out, top 2s ease-out, transform 2s ease-out;
    }

    @keyframes moon-bob {
      0% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-6px) rotate(0.2deg); }
      100% { transform: translateY(0) rotate(0); }
    }

    [data-sky="day"] .sun {
      opacity: 1;
      left: var(--sun-left);
      top: var(--sun-top);
      transform: translate(-50%, 0) scale(var(--sun-scale));
    }

    [data-sky="sunset"] .sun {
      opacity: 1;
      left: var(--sun-left);
      top: var(--sun-top);
      transform: translate(-50%, 0) scale(var(--sun-scale));
    }
    [data-sky="indigo"] .sun,
    [data-sky="night"] .sun { opacity: 0; transform: translate(-50%, -10%) scale(0.7); }

    [data-sky="day"] .moon { opacity: 0; transform: translateY(-28px) scale(0.9); filter: blur(0.6px); pointer-events: none; }
    [data-sky="sunset"] .moon { opacity: 0.35; transform: translateY(-8px) scale(0.95); filter: blur(0); }
    [data-sky="indigo"] .moon { opacity: 0.7; transform: translateY(-4px) scale(0.98); filter: blur(0); }
    [data-sky="night"] .moon { opacity: 0.98; transform: translateY(0) scale(1); animation: moon-bob 12s ease-in-out infinite; }

    #starCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* ─────────────────────────────────────────────────────────────
       CRT OVERLAY & NOISE
       ───────────────────────────────────────────────────────────── */

    .crt-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }

    .crt-overlay::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg,
          var(--scanline) 0px,
          var(--scanline) 2px,
          transparent 2px,
          transparent 5px);
      animation: scanScroll 10s linear infinite;
    }

    @keyframes scanScroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(5px); }
    }

    .crt-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 130% 115% at 50% 48%,
          transparent 0%,
          transparent 58%,
          color-mix(in srgb, var(--vignette) 72%, transparent) 85%,
          var(--vignette) 100%);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: var(--flicker-overlay);
      pointer-events: none;
      z-index: 998;
      animation: flicker 6.5s ease-in-out infinite;
      opacity: 0;
    }

    @keyframes flicker {
      0%, 100% { opacity: 0; }
      50% { opacity: 0.28; }
    }

    /* ─────────────────────────────────────────────────────────────
       NEON BORDER FRAME SYSTEM
       ───────────────────────────────────────────────────────────── */

    .border-segments {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 6;
    }

    .border-top,
    .border-right,
    .border-bottom,
    .border-left {
      position: absolute;
      box-shadow: 0 0 10px var(--glow);
      animation: border-glow 4.5s ease-in-out infinite;
      transition: box-shadow 1s ease, filter 1s ease;
    }

    .border-top { top: 0; left: 0; right: 0; height: 3px; }
    .border-right { top: 0; right: 0; bottom: 0; width: 3px; }
    .border-bottom { bottom: 0; left: 0; right: 0; height: 3px; }
    .border-left { top: 0; left: 0; bottom: 0; width: 3px; }

    .border-top::after,
    .border-right::after,
    .border-bottom::after,
    .border-left::after {
      content: '';
      position: absolute;
      will-change: transform, opacity;
      border-radius: 4px;
      opacity: 0;
    }

    .border-top::after,
    .border-bottom::after {
      top: -1px;
      bottom: -1px;
      width: 15vw;
    }

    .border-top::after {
      left: 0;
      background: linear-gradient(90deg, transparent, var(--line-soft), var(--line), var(--line-soft), transparent);
      animation: snake-ltr 12s linear infinite;
    }

    .border-bottom::after {
      right: 0;
      background: linear-gradient(270deg, transparent, var(--line-soft), var(--line), var(--line-soft), transparent);
      animation: snake-rtl 12s linear infinite;
    }

    .border-right::after,
    .border-left::after {
      left: -1px;
      right: -1px;
      height: 15vh;
    }

    .border-right::after {
      top: 0;
      background: linear-gradient(180deg, transparent, var(--line-soft), var(--line), var(--line-soft), transparent);
      animation: snake-ttb 12s linear infinite;
    }

    .border-left::after {
      bottom: 0;
      background: linear-gradient(0deg, transparent, var(--line-soft), var(--line), var(--line-soft), transparent);
      animation: snake-btt 12s linear infinite;
    }

    .border-line-1.border-top::after { animation-delay: 0s; }
    .border-line-1.border-right::after { animation-delay: 3s; }
    .border-line-1.border-bottom::after { animation-delay: 6s; }
    .border-line-1.border-left::after { animation-delay: 9s; }
    .border-line-2.border-top::after { animation-delay: 6s; }
    .border-line-2.border-right::after { animation-delay: 9s; }
    .border-line-2.border-bottom::after { animation-delay: 0s; }
    .border-line-2.border-left::after { animation-delay: 3s; }

    @keyframes snake-ltr {
      0% { transform: translateX(-15vw); opacity: 1; }
      25% { transform: translateX(100vw); opacity: 1; }
      25.01%, 100% { transform: translateX(100vw); opacity: 0; }
    }

    @keyframes snake-ttb {
      0% { transform: translateY(-15vh); opacity: 1; }
      25% { transform: translateY(100vh); opacity: 1; }
      25.01%, 100% { transform: translateY(100vh); opacity: 0; }
    }

    @keyframes snake-rtl {
      0% { transform: translateX(15vw); opacity: 1; }
      25% { transform: translateX(-100vw); opacity: 1; }
      25.01%, 100% { transform: translateX(-100vw); opacity: 0; }
    }

    @keyframes snake-btt {
      0% { transform: translateY(15vh); opacity: 1; }
      25% { transform: translateY(-100vh); opacity: 1; }
      25.01%, 100% { transform: translateY(-100vh); opacity: 0; }
    }

    @keyframes border-glow {
      0%, 100% {
        opacity: 0.75;
        filter: drop-shadow(0 0 8px var(--glow));
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 14px var(--glow)) drop-shadow(0 0 6px var(--line-soft));
      }
    }

    /* ─────────────────────────────────────────────────────────────
       CORE LAYOUT & GRID ALIGNMENT (20px INNER SPACING)
       ───────────────────────────────────────────────────────────── */

    .container {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start; 
      justify-content: center;
      padding-left: calc(var(--gutter) + 12px); 
      padding-right: calc(var(--gutter) + 12px); 
      text-align: left;
      box-sizing: border-box;
      width: calc(100% - 24px);
      max-width: none;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      cursor: pointer;
      user-select: none;
      position: relative;
      display: inline-block;
      line-height: 1.25;
      color: var(--text);
      text-shadow:
        0 0 10px var(--glow),
        0 0 8px color-mix(in srgb, var(--accent) 45%, transparent);
      animation: titlePulse 4s ease-in-out infinite;
    }

    @keyframes titlePulse {
      0%, 100% {
        text-shadow:
          0 0 10px var(--glow),
          0 0 8px color-mix(in srgb, var(--accent) 45%, transparent);
      }
      50% {
        text-shadow:
          0 0 14px var(--glow),
          0 0 12px color-mix(in srgb, var(--accent) 55%, transparent);
      }
    }

    @keyframes wave-effect {
      0% { background-position: 200% 0; }
      100% { background-position: -100% 0; }
    }

    p {
      font-size: 0.55rem;
      line-height: 2.1;
      margin: 1.1rem 0 0;
      color: var(--text-dim);
      text-shadow:
        0 0 1px color-mix(in srgb, var(--text) 22%, transparent),
        0 0 8px var(--glow);
      letter-spacing: 0.05em;
    }

    .icons {
      display: flex;
      gap: 1.8rem;
      margin-top: 1.8rem;
    }

    .icons a {
      color: var(--icon);
      font-size: 1.2rem;
      transition: all 0.25s ease;
      position: relative;
      text-shadow:
        0 0 1px color-mix(in srgb, var(--icon) 35%, transparent),
        0 0 10px var(--glow);
    }

    .icons a:hover {
      color: var(--accent);
      transform: translateY(-4px) scale(1.1);
      text-shadow: 0 0 18px var(--accent);
    }

    .icons a::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%) scaleX(0);
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, var(--accent) 0%, var(--line) 100%);
      box-shadow: 0 0 10px var(--accent);
      transition: transform 0.25s ease;
    }

    .icons a:hover::after {
      transform: translateX(-50%) scaleX(1);
    }

    /* Click counter system */
    .click-counter {
      margin-top: 1.2rem;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      font-size: 0.52rem;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .click-counter.show {
      opacity: 1;
      transform: translateY(0);
    }

    .click-counter p {
      margin: 0;
      color: var(--text-dim);
      text-shadow:
        0 0 1px color-mix(in srgb, var(--text) 20%, transparent),
        0 0 8px var(--glow);
    }

    #clickCount {
      color: var(--text);
      text-shadow:
        0 0 1px color-mix(in srgb, var(--text) 25%, transparent),
        0 0 10px var(--glow);
    }

    /* ─────────────────────────────────────────────────────────────
       PREMIUM DOCK FOOTER LAYOUT
       ───────────────────────────────────────────────────────────── */

    footer {
      position: fixed;
      bottom: var(--gutter);
      left: calc(var(--gutter) + 12px);
      right: calc(var(--gutter) + 12px);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 10;
      box-sizing: border-box;
      pointer-events: none;
    }

    .footer-left {
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: flex-start;
      text-align: left;
      pointer-events: auto;
      max-width: 55vw;
    }

    .song-title {
      font-family: 'Press Start 2P', 'Noto Sans JP', monospace;
      font-size: 0.50rem;
      line-height: 1.4;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-shadow:
        0 0 1px color-mix(in srgb, var(--text) 18%, transparent),
        0 0 8px var(--glow);
    }

    /* PREMIUM VIEWPORT SCROLLER SYSTEM FOR LYRICS (Tightened Line spacing) */
    .lyrics-viewport {
      position: relative;
      height: 1.1rem; 
      width: 100%;
      overflow: hidden;
      padding-left: 12px;
      padding-right: 12px;
      box-sizing: border-box;
    }

    .lyric-line {
      position: absolute;
      left: 0;
      right: 0;
      font-family: 'Lexend', 'Noto Sans JP', sans-serif;
      font-weight: 400;
      font-size: 0.50rem; /* Perfectly scaled to fit tight spaces without clipping */
      font-stretch: expanded;
      color: var(--text-dim);
      opacity: 0;
      letter-spacing: 0.08em;
      text-shadow: 0 0 6px var(--glow);
      line-height: 1.3; /* Tight line heights remove vertically stretched illusion */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transform: translateY(14px); /* starting coordinate */
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    }

    .lyric-line.active {
      opacity: 0.95;
      transform: translateY(0);
    }

    .lyric-line.exit {
      opacity: 0;
      transform: translateY(-14px); /* smooth push-up exit */
    }

    .footer-right {
      text-align: right;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.48rem;
      line-height: 1.4; /* Compact line spacing eliminates visual stretching */
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-shadow:
        0 0 1px color-mix(in srgb, var(--text) 18%, transparent),
        0 0 8px var(--glow);
      pointer-events: auto;
      padding-right: 12px;
      box-sizing: border-box;
    }

    /* ─────────────────────────────────────────────────────────────
       SPLASH AUDIO GATEWAY SYSTEM
       ───────────────────────────────────────────────────────────── */

    .splash-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.85s ease, visibility 0.85s ease;
    }

    .splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
    }

    .typing-text {
      display: inline-block;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid color-mix(in srgb, var(--accent) 55%, var(--line));
      padding-right: 6px;
      color: var(--text);
      text-shadow:
        0 0 1px color-mix(in srgb, var(--text) 30%, transparent),
        0 0 12px var(--glow);
      letter-spacing: 0.15em;
      font-size: 1.25rem;
    }

    .typing-text.typing {
      animation: blinkCaret 0.75s step-end infinite;
    }

    @keyframes blinkCaret {
      from, to { border-color: transparent; }
      50% { border-color: var(--line); }
    }

    .splash-hint {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.45rem;
      color: var(--text-dim);
      letter-spacing: 0.15em;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      margin-top: 0.8rem;
      pointer-events: none;
    }

    .splash-hint.show {
      opacity: 0.75;
      transform: translateY(0);
      animation: hintBlink 2.2s ease-in-out infinite;
    }

    @keyframes hintBlink {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.85; }
    }

    /* ─────────────────────────────────────────────────────────────
       MOBILE VIEWPORT ADAPTATION
       ───────────────────────────────────────────────────────────── */

    @media (max-width: 768px) {
      .container {
        padding-left: var(--gutter);
        padding-right: var(--gutter);
        align-items: center;
        text-align: center;
      }
      .moon {
        width: 130px;
        height: 130px;
        top: 8%;
        right: 8%;
      }
      footer {
        left: var(--gutter);
        right: var(--gutter);
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-end;
        bottom: var(--gutter);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .border-top,
      .border-right,
      .border-bottom,
      .border-left {
        animation: none !important;
      }
      .border-top::after,
      .border-right::after,
      .border-bottom::after,
      .border-left::after {
        animation: none !important;
        opacity: 0 !important;
      }
      .crt-overlay::before,
      body::before,
      h1,
      .splash-hint {
        animation: none !important;
      }
    }

    /* ─────────────────────────────────────────────────────────────
       LANYARD WIDGET SYSTEM (Discord & Spotify Status Card)
       ───────────────────────────────────────────────────────────── */
    .lanyard-card {
      position: fixed;
      right: calc(var(--gutter) + 24px);
      top: 50%;
      transform: translateY(-50%);
      width: 280px;
      padding: 14px;
      background: color-mix(in srgb, var(--bg2) 65%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 15px var(--glow);
      z-index: 1001;
      transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      font-family: 'Lexend', 'Noto Sans JP', sans-serif;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      overflow: visible; /* allow outer border glow to show */
    }

    /* Animated snake border for Lanyard card — mirrors the page border system */
    .lanyard-border-top,
    .lanyard-border-right,
    .lanyard-border-bottom,
    .lanyard-border-left {
      position: absolute;
      pointer-events: none;
      z-index: 2;
    }
    .lanyard-border-top    { top: 0;    left: 0;   right: 0;    height: 2px; }
    .lanyard-border-right  { top: 0;    right: 0;  bottom: 0;   width: 2px; }
    .lanyard-border-bottom { bottom: 0; left: 0;   right: 0;    height: 2px; }
    .lanyard-border-left   { top: 0;    left: 0;   bottom: 0;   width: 2px; }

    /* Single rounded border glow for the card */
    .lanyard-card::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 16px;
      pointer-events: none;
      z-index: -1;
      background: radial-gradient(ellipse at center, color-mix(in srgb, var(--accent) 60%, transparent 40%), transparent 60%);
      filter: blur(14px) saturate(120%);
      opacity: 0.9;
      mix-blend-mode: screen;
    }

    /* Subtle colored outline to match border shape */
    .lanyard-card {
      box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 0 12px color-mix(in srgb, var(--accent) 50%, transparent 50%);
    }

    /* Use two line elements per side (line-1 and line-2) so there are
       exactly two snakes circling the card, matching the main page system. */
    /* No per-line animation delays needed for static glow */

    .lanyard-card.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .lanyard-card:hover {
      transform: translateY(-52%) scale(1.02);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 25px var(--glow);
      border-color: var(--line);
    }

    .lanyard-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lanyard-avatar-container {
      position: relative;
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }

    .lanyard-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--line-soft);
      transition: border-color 0.3s ease;
    }

    .lanyard-status-dot {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid var(--bg);
      background-color: #80848e; /* default offline */
      transition: background-color 0.3s ease;
    }

    .lanyard-status-dot.online { background-color: #23a55a; animation: status-pulse-green 2s infinite; }
    .lanyard-status-dot.idle { background-color: #f0b232; }
    .lanyard-status-dot.dnd { background-color: #f23f43; }
    .lanyard-status-dot.offline { background-color: #80848e; }

    @keyframes status-pulse-green {
      0% { box-shadow: 0 0 0 0 rgba(35, 165, 90, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(35, 165, 90, 0); }
      100% { box-shadow: 0 0 0 0 rgba(35, 165, 90, 0); }
    }

    .lanyard-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .lanyard-username {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.52rem;
      letter-spacing: 0.05em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lanyard-custom-status {
      font-size: 0.52rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0;
      line-height: 1.3;
    }

    .lanyard-custom-emoji {
      display: inline-block;
      width: 14px;
      height: 14px;
      vertical-align: text-bottom;
      margin-right: 4px;
    }

    .lanyard-status-text {
      font-size: 0.55rem;
      color: var(--text-dim);
      opacity: 0.8;
      letter-spacing: 0.03em;
    }

    /* Spotify presence section */
    .lanyard-spotify {
      border-top: 1px solid var(--line-soft);
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lanyard-spotify-header {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.42rem;
      letter-spacing: 0.08em;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .lanyard-spotify-header i {
      color: #1db954; /* Spotify Green */
      font-size: 0.6rem;
    }

    .lanyard-spotify-content {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .lanyard-spotify-album {
      width: 46px;
      height: 46px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--line-soft);
      flex-shrink: 0;
    }

    /* No spin — album art is a static thumbnail */


    .lanyard-spotify-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex-grow: 1;
    }

    .lanyard-spotify-track {
      font-weight: 500;
      font-size: 0.54rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .lanyard-spotify-artist {
      font-size: 0.48rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .lanyard-spotify-progress-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .lanyard-spotify-progress-bar {
      height: 3px;
      width: 100%;
      background: var(--line-soft);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .lanyard-spotify-progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.5s linear;
      border-radius: 2px;
    }

    .lanyard-spotify-time {
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 0.45rem;
      color: var(--text-dim);
      opacity: 0.7;
    }

    /* Responsive Adaptation */
    @media (max-width: 768px) {
      .lanyard-card {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(var(--gutter) + 68px); /* above footer */
        top: auto;
        width: auto;
        min-width: 240px;
        max-width: calc(100% - var(--gutter) * 2 - 24px);

      }

      }

      }

        font-size: 0.56rem;
      }
      .lanyard-spotify-time {
        font-size: 0.52rem;
      }
    }
  </style>
</head>

  <script>
    (function () {
      const canvas = document.getElementById('starCanvas');
      const ctx = canvas.getContext('2d', { alpha: true });
      let W = 0, H = 0;
      let stars = [];
      let shooting = null;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = canvas.width = Math.floor(window.innerWidth * dpr);
        H = canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); 
        initStars();
      }

      function rand(min, max) { return min + Math.random() * (max - min); }

      function initStars() {
        stars = [];
        const area = window.innerWidth * window.innerHeight;
        const css = getComputedStyle(document.documentElement);
        const multiplier = (window.__sky && window.__sky.starDensity) || parseFloat(css.getPropertyValue('--star-density')) || 1;
        const count = Math.min(Math.floor(area / 2600 * multiplier), 900);

        for (let i = 0; i < count; i++) {
          const r = Math.random();
          stars.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: r < 0.70 ? rand(0.35, 0.9) : r < 0.93 ? rand(0.9, 1.3) : rand(1.3, 1.9),
            a: rand(0.20, 0.90),
            tw: rand(0.004, 0.010),
            off: rand(0, Math.PI * 2),
            spike: Math.random() < 0.016
          });
        }
      }

      function starColor(alpha) {
        const css = getComputedStyle(document.documentElement);
        const rgb = (css.getPropertyValue('--star-rgb') || '255,255,255').trim();
        return `rgba(${rgb},${alpha})`;
      }

      function drawStar(s, t) {
        const twinkle = Math.sin(t * s.tw * 60 + s.off);
        const a = s.a * (0.75 + 0.25 * twinkle);
        const sz = s.size * (0.9 + 0.1 * twinkle);

        if (s.spike) {
          ctx.save();
          ctx.translate(s.x, s.y);
          ctx.strokeStyle = starColor(a);
          ctx.lineWidth = 0.6;
          const len = sz * 3.6;
          for (let i = 0; i < 4; i++) {
            ctx.save();
            ctx.rotate(i * Math.PI / 4);
            ctx.globalAlpha = (i < 2 ? 1 : 0.55);
            ctx.beginPath();
            ctx.moveTo(0, -len); ctx.lineTo(0, len);
            ctx.stroke();
            ctx.restore();
          }
          ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(s.x, s.y, sz, 0, Math.PI * 2);
        ctx.fillStyle = starColor(a);
        ctx.fill();

        if (s.spike) {
          const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, sz * 5);
          const css = getComputedStyle(document.documentElement);
          const starRgb = (css.getPropertyValue('--star-rgb') || '255,255,255').trim();
          g.addColorStop(0, `rgba(${starRgb},${a * 0.22})`);
          g.addColorStop(1, 'transparent');
          ctx.beginPath();
          ctx.arc(s.x, s.y, sz * 5, 0, Math.PI * 2);
          ctx.fillStyle = g;
          ctx.fill();
        }
      }

      function maybeShoot() {
        if (!shooting && Math.random() < 0.0028) {
          shooting = {
            x: Math.random() * window.innerWidth * 0.65,
            y: Math.random() * window.innerHeight * 0.35,
            vx: rand(7, 12),
            vy: rand(2.5, 5),
            life: 1
          };
        }
        if (shooting) {
          const css = getComputedStyle(document.documentElement);
          const rgb = (css.getPropertyValue('--star-rgb') || '255,255,255').trim();
          ctx.strokeStyle = `rgba(${rgb},${shooting.life * 0.55})`;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(shooting.x, shooting.y);
          ctx.lineTo(shooting.x - shooting.vx * 10, shooting.y - shooting.vy * 10);
          ctx.stroke();

          shooting.x += shooting.vx;
          shooting.y += shooting.vy;
          shooting.life -= 0.03;

          if (shooting.life <= 0 || shooting.x > window.innerWidth || shooting.y > window.innerHeight) {
            shooting = null;
          }
        }
      }

      function draw(t) {
        const skyPhase = document.documentElement.getAttribute('data-sky');
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        if (skyPhase === 'day') {
          shooting = null;
          requestAnimationFrame(draw);
          return;
        }
        for (const s of stars) drawStar(s, t);
        maybeShoot();
        requestAnimationFrame(draw);
      }

      window.__starfield = {
        setSkyVars(vars) {
          window.__sky = Object.assign(window.__sky || {}, vars || {});
          if (typeof initStars === 'function') initStars();
        }
      };

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(draw);
    })();
  </script>

  <script>
    let clickCount = 0;
    const clickCounter = document.getElementById('clickCounter');
    const clickCountSpan = document.getElementById('clickCount');

    function playClickSound() {

      if (s) {

  <script>
    (function () {
      const tracks = {
        day: document.getElementById('bgmDay'),
        sunset: document.getElementById('bgmSunset'),
        night: document.getElementById('bgmNight')
      };

      const DEFAULT_VOLUME = 0.22;
      let current = null;

      function ensureTrack(t) {
        if (!t) return;
        t.loop = true;
        t.preload = 'auto';
        t.volume = 0;
        t.muted = true;
        t.play().catch(() => { });
      }

      function ensureAll() {
        Object.values(tracks).forEach(ensureTrack);
      }

      function fadeTo(el, to, ms = 900) {
        if (!el) return;
        el.muted = false;
        const start = (typeof el.volume === 'number') ? el.volume : 0;
        if (ms <= 0) {
          const v = Math.max(0, Math.min(1, to));
          try { el.volume = v; } catch (e) { }
          if (v === 0) try { el.pause(); } catch (e) { }
          return;
        }
        const startT = performance.now();
        function clamp(v) { return Math.max(0, Math.min(1, v)); }
        function step(now) {
          const t = Math.min(1, (now - startT) / Math.max(1, ms));
          const v = start + (to - start) * t;
          try { el.volume = clamp(v); } catch (e) { }
          if (t < 1) requestAnimationFrame(step);
          else {
            try { el.volume = clamp(to); } catch (e) { }
            if (Math.abs(clamp(to)) < 1e-6) try { el.pause(); } catch (e) { }
          }
        }
        requestAnimationFrame(step);
      }

      function setFor(paletteName) {
        const map = { day: 'day', sunset: 'sunset', indigo: 'sunset', night: 'night' };
        const key = map[paletteName] || 'night';
        if (current === key) return;
        const newT = tracks[key];
        const oldT = current ? tracks[current] : null;
        current = key;
        if (newT) {
          try { newT.play().catch(() => { }); } catch (e) { }
          fadeTo(newT, DEFAULT_VOLUME);
        }
        if (oldT && oldT !== newT) fadeTo(oldT, 0);
      }

      window.__bgmManager = { setFor, ensureAll, tracks };
      ensureAll();

      const onFirstGesture = () => {
        Object.values(tracks).forEach(t => {
          if (!t) return;
          t.muted = false;
          try { t.play().catch(() => { }); } catch (e) { }
        });
        if (current && tracks[current]) fadeTo(tracks[current], DEFAULT_VOLUME, 700);
      };

      window.__bgmManager.onFirstGesture = onFirstGesture;

      ['pointerdown', 'touchstart', 'mousedown', 'keydown'].forEach(ev =>
        document.addEventListener(ev, onFirstGesture, { once: true, capture: true })
      );
    })();
  </script>

  <script>
    (function () {
      const splash = document.getElementById('splashScreen');
      const splashTitle = document.getElementById('splashTitle');
      const splashHint = document.getElementById('splashHint');
      const mainTitle = document.getElementById('username');
      const text = (mainTitle && mainTitle.textContent.trim()) || 'MiloHakai';

      function typeText(el, str, delay, done) {
        el.textContent = '';
        el.classList.add('typing');
        let i = 0;
        const t = setInterval(() => {
          el.textContent += str[i++];
          if (i >= str.length) {
            clearInterval(t);
            el.classList.remove('typing');
            if (done) done();
          }
        }, delay);
      }

      function hide() {
        if (splash) {
          splash.classList.add('hidden');
          // Activate and unmute audio on dismissal
          if (window.__bgmManager && typeof window.__bgmManager.onFirstGesture === 'function') {
            window.__bgmManager.onFirstGesture();
          }
        }
      }

      if (splash && splashTitle) {
        // Run Typing sequence, then smoothly show "click to continue"

  <script>
    (function () {
      const SKY_LAT = 40.8518;
      const SKY_LON = 14.2681;

      const SC_PI = Math.PI,
        SC_sin = Math.sin,
        SC_cos = Math.cos,
        SC_tan = Math.tan,
        SC_asin = Math.asin,
        SC_atan = Math.atan2,
        SC_acos = Math.acos,
        SC_rad = SC_PI / 180,
        SC_dayMs = 1000 * 60 * 60 * 24,
        SC_J1970 = 2440588,
        SC_J2000 = 2451545,
        SC_e = SC_rad * 23.4397;

      function SC_toJulian(date) { return date.valueOf() / SC_dayMs - 0.5 + SC_J1970; }
      function SC_fromJulian(j) { return new Date((j + 0.5 - SC_J1970) * SC_dayMs); }
      function SC_toDays(date) { return SC_toJulian(date) - SC_J2000; }

      function SC_rightAscension(l, b) {
        return SC_atan(SC_sin(l) * SC_cos(SC_e) - SC_tan(b) * SC_sin(SC_e), SC_cos(l));
      }
      function SC_declination(l, b) {
        return SC_asin(SC_sin(b) * SC_cos(SC_e) + SC_cos(b) * SC_sin(SC_e) * SC_sin(l));
      }
      function SC_siderealTime(d, lw) { return SC_rad * (280.16 + 360.9856235 * d) - lw; }
      function SC_solarMeanAnomaly(d) { return SC_rad * (357.5291 + 0.98560028 * d); }

      function SC_eclipticLongitude(M) {
        const C = SC_rad * (1.9148 * SC_sin(M) + 0.02 * SC_sin(2 * M) + 0.0003 * SC_sin(3 * M));
        const P = SC_rad * 102.9372;
        return M + C + P + SC_PI;
      }

      function SC_sunCoords(d) {
        const M = SC_solarMeanAnomaly(d);
        const L = SC_eclipticLongitude(M);
        return { dec: SC_declination(L, 0), ra: SC_rightAscension(L, 0) };
      }

      const SC_J0 = 0.0009;
      function SC_julianCycle(d, lw) { return Math.round(d - SC_J0 - lw / (2 * SC_PI)); }
      function SC_approxTransit(Ht, lw, n) { return SC_J0 + (Ht + lw) / (2 * SC_PI) + n; }
      function SC_solarTransitJ(ds, M, L) { return SC_J2000 + ds + 0.0053 * SC_sin(M) - 0.0069 * SC_sin(2 * L); }
      function SC_hourAngle(h, phi, d) {
        return SC_acos((SC_sin(h) - SC_sin(phi) * SC_sin(d)) / (SC_cos(phi) * SC_cos(d)));
      }
      function SC_observerAngle(height) { return -2.076 * Math.sqrt(height || 0) / 60; }

      function SC_getSetJ(h, lw, phi, dec, n, M, L) {
        const w = SC_hourAngle(h, phi, dec);
        const a = SC_approxTransit(w, lw, n);
        return SC_solarTransitJ(a, M, L);
      }

      const SC_SUN_EVENTS = [
        [-0.833, 'sunrise', 'sunset'],
        [-6, 'dawn', 'dusk'],
        [-12, 'nauticalDawn', 'nauticalDusk'],
        [-18, 'nightEnd', 'night']
      ];

      function astroGetTimes(date, lat, lng, height) {
        height = height || 0;
        const lw = SC_rad * -lng;
        const phi = SC_rad * lat;
        const dh = SC_observerAngle(height);
        const d = SC_toDays(date);
        const n = SC_julianCycle(d, lw);
        const ds = SC_approxTransit(0, lw, n);
        const M = SC_solarMeanAnomaly(ds);
        const L = SC_eclipticLongitude(M);
        const dec = SC_declination(L, 0);
        const Jnoon = SC_solarTransitJ(ds, M, L);
        const result = { solarNoon: SC_fromJulian(Jnoon), nadir: SC_fromJulian(Jnoon - 0.5) };

      let sunInstCache = { key: '', data: null };

        const ref = refDate || new Date();

        const MIN = 60 * 1000;
        if (t < rise) return 'night';
        if (t < set - SUN_BAND.dayFadeBeforeSet * MIN) return 'day';
        if (t < dusk + SUN_BAND.civilAfterDusk * MIN) return 'sunset';
        if (t < nav + SUN_BAND.indigoAfterNautical * MIN) return 'indigo';
        return 'night';
      }

        const r = (int >> 16) & 255;
        const g = (int >> 8) & 255;
        const b = int & 255;
        return `${r},${g},${b}`;

      /* HIGHER-FIDELITY SCROLL-UP LYRICS CONTROLLER */
      function pushLyricText(newText) {
        const viewport = document.getElementById('lyricsViewport');
        if (!viewport) return;

        // Skip duplicates to prevent screen jitter
        if (viewport.dataset.currentText === newText) return;
        viewport.dataset.currentText = newText;

        const currentActive = viewport.querySelector('.lyric-line.active');
        if (currentActive) {
          currentActive.classList.remove('active');
          currentActive.classList.add('exit');
          setTimeout(() => currentActive.remove(), 420);
        }

        const newLine = document.createElement('div');
        newLine.className = 'lyric-line';
        newLine.textContent = newText;
        viewport.appendChild(newLine);

        // Force browser layout repaint
        newLine.offsetHeight;

        newLine.classList.add('active');

      function setupLyricsForMode(name) {
        const songMap = {

              if (curTime >= lyricsData[i].time) {

        }
      }

      function applyPalette(name) {
        const p = palettes[name];
        if (!p) return;
        const root = document.documentElement.style;
        root.setProperty('--bg', p.bg);
        root.setProperty('--bg2', p.bg2);
        root.setProperty('--text', p.text);
        root.setProperty('--text-dim', p.textDim);
        root.setProperty('--line', p.line);

          const el = document.documentElement;
          el.classList.add('palette-swap');
          window.clearTimeout(el.__paletteSwapTimer);
          el.__paletteSwapTimer = window.setTimeout(() => el.classList.remove('palette-swap'), 1400);
        } catch (e) { }

        if (window.__starfield && typeof window.__starfield.setSkyVars === 'function') {
          window.__starfield.setSkyVars({ starDensity: p.starDensity || 1, starRgb: rgb });
        } else {
          window.__sky = Object.assign(window.__sky || {}, { starDensity: p.starDensity || 1, starRgb: rgb });
        }

        updateSunFromClock();
      }

      function updateSunFromClock() {
        const root = document.documentElement.style;
        const sky = document.documentElement.getAttribute('data-sky');
        if (sky !== 'day' && sky !== 'sunset') {
          root.removeProperty('--sun-left');
          root.removeProperty('--sun-top');
          root.removeProperty('--sun-scale');
          return;
        }

        const now = new Date();
        const nowT = now.getTime();
        const st = getCachedSunInstants(now);
        const MIN = 60 * 1000;
        const rise = st.sunrise.getTime();
        const set = st.sunset.getTime();
        const dusk = st.dusk.getTime();

        if (sky === 'day') {
          const span = Math.max(1, set - rise);
          let t = (nowT - rise) / span;
          t = Math.max(0, Math.min(1, t));
          
          /* Sweep arch from left to right */
          const left = 8 + t * 78;
          const top = 55 - 43 * Math.sin(Math.PI * t); 
          const scale = 1.0 + 0.08 * Math.sin(Math.PI * t);

          root.setProperty('--sun-left', left.toFixed(2) + '%');
          root.setProperty('--sun-top', top.toFixed(2) + '%');
          root.setProperty('--sun-scale', scale.toFixed(3));
          return;
        }

        /* Sunset curve */
        const ss0 = set - SUN_BAND.dayFadeBeforeSet * MIN;
        const ss1 = dusk + SUN_BAND.civilAfterDusk * MIN;
        const span = Math.max(1, ss1 - ss0);
        let u = (nowT - ss0) / span;
        u = Math.max(0, Math.min(1, u));

        const left = 86 + u * 8;
        const top = 55 + u * 20;
        const scale = 1.05 - u * 0.22;

        root.setProperty('--sun-left', left.toFixed(2) + '%');
        root.setProperty('--sun-top', top.toFixed(2) + '%');
        root.setProperty('--sun-scale', scale.toFixed(3));
      }

      function choosePaletteByTime() {
        applyPalette(pickPaletteFromInstant(new Date()));
      }

      choosePaletteByTime();
      setInterval(choosePaletteByTime, 60 * 1000);

      window.applySkyPalette = applyPalette;
      window.updateSunFromClock = updateSunFromClock;
      window.getCachedSunInstants = getCachedSunInstants;
      window.pickPaletteFromInstant = pickPaletteFromInstant;
    })();
  </script>

        spotifyTimeCurrent.textContent = formatTime(current);

        if (now < spotifyEnd) {
          spotifyProgressTimer = requestAnimationFrame(updateSpotifyProgress);
        } else {
          spotifyProgressFill.style.width = '100%';
          spotifyTimeCurrent.textContent = formatTime(total);
        }
      }

      function fetchLanyard() {
        fetch(`https://api.lanyard.rest/v1/users/${discordId}`)
          .then(res => res.json())
          .then(res => {
            if (!res.success) return;
            const data = res.data;

            // Show card when data is loaded
            card.classList.add('visible');

            // 1. Update Profile Information
            const user = data.discord_user;
            username.textContent = user.global_name || user.username || 'MiloHakai';
            
            // Set Avatar
            if (user.avatar) {
              const ext = user.avatar.startsWith('a_') ? 'gif' : 'png';
              avatar.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=128`;
            } else {
              // Default Discord avatar formula
              const defaultIndex = user.discriminator === '0' 
                ? (BigInt(user.id) >> 22n) % 6n 
                : parseInt(user.discriminator) % 5;
              avatar.src = `https://cdn.discordapp.com/embed/avatars/${defaultIndex}.png`;
            }

            // 2. Update Status Dot & Text
            const status = data.discord_status;
            statusDot.className = 'lanyard-status-dot ' + status;
            
            let displayStatus = status;
            if (status === 'dnd') displayStatus = 'Do Not Disturb';
            else if (status === 'online') displayStatus = 'Online';
            else if (status === 'idle') displayStatus = 'Idle';
            else if (status === 'offline') displayStatus = 'Offline';
            statusText.textContent = displayStatus;

            // 3. Custom Status Message
            const customActivity = data.activities.find(act => act.type === 4);
            if (customActivity) {
              let text = '';
              if (customActivity.emoji) {
                if (customActivity.emoji.id) {
                  // Custom Discord emoji
                  text += `<img class="lanyard-custom-emoji" src="https://cdn.discordapp.com/emojis/${customActivity.emoji.id}.${customActivity.emoji.animated ? 'gif' : 'png'}?size=16" alt="${customActivity.emoji.name}" />`;
                } else {
                  // Standard unicode emoji
                  text += customActivity.emoji.name + ' ';
                }
              }
              text += customActivity.state || '';
              customStatus.innerHTML = text;
              customStatus.style.display = text ? 'block' : 'none';
            } else {
              customStatus.textContent = '';
              customStatus.style.display = 'none';
            }

            // 4. Update Spotify / Music Activity
            cancelAnimationFrame(spotifyProgressTimer);
            
            let music = null;
            let isSpotify = false;

            if (data.listening_to_spotify && data.spotify) {
              music = data.spotify;
              isSpotify = true;
            } else {
              // Fallback: look for a Listening activity (type 2) or an activity named "Spotify"
              const act = data.activities.find(a => a.type === 2 || a.name === 'Spotify');
              if (act) {
                music = {
                  song: act.details || act.name,
                  artist: act.state || 'Unknown Artist',
                  album: act.assets ? act.assets.large_text : '',
                  album_art_url: '',
                  timestamps: act.timestamps
                };
                
                if (act.assets && act.assets.large_image) {
                  const img = act.assets.large_image;
                  if (img.startsWith('spotify:')) {
                    music.album_art_url = `https://i.scdn.co/image/${img.substring(8)}`;
                    isSpotify = true;
                  } else if (img.startsWith('mp:')) {
                    music.album_art_url = img.replace('mp:', 'https://media.discordapp.net/');
                  } else if (act.application_id) {
                    music.album_art_url = `https://cdn.discordapp.com/app-assets/${act.application_id}/${img}.png`;
                  }
                }
                if (act.name === 'Spotify') {
                  isSpotify = true;
                }
              }
            }

            if (music) {
              spotifySection.style.display = 'flex';
              
              // Update title of the header if it's not Spotify
              const spotifyHeaderSpan = spotifySection.querySelector('.lanyard-spotify-header span');
              const spotifyHeaderIcon = spotifySection.querySelector('.lanyard-spotify-header i');
              if (isSpotify) {
                spotifyHeaderSpan.textContent = 'Listening to Spotify';
                spotifyHeaderIcon.className = 'fab fa-spotify';
                spotifyHeaderIcon.style.color = '#1db954';
              } else {
                spotifyHeaderSpan.textContent = 'Listening to Music';
                spotifyHeaderIcon.className = 'fas fa-music';
                spotifyHeaderIcon.style.color = 'var(--accent)';
              }

              spotifyTrack.textContent = music.song;
              spotifyArtist.textContent = music.artist;
              
              if (music.album_art_url) {
                spotifyAlbum.src = music.album_art_url;
                spotifyAlbum.style.display = 'block';
                spotifyAlbum.classList.add('playing');
              } else {
                spotifyAlbum.src = '';
                spotifyAlbum.style.display = 'none';
                spotifyAlbum.classList.remove('playing');
              }

              const progressContainer = card.querySelector('.lanyard-spotify-progress-container');
              if (music.timestamps && music.timestamps.start && music.timestamps.end) {
                spotifyTimeTotal.textContent = formatTime(music.timestamps.end - music.timestamps.start);
                spotifyStart = music.timestamps.start;
                spotifyEnd = music.timestamps.end;
                updateSpotifyProgress();
                if (progressContainer) progressContainer.style.display = 'flex';
              } else {
                if (progressContainer) progressContainer.style.display = 'none';
                spotifyStart = 0;
                spotifyEnd = 0;
              }
            } else {
              spotifySection.style.display = 'none';
              spotifyAlbum.classList.remove('playing');
              spotifyStart = 0;
              spotifyEnd = 0;
            }
          })
          .catch(err => {
            console.error('Lanyard API error:', err);
          });
      }

      // Initial Fetch & Poll every 15s
      fetchLanyard();
      setInterval(fetchLanyard, 15000);
    })();
  </script>
