<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SaiaMantaRay</title>
  <meta name="description" content="Visual artist and Musician">
  <!-- Open Graph / Social Media Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="SaiaMantaRay" />
  <meta property="og:description" content="Visual artist and Musician — SaiaMantaRay on OutOfTune." />
  <meta property="og:url" content="https://outoftune.dev/saiamantaray/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="SaiaMantaRay" />
  <meta name="twitter:description" content="Visual artist and Musician — SaiaMantaRay on OutOfTune." />
  <link rel="icon" type="image/png" sizes="32x32" href="./images/icon.png" />
  <link rel="shortcut icon" type="image/png" sizes="32x32" href="./images/icon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Press+Start+2P&family=Noto+Sans+JP:wght@400;700&family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400&family=VT323&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./styles/style.css" />
</head>


<body>
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="./images/background.mp4" type="video/mp4">
  </video>

  <div id="intro-screen" role="dialog" aria-label="Welcome to Bluerra">
    <div class="intro-content">
      <img src="./images/logo.png" alt="Bluerra-Sai intro logo" class="intro-logo">
    </div>
    <div class="intro-hint">click to continue</div>
  </div>

  <div class="page-shell">
    <div class="border-segments">
      <div class="border-top border-line-1"></div>
      <div class="border-right border-line-1"></div>
      <div class="border-bottom border-line-1"></div>
      <div class="border-left border-line-1"></div>
      <div class="border-top border-line-2"></div>
      <div class="border-right border-line-2"></div>
      <div class="border-bottom border-line-2"></div>
      <div class="border-left border-line-2"></div>
    </div>

    <div class="container">
      <div class="content-group">
        <div class="logo-wrapper">
          <img src="./images/logo.png" id="username" class="logo" onclick="handleNameClick()" alt="SaiaMantaRay Logo">
        </div>

        <p id="description">I changed name, wip</p>
        <p id="easter-egg-text" class="easter-egg-message" style="display: none;">boop</p>

        <div class="carousel-container">
          <button class="carousel-btn prev-btn" aria-label="Previous app" onclick="slideCarousel(-1)">
            <i class="fas fa-chevron-left"></i>
          </button>
          
          <div class="carousel-track-wrapper" id="carouselWrapper">
            <div class="carousel-track" id="iconsTrack">
              <a href="https://discord.gg/Fxb2czS6v4" class="carousel-item" target="_blank" title="Discord">
                <i class="fab fa-discord"></i>
                <span class="app-name">Discord</span>
              </a>
              <a href="https://open.spotify.com/artist/3WciAVM3DxjIWwV3aSugVa?si=S43FoBBCRRi9NMNqg-lYdA" class="carousel-item" target="_blank" title="Spotify">
                <i class="fab fa-spotify"></i>
                <span class="app-name">Spotify</span>
              </a>
              <a href="https://www.tiktok.com/@bluerra" class="carousel-item" target="_blank" title="TikTok">
                <i class="fab fa-tiktok"></i>
                <span class="app-name">TikTok</span>
              </a>
              <a href="https://twitch.tv/SaiaMantaray" class="carousel-item" target="_blank" title="Twitch">
                <i class="fab fa-twitch"></i>
                <span class="app-name">Twitch</span>
              </a>
              <a href="https://x.com/SaiaMantaray" class="carousel-item" target="_blank" title="X / Twitter">
                <i class="fab fa-x-twitter"></i>
                <span class="app-name">X / Twitter</span>
              </a>
              <a href="https://trello.com/b/g332ctkw/bluerrasai-projects" class="carousel-item" target="_blank" title="Trello">
                <i class="fab fa-trello"></i>
                <span class="app-name">Trello</span>
              </a>
              <a href="https://www.youtube.com/@SaiaMantaray" class="carousel-item" target="_blank" title="YouTube">
                <i class="fab fa-youtube"></i>
                <span class="app-name">YouTube</span>
              </a>
            </div>
          </div>

          <button class="carousel-btn next-btn" aria-label="Next app" onclick="slideCarousel(1)">
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </div>
    </div>

    <footer>
      OutOfTune - 2026<br>
      SaiaMantaRay
    </footer>

    <div class="now-playing">
      <div class="song-title">desert sand feels warm at night - 私は私です</div>
      <div class="song-subtitle">...</div>
    </div>
  </div>

  <audio id="backgroundAudio" preload="auto" loop>
    <source src="./audio/bgm.mp3" type="audio/mpeg">
  </audio>

  <audio id="clickSound" preload="auto">
    <source src="./audio/click-sound.mp3" type="audio/mpeg">
  </audio>

  <audio id="carouselForwardSound" preload="auto">
    <source src="./audio/carousel-forward.WAV" type="audio/wav">
  </audio>

  <audio id="carouselBackSound" preload="auto">
    <source src="./audio/carousel-back.WAV" type="audio/wav">
  </audio>

  <script src="./scripts/main.js"></script>
</body>

</html>
