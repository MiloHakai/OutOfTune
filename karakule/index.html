<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Karakule</title>
    <meta name="description" content="Your local kebab man! — Karakule on OutOfTune Grandma.">
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Karakule" />
    <meta property="og:description" content="Your local kebab man! — Karakule on OutOfTune." />
    <meta property="og:url" content="https://outoftune.dev/karakule/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Karakule" />
    <meta name="twitter:description" content="Your local kebab man! — Karakule on OutOfTune." />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0e1a;
            --bg-light: #d4e8ea;
            --text-dark: #00ffcc;
            --text-light: #1a4d5c;
            --border-color-dark: #00ffcc;
            --border-color-light: #33b8b8;
            --glow-color-dark: rgba(0, 255, 204, 0.8);
            --glow-color-light: rgba(51, 184, 184, 0.8);
            --accent-cyan: #00ffcc;
            --accent-orange: #ff6b35;
            --accent-pink: #ff0080;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-dark);
            transition: background 0.5s ease, color 0.5s ease;
            position: relative;
            background-image: url('./images/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        /* Background overlay for dimming */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 8, 15, 0.65);
            z-index: 0;
            transition: background 0.4s ease;
        }

        /* Alternative approach with individual border segments */
        .border-segments {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 1;
        }

        /* Border line animations */
        .border-top,
        .border-right,
        .border-bottom,
        .border-left {
            position: absolute;
        }

        /* Dark theme borders (default) */
        .border-top {
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg,
                    transparent 0%,
                    transparent 30%,
                    #00ffcc 40%,
                    #ff6b35 50%,
                    #00ffcc 60%,
                    transparent 70%,
                    transparent 100%);
            background-size: 300% 100%;
            animation: move-horizontal 12s linear infinite;
        }

        .border-right {
            top: 0;
            right: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg,
                    transparent 0%,
                    transparent 30%,
                    #00ffcc 40%,
                    #ff6b35 50%,
                    #00ffcc 60%,
                    transparent 70%,
                    transparent 100%);
            background-size: 100% 300%;
            animation: move-vertical 12s linear infinite;
        }

        .border-bottom {
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(-90deg,
                    transparent 0%,
                    transparent 30%,
                    #00ffcc 40%,
                    #ff6b35 50%,
                    #00ffcc 60%,
                    transparent 70%,
                    transparent 100%);
            background-size: 300% 100%;
            animation: move-horizontal-reverse 12s linear infinite;
        }

        .border-left {
            top: 0;
            left: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(-180deg,
                    transparent 0%,
                    transparent 30%,
                    #00ffcc 40%,
                    #ff6b35 50%,
                    #00ffcc 60%,
                    transparent 70%,
                    transparent 100%);
            background-size: 100% 300%;
            animation: move-vertical-reverse 12s linear infinite;
        }

        /* First line - no delays, continuous movement */
        .border-line-1.border-top { animation-delay: 0s; }
        .border-line-1.border-right { animation-delay: 3s; }
        .border-line-1.border-bottom { animation-delay: 6s; }
        .border-line-1.border-left { animation-delay: 9s; }

        /* Second line - offset by 6s (half cycle) */
        .border-line-2.border-top { animation-delay: 6s; }
        .border-line-2.border-right { animation-delay: 9s; }
        .border-line-2.border-bottom { animation-delay: 0s; }
        .border-line-2.border-left { animation-delay: 3s; }

        @keyframes move-horizontal { 0% { background-position: -100% 0; } 100% { background-position: 200% 0; } }
        @keyframes move-horizontal-reverse { 0% { background-position: 200% 0; } 100% { background-position: -100% 0; } }
        @keyframes move-vertical { 0% { background-position: 0 -100%; } 100% { background-position: 0 200%; } }
        @keyframes move-vertical-reverse { 0% { background-position: 0 200%; } 100% { background-position: 0 -100%; } }

        /* Left-aligned content container */
        .content-wrapper {
            position: relative;
            z-index: 3;
            width: 100%;
            padding-left: 40px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s ease;
            position: relative;
            display: inline-block;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            line-height: 1.2;
            margin: 0;
        }

        /* Wave effect setup */
        .wave-text {
            background: linear-gradient(90deg, #00ffcc 0%, #00d9ff 25%, #ff6b35 50%, #00d9ff 75%, #00ffcc 100%);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: wave-effect 6s linear infinite;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.7), 0 0 40px rgba(255, 107, 53, 0.5), 0 0 60px rgba(0, 217, 255, 0.3);
            filter: drop-shadow(0 0 12px rgba(0, 255, 204, 0.6));
        }

        @keyframes wave-effect { 0% { background-position: 200% 0; } 100% { background-position: -100% 0; } }
        h1:active { transform: scale(0.98); }

        p.subtitle {
            margin-top: 1.2rem;
            margin-bottom: 0;
            font-size: 0.7rem;
            font-family: 'Press Start 2P', monospace;
            font-weight: 400;
            opacity: 0.9;
            animation: subtle-pulse 12s ease-in-out infinite;
            letter-spacing: 0.05em;
            line-height: 1.4;
        }

        @keyframes subtle-pulse { 0%, 100% { opacity: 0.9; } 50% { opacity: 1; } }

        /* FIXED: Added breathing room and comfort spacing */
        .icons {
            margin-top: 1.6rem; 
            display: flex;
            gap: 22px; 
        }

        /* FIXED: Increased icon size and visual visibility */
        .icons a {
            font-size: 1.7rem; 
            color: inherit;
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .icons a:hover { color: #ffffff; transform: scale(1.15); filter: drop-shadow(0 0 8px rgba(0, 255, 204, 0.8)); }

        .click-counter {
            margin-top: 1.5rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }
        .click-counter.show { opacity: 1; transform: translateY(0); }
        .click-counter p {
            font-size: 0.6rem;
            color: #00ffcc;
            margin: 0;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
        }

        /* Bottom Left - Song Display */
        .song-info {
            position: fixed;
            left: 40px;
            bottom: 40px;
            z-index: 100;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.5rem;
            color: var(--text-dark);
            letter-spacing: 0.04em;
        }
        .song-info i { margin-right: 8px; color: #00ffcc; }

        /* Stacked bottom-right footer system */
        .footer-right {
            position: fixed;
            right: 40px;
            bottom: 40px;
            z-index: 100;
            font-family: 'Press Start 2P', monospace;
            color: #7a9aa8;
            font-size: 0.42rem;
            line-height: 1.7;
            letter-spacing: 0.5px;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .footer-right .footer-copy { opacity: 0.6; }
        .footer-right .footer-author { opacity: 0.85; color: #00ffcc; }

        @media (max-width: 768px) {
            body { align-items: center; justify-content: center; }
            .content-wrapper { padding-left: 0; align-items: center; text-align: center; }
            h1 { font-size: 1.5rem; }
            .subtitle { font-size: 0.6rem; }
            .icons { justify-content: center; gap: 20px; margin-top: 1.4rem; }
            .icons a { font-size: 1.5rem; }
            
            .song-info { position: fixed; left: 24px; bottom: 24px; font-size: 0.4rem; }
            .footer-right { position: fixed; right: 24px; bottom: 24px; font-size: 0.35rem; }
        }
    </style>
</head>

<body>

    <div class="border-segments">
        <div class="border-top border-line-1"></div>
        <div class="border-right border-line-1"></div>
        <div class="border-bottom border-line-1"></div>
        <div class="border-left border-line-1"></div>
        <div class="border-top border-line-2"></div>
        <div class="border-right border-line-2"></div>
        <div class="border-bottom border-line-2"></div>
        <div class="border-left border-line-2"></div>
    </div>

    <main class="content-wrapper">
        <h1 id="username" class="wave-text" onclick="playClickSound()">Karakule</h1>
        <p class="subtitle">Your local kebab man!</p>

        <div class="icons">
            <a href="https://discord.gg/users/734621438610243608" title="Discord" target="_blank"><i class="fab fa-discord"></i></a>
            <a href="https://www.youtube.com/channel/UCwhvGaTQhEuWTCzzpSnslIg" title="YouTube" target="_blank"><i class="fab fa-youtube"></i></a>
            <a href="https://www.twitch.tv/karathekule" title="Twitch" target="_blank"><i class="fab fa-twitch"></i></a>
        </div>

        <div id="clickCounter" class="click-counter" style="display: none;">
            <p>Hey! You clicked me <span id="clickCount">0</span> times.</p>
        </div>
    </main>

    <div class="song-info">
        <i class="fas fa-music"></i> Melancholy - NyxTheShield
    </div>

    <div class="footer-right">
        <div class="footer-copy">© 2026 - OutOfTune</div>
        <div class="footer-author">Karakule</div>
    </div>

    <audio id="backgroundAudio" preload="auto" loop>
        <source src="./bgm.flac" type="audio/flac">
        <source src="./audio/bgm.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <audio id="clickSound" preload="auto">
        <source src="./click-sound.mp3" type="audio/mpeg">
        <source src="./click-sound.ogg" type="audio/ogg">
        Your browser does not support the audio element.
    </audio>

    <script>
        // Click counter functionality
        let clickCount = 0;
        const clickCounter = document.getElementById('clickCounter');
        const clickCountSpan = document.getElementById('clickCount');

        // Function to play click sound and update counter
        function playClickSound() {
            const clickSound = document.getElementById('clickSound');
            clickSound.currentTime = 0; 
            clickSound.play().catch(error => {
                console.log('Click sound could not be played:', error);
            });

            // Update click counter
            clickCount++;
            clickCountSpan.textContent = clickCount;

            // Show the counter after first click
            if (clickCount === 1) {
                clickCounter.style.display = 'block';
                setTimeout(() => {
                    clickCounter.classList.add('show');
                }, 10);
            }
        }

        // Audio functionality for background music
        const audio = document.getElementById('backgroundAudio');

        // Function to start background audio
        function startBackgroundAudio() {
            audio.play().catch(error => {
                console.log('Audio autoplay prevented:', error);
                document.addEventListener('click', function () {
                    if (audio.paused) {
                        audio.play().catch(err => console.log('Audio play failed:', err));
                    }
                }, {
                    once: true
                });
            });
        }

        // Set audio volumes
        audio.volume = 0.25; 
        const clickSound = document.getElementById('clickSound');
        clickSound.volume = 0.3; 

        // Start background music when page loads
        window.addEventListener('load', () => {
            startBackgroundAudio();
        });

        // Fallback: start audio on first user interaction
        document.addEventListener('click', function () {
            if (audio.paused) {
                startBackgroundAudio();
            }
        }, {
            once: true
        });
    </script>
</body>

</html>
