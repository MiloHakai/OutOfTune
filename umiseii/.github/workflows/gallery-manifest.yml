name: Update gallery manifest

on:
  push:
    branches: ["main", "master"]
    paths:
      - "assets/images/**"
      - "scripts/generate-gallery.mjs"
      - ".github/workflows/gallery-manifest.yml"

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate gallery manifest
        run: node scripts/generate-gallery.mjs

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery/images.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update gallery manifest"
          git push
