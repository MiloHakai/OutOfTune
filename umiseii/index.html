<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Umiseii</title>
  <meta name="description" content="Vartist - Designer - Vsinger">
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Umiseii" />
  <meta property="og:description" content="Vartist - Designer - Vsinger" />
  <meta property="og:url" content="https://outoftune.dev/umiseii/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Umiseii" />
  <meta name="twitter:description" content="Vartist - Designer - Vsinger" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css">

  <style>
    :root {
      --sky: #81d4fa;
      --sky2: #e3f2fd;
      --white: #ffffff;
      --fg: #ffffff;
      --muted: rgba(255, 255, 255, 0.8);
      --pop: #f3c2ff;
      --pop2: #b5e2ff;
      --toggle-color: #1a3a52;
      --toggle-background: rgba(232, 244, 248, 0.24);
      --toggle-border: rgba(26, 58, 82, 0.35);
      --toggle-glow: rgba(74, 123, 167, 0.22);
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
    }

    body {
      position: relative;
      color: var(--fg);
      background: #758ba5;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    body::before {
      background:
        linear-gradient(rgba(20, 14, 35, 0.35), rgba(20, 14, 35, 0.35)),
        url('./assets/images/background-night.png') no-repeat center center / cover fixed;
      opacity: 0;
    }

    body::after {
      background:
        linear-gradient(rgba(20, 14, 35, 0.35), rgba(20, 14, 35, 0.35)),
        url('./assets/images/background.png') no-repeat center center / cover fixed;
      opacity: 1;
    }

    body::before,
    body::after {
      z-index: 0;
    }

    body.night-theme::before {
      opacity: 1;
    }

    body.night-theme::after {
      opacity: 0;
    }

    body > * {
      position: relative;
      z-index: 1;
    }

    body {
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    body.page-ready {
      opacity: 1;
    }

    .theme-toggle {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 60;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 55px;
      height: 55px;
      padding: 14px;
      color: var(--toggle-color);
      background: var(--toggle-background);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid var(--toggle-border);
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px var(--toggle-glow);
    }

    body.gallery-open .theme-toggle {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(0.9);
    }

    .theme-toggle:hover {
      color: var(--toggle-color);
      background: var(--toggle-background);
      border-color: var(--toggle-color);
      transform: scale(1.1) rotate(15deg);
      box-shadow: 0 12px 40px var(--toggle-glow),
        0 0 30px var(--toggle-glow);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--pop2);
      outline-offset: 3px;
    }

    .theme-icon {
      font-size: 1.3rem;
      transition: all 0.3s ease;
    }

    .sun-icon {
      display: none;
    }

    .moon-icon {
      display: block;
      filter: drop-shadow(0 0 8px var(--toggle-glow));
    }

    body.night-theme .sun-icon {
      display: block;
    }

    body.night-theme .moon-icon {
      display: none;
    }

    body.night-theme {
      --toggle-color: #b8d4e8;
      --toggle-background: rgba(26, 58, 82, 0.22);
      --toggle-border: rgba(184, 212, 232, 0.38);
      --toggle-glow: rgba(74, 123, 167, 0.3);
    }


    .splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a1628 0%, #1a3a52 52%, #1e4a66 100%);
      cursor: pointer;
      transition:
        opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1),
        visibility 0s linear 0.6s;
    }

    body:not(.night-theme) .splash {
      background: linear-gradient(135deg, #e8f4f8 0%, #b8d4e8 52%, #6b8caf 100%);
    }

    .splash.gone {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
      user-select: none;
    }

    .splash-name {
      font-size: clamp(1.1rem, 2.8vw, 1.6rem);
      color: var(--fg);
      text-shadow: 0 2px 8px rgba(20, 14, 35, 0.95);
      opacity: 0;
      transform: translateY(25px);
      animation: slideUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
    }

    .splash-hint {
      font-size: clamp(0.45rem, 1.2vw, 0.52rem);
      color: var(--pop2);
      text-shadow: 0 1px 5px rgba(20, 14, 35, 0.95);
      opacity: 0;
      letter-spacing: 1px;
      animation: fadeIn 0.8s ease forwards 0.9s;
    }

    body:not(.night-theme) .splash-name {
      color: #1a3a52;
      text-shadow: 0 2px 8px rgba(232, 244, 248, 0.8);
    }

    body:not(.night-theme) .splash-hint {
      color: #1a3a52;
      text-shadow: 0 1px 5px rgba(232, 244, 248, 0.8);
    }

    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      to { opacity: 0.75; }
    }

    .edges {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .edge-t,
    .edge-r,
    .edge-b,
    .edge-l {
      position: absolute;
      background: rgba(0, 170, 255, 0.18);
    }

    .edge-t { top: 0; left: 0; right: 0; height: 3px; }
    .edge-r { top: 0; right: 0; bottom: 0; width: 3px; }
    .edge-b { bottom: 0; left: 0; right: 0; height: 3px; }
    .edge-l { top: 0; left: 0; bottom: 0; width: 3px; }

    .edge-t::after,
    .edge-r::after,
    .edge-b::after,
    .edge-l::after {
      content: '';
      position: absolute;
      opacity: 0;
    }

    .edge-t::after,
    .edge-b::after {
      top: -1px;
      bottom: -1px;
      width: 15vw;
    }

    .edge-t::after {
      left: 0;
      background: linear-gradient(90deg, transparent, var(--pop2), #fff, var(--pop2), transparent);
      animation: goRight 12s linear infinite;
    }

    .edge-b::after {
      right: 0;
      background: linear-gradient(270deg, transparent, var(--pop2), #fff, var(--pop2), transparent);
      animation: goLeft 12s linear infinite;
    }

    .edge-r::after,
    .edge-l::after {
      left: -1px;
      right: -1px;
      height: 15vh;
    }

    .edge-r::after {
      top: 0;
      background: linear-gradient(180deg, transparent, var(--pop2), #fff, var(--pop2), transparent);
      animation: goDown 12s linear infinite;
    }

    .edge-l::after {
      bottom: 0;
      background: linear-gradient(0deg, transparent, var(--pop2), #fff, var(--pop2), transparent);
      animation: goUp 12s linear infinite;
    }

    .line-1.edge-t::after { animation-delay: 0s; }
    .line-1.edge-r::after { animation-delay: 3s; }
    .line-1.edge-b::after { animation-delay: 6s; }
    .line-1.edge-l::after { animation-delay: 9s; }
    .line-2.edge-t::after { animation-delay: 6s; }
    .line-2.edge-r::after { animation-delay: 9s; }
    .line-2.edge-b::after { animation-delay: 0s; }
    .line-2.edge-l::after { animation-delay: 3s; }

    @keyframes goRight {
      0% { transform: translateX(-15vw); opacity: 1; }
      25% { transform: translateX(100vw); opacity: 1; }
      25.01%, 100% { transform: translateX(100vw); opacity: 0; }
    }

    @keyframes goDown {
      0% { transform: translateY(-15vh); opacity: 1; }
      25% { transform: translateY(100vh); opacity: 1; }
      25.01%, 100% { transform: translateY(100vh); opacity: 0; }
    }

    @keyframes goLeft {
      0% { transform: translateX(15vw); opacity: 1; }
      25% { transform: translateX(-100vw); opacity: 1; }
      25.01%, 100% { transform: translateX(-100vw); opacity: 0; }
    }

    @keyframes goUp {
      0% { transform: translateY(15vh); opacity: 1; }
      25% { transform: translateY(-100vh); opacity: 1; }
      25.01%, 100% { transform: translateY(-100vh); opacity: 0; }
    }

    main {
      position: relative;
      z-index: 2;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.25rem, 3.6vw, 1.8rem);
      letter-spacing: 0.12em;
      color: var(--fg);
      cursor: pointer;
      user-select: none;
      text-shadow: 0 2px 6px rgba(20, 14, 35, 0.95), 0 0 3px rgba(0, 0, 0, 0.9);
    }

    h1:hover {
      color: var(--pop);
    }

    p {
      margin: 0;
      font-size: 0.82rem;
      line-height: 1.7;
      color: var(--fg);
      text-shadow: 0 1px 4px rgba(20, 14, 35, 0.95), 0 0 2px rgba(0, 0, 0, 0.9);
    }

    #boop {
      color: var(--pop);
      text-shadow: 0 1px 4px rgba(20, 14, 35, 0.95), 0 0 2px rgba(0, 0, 0, 0.9);
    }

    .meow-bounce {
      animation: meowPulse 0.3s ease-out;
    }

    @keyframes meowPulse {
      0% { transform: translateY(0); }
      50% { transform: translateY(-2px); color: var(--pop); }
      100% { transform: translateY(0); }
    }

    .floating-meow {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      color: var(--pop);
      text-shadow: 0 1px 4px rgba(20, 14, 35, 0.95), 0 0 2px rgba(0, 0, 0, 0.9);
      transform: translate(-50%, -50%);
      animation: meowFloat 0.7s ease-out forwards;
      user-select: none;
    }

    @keyframes meowFloat {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(0);
      }
      25% {
        opacity: 0.95;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(-25px);
      }
    }

    footer {
      position: fixed;
      bottom: 20px;
      right: 25px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.2rem;
      font-size: 0.5rem;
      color: var(--muted);
      line-height: 1.45;
      letter-spacing: 0.06em;
      text-align: right;
      text-shadow: 0 1px 4px rgba(20, 14, 35, 0.95), 0 0 2px rgba(0, 0, 0, 0.9);
      pointer-events: auto;
    }

    footer span {
      display: block;
    }

    footer a {
      color: var(--pop2);
      text-decoration: none;
      transition: color 0.18s ease;
    }

    footer a:hover,
    footer a:focus-visible {
      color: var(--pop);
    }

    .track {
      position: fixed;
      bottom: 25px;
      left: 25px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .track-name {
      font-size: 0.48rem;
      line-height: 1.4;
      color: var(--fg);
      letter-spacing: 0.08em;
      text-shadow: 0 1px 4px rgba(20, 14, 35, 0.95), 0 0 2px rgba(0, 0, 0, 0.9);
    }


    .track-icon {
      margin-right: 0.35rem;
      color: var(--pop2);
      font-size: 0.52rem;
      vertical-align: -0.03em;
    }

    .track-sub {
      font-size: 0.42rem;
      line-height: 1.3;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-shadow: 0 1px 4px rgba(20, 14, 35, 0.95), 0 0 2px rgba(0, 0, 0, 0.9);
    }






    #name {
      background: linear-gradient(
        90deg,
        var(--fg) 0%,
        var(--fg) 34%,
        var(--pop2) 46%,
        var(--pop) 50%,
        var(--pop2) 54%,
        var(--fg) 66%,
        var(--fg) 100%
      );
      background-size: 420% 100%;
      background-position: 100% 50%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: name-gradient-wave 3.2s linear infinite;
      text-shadow: none;
      filter: drop-shadow(0 1px 4px rgba(20, 14, 35, 0.75));
    }

    @keyframes name-gradient-wave {
      0% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #name {
        animation: none;
        background-position: 50% 50%;
      }
    }

    .socials {
      display: flex;
      align-items: center;
      gap: 1.15rem;
      margin-top: 0.15rem;
      padding-bottom: 0.7rem;
    }

    .socials a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.25rem;
      height: 1.25rem;
      color: var(--pop2);
      text-decoration: none;
      font-size: 1.12rem;
      text-shadow: 0 1px 3px rgba(20, 14, 35, 0.75);
      transition: transform 0.18s ease, color 0.18s ease, filter 0.18s ease;
    }

    .socials a:hover {
      color: var(--pop);
      transform: translateY(-2px);
      filter: brightness(1.12);
    }

    .socials a:focus-visible {
      outline: 2px solid var(--pop2);
      outline-offset: 4px;
    }

    .socials .fa-link {
      font-size: 0.9rem;
    }

    .socials .site-nav {
      color: var(--pop2);
    }

    .socials .gallery-nav {
      margin-left: 0.1rem;
    }



    /* ============================================================
       IN-SITE GALLERY
       The gallery is a view inside this page, so the audio element
       never gets destroyed when navigating between Home and Gallery.
       ============================================================ */

    .gallery-view {
      position: fixed;
      inset: 0;
      z-index: 20;
      overflow-y: auto;
      padding: 0 1.25rem 4rem;
      background: rgba(12, 10, 18, 0.92);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(8px);
      transition:
        opacity 0.32s ease,
        transform 0.32s ease,
        visibility 0s linear 0.32s;
    }

    .gallery-view::before {
      z-index: 0;
    }

    .gallery-view::after {
      z-index: 0;
    }

    .gallery-view.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
      transition:
        opacity 0.32s ease,
        transform 0.32s ease;
    }

    .gallery-shell {
      position: relative;
      z-index: 1;
      width: min(1400px, 100%);
      margin: 0 auto;
    }

    .gallery-top {
      position: sticky;
      top: 0;
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0.85rem 1rem;
      margin: 0 -1.25rem;
      background: transparent;
      pointer-events: none;
    }

    .gallery-back {
      pointer-events: auto;
    }

    .gallery-back {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.42rem 0.85rem 0.42rem 0.65rem;
      color: var(--pop2);
      font-size: 0.52rem;
      letter-spacing: 0.06em;
      text-decoration: none;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 4px 14px rgba(10, 8, 20, 0.3);
      cursor: pointer;
      transition: color 0.18s ease, background 0.18s ease, transform 0.18s ease, border-color 0.18s ease;
      user-select: none;
    }

    .gallery-back:hover {
      color: var(--pop);
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.24);
      transform: translateX(-2px);
    }

    .gallery-back:active {
      transform: translateX(-3px) scale(0.97);
    }

    .gallery-back .back-arrow {
      font-size: 0.7rem;
      line-height: 1;
    }

    .gallery-title {
      display: none;
      margin: 0;
      user-select: none;
      pointer-events: none;
    }

    .gallery-grid {
      column-count: 5;
      column-gap: 1rem;
      padding-bottom: 2rem;
    }

    @media (max-width: 1200px) {
      .gallery-grid { column-count: 4; }
    }

    @media (max-width: 920px) {
      .gallery-grid { column-count: 3; }
    }

    @media (max-width: 700px) {
      .gallery-grid { column-count: 2; }
      .gallery-shell { width: min(100%, calc(100vw - 1rem)); }
    }

    @media (max-width: 480px) {
      .gallery-grid { column-count: 1; }
      .gallery-view { padding-left: 0.65rem; padding-right: 0.65rem; }
      .gallery-top { margin: 0 -0.65rem; }
    }

    .gallery-piece {
      position: relative;
      display: inline-block;
      width: 100%;
      margin: 0 0 1rem;
      cursor: pointer;
      border-radius: 14px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.6s ease, transform 0.6s ease, box-shadow 0.3s ease;
      box-shadow: 0 10px 28px rgba(10, 8, 20, 0.28);
      background: linear-gradient(110deg, rgba(255, 255, 255, 0.035) 8%, rgba(255, 255, 255, 0.09) 18%, rgba(255, 255, 255, 0.035) 33%);
      background-size: 200% 100%;
      animation: gallery-shimmer 1.6s linear infinite;
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
    }

    .gallery-piece.loaded {
      animation: none;
      background: rgba(255, 255, 255, 0.04);
    }

    .gallery-piece.in-view {
      opacity: 1;
      transform: translateY(0);
    }

    .gallery-piece:hover,
    .gallery-piece:focus-within {
      box-shadow: 0 16px 34px rgba(10, 8, 20, 0.48);
    }

    @keyframes gallery-shimmer {
      to { background-position-x: -200%; }
    }

    .gallery-piece img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.45s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.5s ease;
      filter: saturate(0.96);
    }

    .gallery-piece img.loaded {
      opacity: 1;
    }

    .gallery-piece:hover img,
    .gallery-piece:focus-within img {
      transform: scale(1.06);
      filter: saturate(1.05);
    }

    .gallery-piece figcaption {
      position: absolute;
      inset: auto 0 0 0;
      margin: 0;
      padding: 1.8rem 0.7rem 0.6rem;
      color: var(--fg);
      font-size: 0.44rem;
      line-height: 1.6;
      background: linear-gradient(to top, rgba(10, 8, 20, 0.85), rgba(10, 8, 20, 0));
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .gallery-piece:hover figcaption,
    .gallery-piece:focus-within figcaption {
      opacity: 1;
      transform: translateY(0);
    }

    .gallery-empty {
      margin: 3rem 0;
      color: var(--muted);
      text-align: center;
      font-size: 0.55rem;
      line-height: 1.8;
    }

    body.viewer-open {
      overflow: hidden;
    }

    body.gallery-open #home-view,
    body.gallery-open footer,
    body.gallery-open .track,
    body.gallery-open .music-resume,
    body.gallery-open .edges {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .gallery-view.viewer-open {
      overflow: hidden;
    }

    .gallery-viewer {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      box-sizing: border-box;
      z-index: 9999 !important;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 2rem;
      margin: 0;
      background: rgba(20, 14, 35, 0.88);

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      overflow: hidden;
      overscroll-behavior: none;

      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .gallery-viewer.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .gallery-viewer img {
      display: block;
      max-width: 94vw;
      max-height: 90dvh;
      width: auto;
      height: auto;
      object-fit: contain;

      cursor: zoom-in;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: none;

      transform: scale(1);
      transform-origin: center center;
      transition: transform 0.12s ease-out, opacity 0.18s ease;
      will-change: transform, opacity;

      box-shadow: 0 8px 35px rgba(20, 14, 35, 0.55);
    }

    .gallery-viewer img.zoomed {
      cursor: grab;
    }

    .gallery-viewer img.zoomed:active {
      cursor: grabbing;
    }

    .gallery-viewer-close {
      position: absolute;
      top: 1.25rem;
      right: 1.5rem;
      z-index: 2;

      color: var(--pop2);
      background: none;
      border: 0;
      padding: 0.5rem;
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      transition: color 0.18s ease, transform 0.18s ease;
    }

    .gallery-viewer-close:hover {
      color: var(--pop);
      transform: scale(1.08);
    }

    .gallery-viewer-nav {

  <audio id="bgm" preload="auto" loop>

  <script>
    let meowResetTimer = null;

    function onNameClick(event) {
      playClick();

      const bio = document.getElementById('bio');
      const boop = document.getElementById('boop');
      const nameEl = document.getElementById('name');

      if (bio && boop) {
        bio.hidden = true;
        boop.hidden = false;
        boop.textContent = 'meow!';
      }

      if (nameEl) {
        nameEl.classList.remove('meow-bounce');
        void nameEl.offsetWidth; // trigger reflow for animation restart
        nameEl.classList.add('meow-bounce');
      }

      spawnFloatingMeow(event);

      if (meowResetTimer) {
        clearTimeout(meowResetTimer);
      }

      meowResetTimer = setTimeout(() => {
        if (bio && boop) {
          bio.hidden = false;
          boop.hidden = true;
        }
      }, 2500);
    }

    function spawnFloatingMeow(event) {
      const particle = document.createElement('div');
      particle.className = 'floating-meow';

      const variations = ['meow', 'meow~', 'meow!'];
      particle.textContent = variations[Math.floor(Math.random() * variations.length)];

      let x = event && typeof event.clientX === 'number' ? event.clientX : window.innerWidth / 2;
      let y = event && typeof event.clientY === 'number' ? event.clientY : window.innerHeight / 2;

      // Slight subtle offset
      x += (Math.random() - 0.5) * 20;
      y += (Math.random() - 0.5) * 10;

      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;

      document.body.appendChild(particle);

      particle.addEventListener('animationend', () => {
        particle.remove();
      });
    }

    function playClick() {
      const sfx = document.getElementById('click');
      if (!sfx) return;
      sfx.currentTime = 0;
      sfx.play().catch(() => {});
    }

    const bgm = document.getElementById('bgm');
    const musicResume = document.getElementById('music-resume');
    const MUSIC_TIME_KEY = 'umiseii-music-time';
    const MUSIC_PLAYING_KEY = 'umiseii-music-playing';
    const themeToggle = document.getElementById('theme-toggle');
    let isNight = new Date().getHours() >= 18;

    function setNightTheme(night) {
      document.body.classList.toggle('night-theme', night);
      themeToggle?.setAttribute('aria-label', night ? 'Switch to daytime background' : 'Switch to nighttime background');
      themeToggle?.setAttribute('title', night ? 'Switch to daytime background' : 'Switch to nighttime background');
    }

    setNightTheme(isNight);
    themeToggle?.addEventListener('click', () => {
      isNight = !isNight;
      setNightTheme(isNight);
    });

    if (bgm) {
      bgm.volume = 0.18;

      try {
        const savedTime = Number(sessionStorage.getItem(MUSIC_TIME_KEY));
        if (Number.isFinite(savedTime) && savedTime >= 0) {
          bgm.currentTime = savedTime;
        }
      } catch (_) {}

      bgm.addEventListener('timeupdate', () => {
        try {
          sessionStorage.setItem(MUSIC_TIME_KEY, String(bgm.currentTime));
          sessionStorage.setItem(MUSIC_PLAYING_KEY, bgm.paused ? '0' : '1');
        } catch (_) {}
      });

      bgm.addEventListener('play', () => {
        try {
          sessionStorage.setItem(MUSIC_PLAYING_KEY, '1');
        } catch (_) {}
        musicResume?.classList.remove('show');
      });

      bgm.addEventListener('pause', () => {
        try {
          sessionStorage.setItem(MUSIC_PLAYING_KEY, '0');
        } catch (_) {}
      });

      window.addEventListener('pagehide', () => {
        try {
          sessionStorage.setItem(MUSIC_TIME_KEY, String(bgm.currentTime));
          sessionStorage.setItem(MUSIC_PLAYING_KEY, bgm.paused ? '0' : '1');
        } catch (_) {}
      });
    }

    function tryStartMusic() {
      if (!bgm) return;

      bgm.play().then(() => {
        musicResume?.classList.remove('show');
      }).catch(() => {
        musicResume?.classList.add('show');
      });
    }

    musicResume?.addEventListener('click', () => {
      tryStartMusic();
    });

    const click = document.getElementById('click');
    if (click) click.volume = 0.3;

    const splash = document.getElementById('splash');
    const RETURNING_FROM_SITE_KEY = 'umiseii-returning-from-site';

    // Reveal the page after it has loaded so internal navigation never
    // flashes an opaque homepage before its fade-in starts.
    requestAnimationFrame(() => {
      document.body.classList.add('page-ready');
    });

    // Only skip the intro when we explicitly came back from another page
    // on the site. A normal refresh will show the intro again.
    let returningFromSite = false;

    try {
      returningFromSite =
        sessionStorage.getItem(RETURNING_FROM_SITE_KEY) === '1';

      if (returningFromSite) {
        sessionStorage.removeItem(RETURNING_FROM_SITE_KEY);
      }
    } catch (_) {}

    if (returningFromSite) {
      splash?.classList.add('gone');
    }

    if (window.location.hash === '#gallery') {
      splash?.classList.add('gone');
    }

    splash?.addEventListener('click', () => {
      splash.classList.add('gone');
      tryStartMusic();
    });
  </script>

  <button class="music-resume" id="music-resume" type="button" aria-label="Resume music">

    <img id="gallery-viewer-image" src="" alt="">
    <div class="gallery-viewer-caption" id="gallery-viewer-caption">
      <span id="gallery-viewer-caption-text"></span>
      <span class="gallery-viewer-count" id="gallery-viewer-count"></span>
    </div>
  </div>

  <script>
    const galleryView = document.getElementById('gallery-view');
      const galleryLink = document.getElementById('gallery-link');
      const galleryBack = document.getElementById('gallery-back');
      const galleryGrid = document.getElementById('gallery-grid');
      const galleryEmpty = document.getElementById('gallery-empty');
      const galleryViewer = document.getElementById('gallery-viewer');
      const galleryViewerImage = document.getElementById('gallery-viewer-image');
      const galleryViewerClose = document.getElementById('gallery-viewer-close');
      const galleryViewerPrev = document.getElementById('gallery-viewer-prev');
      const galleryViewerNext = document.getElementById('gallery-viewer-next');
      const galleryViewerCaptionText = document.getElementById('gallery-viewer-caption-text');
      const galleryViewerCount = document.getElementById('gallery-viewer-count');

      let galleryLoaded = false;
      let galleryItems = [];
      let currentGalleryIndex = -1;

      function debounce(fn, wait) {
        let timer = null;
        return (...args) => {
          clearTimeout(timer);
          timer = setTimeout(() => fn(...args), wait);
        };
      }

      const galleryRevealObserver = 'IntersectionObserver' in window
        ? new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add('in-view');
                galleryRevealObserver.unobserve(entry.target);
              }
            });
          }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' })
        : null;

      function layoutGalleryItem(figure) {
        if (!figure) return;

        const image = figure.querySelector('img');
        if (!image) return;

        image.style.height = 'auto';
        image.style.width = '100%';
        figure.style.gridRowEnd = 'auto';
      }

      function layoutGallery() {
        if (!galleryGrid) return;
        galleryGrid.querySelectorAll('.gallery-piece').forEach(layoutGalleryItem);
      }

      window.addEventListener('resize', debounce(layoutGallery, 150));

      function setGalleryOpen(open, pushHistory = true) {
        if (!galleryView) return;

        galleryView.classList.toggle('open', open);
        galleryView.setAttribute('aria-hidden', open ? 'false' : 'true');
        document.body.classList.toggle('gallery-open', open);
        document.body.style.overflow = open ? 'hidden' : '';

        if (pushHistory) {
          if (open) {
            history.pushState({ gallery: true }, '', '#gallery');
          } else {
            history.pushState({ gallery: false }, '', window.location.pathname + window.location.search);
          }
        }

        if (open) {
          loadGallery();
          requestAnimationFrame(layoutGallery);
        }
      }

      function closeGalleryFromUi() {
        setGalleryOpen(false, false);
        closeGalleryViewer();
        document.body.classList.remove('gallery-open');
        if (window.location.hash === '#gallery') {
          history.replaceState({ gallery: false }, '', window.location.pathname + window.location.search);
        }
      }

      async function getGalleryFiles() {
        const extensions = /\.(png|jpe?g|webp|gif|avif)$/i;
        const manifestResponse = await fetch('./gallery/images.json', { cache: 'no-store' });

        if (!manifestResponse.ok) {
          throw new Error(`Gallery manifest returned ${manifestResponse.status}`);
        }

        const data = await manifestResponse.json();
        if (!Array.isArray(data)) {
          throw new Error('Gallery manifest is not an array');
        }

        return data
          .filter((name) => extensions.test(name))
          .filter((name) => !['background.png', 'background-night.png'].includes(name.toLowerCase()));
      }

      async function loadGallery() {
        if (galleryLoaded) return;

        try {
          const files = await getGalleryFiles();

          if (!files.length) {
            if (galleryEmpty) galleryEmpty.textContent = 'Gallery coming soon.';
            galleryLoaded = true;
            return;
          }

          if (galleryEmpty) galleryEmpty.remove();

          const sortedNames = files.slice().sort((a, b) => a.localeCompare(b));

          galleryItems = sortedNames.map((name) => ({
            name,
            src: `./assets/images/${encodeURIComponent(name)}`,
            alt: name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ')
          }));

          galleryItems.forEach((item, index) => {
            const figure = document.createElement('figure');
            figure.className = 'gallery-piece';
            figure.tabIndex = 0;
            figure.setAttribute('role', 'button');
            figure.setAttribute('aria-label', `Open ${item.alt}`);

            const image = document.createElement('img');
            image.alt = item.alt;
            image.loading = 'lazy';
            image.decoding = 'async';

            const caption = document.createElement('figcaption');
            caption.textContent = item.alt;

            figure.append(image, caption);
            if (galleryGrid) galleryGrid.appendChild(figure);

            const markLoaded = () => {
              image.classList.add('loaded');
              figure.classList.add('loaded');
              requestAnimationFrame(() => {
                layoutGalleryItem(figure);
                galleryRevealObserver?.observe(figure);
              });
            };

            if (image.complete && image.naturalWidth) {
              markLoaded();
            } else {
              image.addEventListener('load', markLoaded, { once: true });
              image.addEventListener('error', () => {
                figure.classList.add('loaded');
                figure.style.display = 'none';
              }, { once: true });
            }

            image.src = item.src;

            const open = () => openGalleryViewer(index);
            figure.addEventListener('click', open);
            figure.addEventListener('keydown', (event) => {
              if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                open();
              }
            });
          });

          galleryLoaded = true;
        } catch (error) {
          console.error('[Umiseii Gallery]', error);
          if (galleryEmpty) {
            galleryEmpty.textContent = 'Could not load the gallery. Refresh the page or check the image manifest.';
          }
        }
      }

      let galleryPanState = null;
      let galleryWasDragged = false;

      function applyGalleryTransform() {
        if (!galleryViewerImage) return;

        const zoom = Number(galleryViewerImage.dataset.zoom || '1');
        const x = Number(galleryViewerImage.dataset.panX || '0');
        const y = Number(galleryViewerImage.dataset.panY || '0');
        galleryViewerImage.style.transform = `translate(${x}px, ${y}px) scale(${zoom})`;
      }

      function resetGalleryPan() {
        if (!galleryViewerImage) return;
        galleryViewerImage.dataset.panX = '0';
        galleryViewerImage.dataset.panY = '0';
        galleryPanState = null;
        galleryWasDragged = false;
        applyGalleryTransform();
      }

      function setGalleryZoom(level) {
        if (!galleryViewerImage) return;

        const next = Math.min(3, Math.max(1, Number(level) || 1));
        galleryViewerImage.dataset.zoom = String(next);
        galleryViewerImage.classList.toggle('zoomed', next > 1);

        if (next === 1) {
          resetGalleryPan();
        } else {
          applyGalleryTransform();
        }
      }

      function preloadGalleryNeighbors(index) {
        [index - 1, index + 1].forEach((i) => {
          const item = galleryItems[(i + galleryItems.length) % galleryItems.length];
          if (!item) return;
          const preloadImg = new Image();
          preloadImg.src = item.src;
        });
      }

      function showGalleryImage(index, animate = false) {
        if (!galleryViewerImage || !galleryItems.length) return;

        const nextIndex = (index + galleryItems.length) % galleryItems.length;
        const item = galleryItems[nextIndex];

        const multiple = galleryItems.length > 1;
        if (galleryViewerPrev) galleryViewerPrev.style.display = multiple ? '' : 'none';
        if (galleryViewerNext) galleryViewerNext.style.display = multiple ? '' : 'none';

        const doSwap = () => {
          currentGalleryIndex = nextIndex;
          galleryViewerImage.src = item.src;
          galleryViewerImage.alt = item.alt;
          galleryViewerImage.dataset.panX = '0';
          galleryViewerImage.dataset.panY = '0';
          galleryWasDragged = false;
          setGalleryZoom(1);

          if (galleryViewerCaptionText) galleryViewerCaptionText.textContent = item.alt;
          if (galleryViewerCount) galleryViewerCount.textContent = `${nextIndex + 1} / ${galleryItems.length}`;

          if (animate) {
            galleryViewerImage.style.opacity = '1';
          }

          preloadGalleryNeighbors(nextIndex);
        };

        if (animate && currentGalleryIndex >= 0) {
          galleryViewerImage.style.opacity = '0';
          setTimeout(doSwap, 180);
        } else {
          doSwap();
        }
      }

      function showNextGalleryImage() {
        if (currentGalleryIndex < 0) return;
        showGalleryImage(currentGalleryIndex + 1, true);
      }

      function showPrevGalleryImage() {
        if (currentGalleryIndex < 0) return;
        showGalleryImage(currentGalleryIndex - 1, true);
      }

      function openGalleryViewer(index) {
        if (!galleryViewer || !galleryViewerImage) return;

        showGalleryImage(index);

        galleryViewer.classList.add('open');
        galleryViewer.setAttribute('aria-hidden', 'false');
        galleryView?.classList.add('viewer-open');
        document.body.classList.add('viewer-open');
      }

      function closeGalleryViewer() {
        if (!galleryViewer || !galleryViewerImage) return;

        galleryViewer.classList.remove('open');
        galleryViewer.setAttribute('aria-hidden', 'true');
        galleryViewerImage.src = '';
        galleryViewerImage.alt = '';
        galleryViewerImage.dataset.panX = '0';
        galleryViewerImage.dataset.panY = '0';
        galleryWasDragged = false;
        galleryPanState = null;
        currentGalleryIndex = -1;
        setGalleryZoom(1);

        galleryView?.classList.remove('viewer-open');
        document.body.classList.remove('viewer-open');
      }

      galleryLink?.addEventListener('click', (event) => {
        event.preventDefault();
        setGalleryOpen(true, true);
      });

      galleryBack?.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        // Use history.back() if gallery was opened via navigation (hash is #gallery),
        // so the popstate handler closes it and the browser history stays consistent.
        // Fall back to manual close if there's no history entry to pop.
        if (window.location.hash === '#gallery') {
          history.back();
        } else {
          closeGalleryFromUi();
        }
      });

      galleryViewerClose?.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        closeGalleryViewer();
      });

      galleryViewer?.addEventListener('click', (event) => {
        if (event.target === galleryViewer) {
          closeGalleryViewer();
        }
      });

      galleryViewerImage?.addEventListener('mousedown', (event) => {
        if (Number(galleryViewerImage.dataset.zoom || '1') <= 1) return;

        galleryPanState = {
          startX: event.clientX,
          startY: event.clientY,
          originX: Number(galleryViewerImage.dataset.panX || '0'),
          originY: Number(galleryViewerImage.dataset.panY || '0')
        };
      });

      window.addEventListener('mousemove', (event) => {
        if (!galleryPanState) return;

        const dx = event.clientX - galleryPanState.startX;
        const dy = event.clientY - galleryPanState.startY;

        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
          galleryWasDragged = true;
        }

        galleryViewerImage.dataset.panX = String(galleryPanState.originX + dx);
        galleryViewerImage.dataset.panY = String(galleryPanState.originY + dy);
        applyGalleryTransform();
      });

      window.addEventListener('mouseup', () => {
        galleryPanState = null;
      });

      galleryViewerImage?.addEventListener('click', (event) => {
        if (galleryWasDragged) {
          galleryWasDragged = false;
          event.preventDefault();
          event.stopPropagation();
          return;
        }

        event.preventDefault();
        event.stopPropagation();

        const current = Number(galleryViewerImage.dataset.zoom || '1');
        setGalleryZoom(current > 1 ? 1 : 1.35);
      });

      galleryViewerImage?.addEventListener('dblclick', (event) => {
        event.preventDefault();
        event.stopPropagation();

        const current = Number(galleryViewerImage.dataset.zoom || '1');
        setGalleryZoom(current === 1 ? 2 : 1);
      });

      galleryViewerImage?.addEventListener('wheel', (event) => {
        if (!galleryViewer || !galleryViewer.classList.contains('open')) return;

        event.preventDefault();
        event.stopPropagation();

        const current = Number(galleryViewerImage.dataset.zoom || '1');
        const delta = event.deltaY < 0 ? 0.2 : -0.2;
        setGalleryZoom(current + delta);
      }, { passive: false });

      galleryViewerPrev?.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        showPrevGalleryImage();
      });

      galleryViewerNext?.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        showNextGalleryImage();
      });

      window.addEventListener('keydown', (event) => {
        if (!galleryViewer?.classList.contains('open')) return;

        if (event.key === 'Escape') {
          closeGalleryViewer();
        } else if (event.key === 'ArrowRight') {
          showNextGalleryImage();
        } else if (event.key === 'ArrowLeft') {
          showPrevGalleryImage();
        }
      });

      let gallerySwipeStartX = null;
      let gallerySwipeStartY = null;

      galleryViewer?.addEventListener('touchstart', (event) => {
        if (event.touches.length !== 1) return;
        gallerySwipeStartX = event.touches[0].clientX;
        gallerySwipeStartY = event.touches[0].clientY;
      }, { passive: true });

      galleryViewer?.addEventListener('touchend', (event) => {
        if (gallerySwipeStartX === null) return;
        if (Number(galleryViewerImage?.dataset.zoom || '1') > 1) {
          gallerySwipeStartX = null;
          return;
        }

        const touch = event.changedTouches[0];
        const dx = touch.clientX - gallerySwipeStartX;
        const dy = touch.clientY - (gallerySwipeStartY ?? touch.clientY);
        gallerySwipeStartX = null;

        if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) {
          if (dx < 0) showNextGalleryImage();
          else showPrevGalleryImage();
        }
      });

      window.addEventListener('popstate', () => {
        const open = window.location.hash === '#gallery';
        setGalleryOpen(open, false);
        if (!open) {
          closeGalleryViewer();
          document.body.classList.remove('gallery-open');
        }
      });

      if (window.location.hash === '#gallery') {
        setGalleryOpen(true, false);
        tryStartMusic();
        const unlockGalleryMusic = () => tryStartMusic();
        window.addEventListener('pointerdown', unlockGalleryMusic, { once: true });
        window.addEventListener('keydown', unlockGalleryMusic, { once: true });
      }
    </script>
</body>

</html>
