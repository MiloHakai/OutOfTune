<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Umiseii</title>
  <meta name="description" content="Umiseii on OutOfTune.">
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Umiseii" />
  <meta property="og:description" content="Umiseii on OutOfTune." />
  <meta property="og:url" content="https://outoftune.dev/umiseii/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Umiseii" />
  <meta name="twitter:description" content="Umiseii on OutOfTune." />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --sky: #81d4fa;
      --sky2: #e3f2fd;
      --white: #ffffff;
      --fg: #ffffff;
      --muted: rgba(255, 255, 255, 0.8);
      --pop: #f3c2ff;
      --pop2: #b5e2ff;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
    }

    body {
      color: var(--fg);
      background:
        linear-gradient(rgba(20, 14, 35, 0.35), rgba(20, 14, 35, 0.35)),
        url('./assets/images/background.png') no-repeat center center / cover fixed;
    }

    .splash {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #9b90bd 0%, #c4bcdc 55%, #eae6f5 100%);
      cursor: pointer;
      transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .splash.gone {
      opacity: 0;
      pointer-events: none;
    }

    .splash-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
      user-select: none;
    }

    .splash-name {
      font-size: clamp(1.1rem, 2.8vw, 1.6rem);
      color: #2c2243;
      opacity: 0;
      transform: translateY(25px);
      animation: slideUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
    }

    .splash-hint {
      font-size: clamp(0.45rem, 1.2vw, 0.52rem);
      color: rgba(44, 34, 67, 0.75);
      opacity: 0;
      letter-spacing: 1px;
      animation: fadeIn 0.8s ease forwards 0.9s;
    }

    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      to { opacity: 0.75; }
    }

    .edges {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .edge-t,
    .edge-r,
    .edge-b,
    .edge-l {
      position: absolute;
      background: rgba(0, 170, 255, 0.18);
    }

    .edge-t { top: 0; left: 0; right: 0; height: 3px; }
    .edge-r { top: 0; right: 0; bottom: 0; width: 3px; }
    .edge-b { bottom: 0; left: 0; right: 0; height: 3px; }
    .edge-l { top: 0; left: 0; bottom: 0; width: 3px; }

    .edge-t::after,
    .edge-r::after,
    .edge-b::after,
    .edge-l::after {
      content: '';
      position: absolute;
      opacity: 0;
    }

    .edge-t::after,
    .edge-b::after {
      top: -1px;
      bottom: -1px;
      width: 15vw;
    }

    .edge-t::after {
      left: 0;
      background: linear-gradient(90deg, transparent, var(--pop2), #fff, var(--pop2), transparent);
      animation: goRight 12s linear infinite;
    }

    .edge-b::after {
      right: 0;
      background: linear-gradient(270deg, transparent, var(--pop2), #fff, var(--pop2), transparent);
      animation: goLeft 12s linear infinite;
    }

    .edge-r::after,
    .edge-l::after {
      left: -1px;
      right: -1px;
      height: 15vh;
    }

    .edge-r::after {
      top: 0;
      background: linear-gradient(180deg, transparent, var(--pop2), #fff, var(--pop2), transparent);
      animation: goDown 12s linear infinite;
    }

    .edge-l::after {
      bottom: 0;
      background: linear-gradient(0deg, transparent, var(--pop2), #fff, var(--pop2), transparent);
      animation: goUp 12s linear infinite;
    }

    .line-1.edge-t::after { animation-delay: 0s; }
    .line-1.edge-r::after { animation-delay: 3s; }
    .line-1.edge-b::after { animation-delay: 6s; }
    .line-1.edge-l::after { animation-delay: 9s; }
    .line-2.edge-t::after { animation-delay: 6s; }
    .line-2.edge-r::after { animation-delay: 9s; }
    .line-2.edge-b::after { animation-delay: 0s; }
    .line-2.edge-l::after { animation-delay: 3s; }

    @keyframes goRight {
      0% { transform: translateX(-15vw); opacity: 1; }
      25% { transform: translateX(100vw); opacity: 1; }
      25.01%, 100% { transform: translateX(100vw); opacity: 0; }
    }

    @keyframes goDown {
      0% { transform: translateY(-15vh); opacity: 1; }
      25% { transform: translateY(100vh); opacity: 1; }
      25.01%, 100% { transform: translateY(100vh); opacity: 0; }
    }

    @keyframes goLeft {
      0% { transform: translateX(15vw); opacity: 1; }
      25% { transform: translateX(-100vw); opacity: 1; }
      25.01%, 100% { transform: translateX(-100vw); opacity: 0; }
    }

    @keyframes goUp {
      0% { transform: translateY(15vh); opacity: 1; }
      25% { transform: translateY(-100vh); opacity: 1; }
      25.01%, 100% { transform: translateY(-100vh); opacity: 0; }
    }

    main {
      position: relative;
      z-index: 3;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.1rem, 3.2vw, 1.55rem);
      letter-spacing: 0.12em;
      color: var(--fg);
      cursor: pointer;
      user-select: none;
      text-shadow: 0 2px 6px rgba(20, 14, 35, 0.95), 0 0 3px rgba(0, 0, 0, 0.9);
    }

    h1:hover {
      color: var(--pop);
    }

    p {
      margin: 0;
      font-size: 0.7rem;
      line-height: 1.7;
      color: var(--fg);
      text-shadow: 0 1px 4px rgba(20, 14, 35, 0.95), 0 0 2px rgba(0, 0, 0, 0.9);
    }

    #boop {
      color: var(--pop);
      text-shadow: 0 1px 4px rgba(20, 14, 35, 0.95), 0 0 2px rgba(0, 0, 0, 0.9);
    }

    .meow-bounce {
      animation: meowPulse 0.3s ease-out;
    }

    @keyframes meowPulse {
      0% { transform: translateY(0); }
      50% { transform: translateY(-2px); color: var(--pop); }
      100% { transform: translateY(0); }
    }

    .floating-meow {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      color: var(--pop);
      text-shadow: 0 1px 4px rgba(20, 14, 35, 0.95), 0 0 2px rgba(0, 0, 0, 0.9);
      transform: translate(-50%, -50%);
      animation: meowFloat 0.7s ease-out forwards;
      user-select: none;
    }

    @keyframes meowFloat {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(0);
      }
      25% {
        opacity: 0.95;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translateY(-25px);
      }
    }

    footer {
      position: fixed;
      bottom: 20px;
      right: 25px;
      font-size: 0.5rem;
      color: var(--muted);
      line-height: 1.45;
      letter-spacing: 0.06em;
      text-align: right;
      text-shadow: 0 1px 4px rgba(20, 14, 35, 0.95), 0 0 2px rgba(0, 0, 0, 0.9);
    }

    .track {
      position: fixed;
      bottom: 25px;
      left: 25px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .track-name {
      font-size: 0.48rem;
      line-height: 1.4;
      color: var(--fg);
      letter-spacing: 0.08em;
      text-shadow: 0 1px 4px rgba(20, 14, 35, 0.95), 0 0 2px rgba(0, 0, 0, 0.9);
    }

    .track-sub {
      font-size: 0.42rem;
      line-height: 1.3;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-shadow: 0 1px 4px rgba(20, 14, 35, 0.95), 0 0 2px rgba(0, 0, 0, 0.9);
    }

    @media (max-width: 768px) {
      h1 { font-size: 1rem; }
      p { font-size: 0.58rem; }

      .track {
        bottom: 48px;
        left: 50%;
        transform: translateX(-50%);
        align-items: center;
        text-align: center;
      }

      footer {
        bottom: 12px;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        text-align: center;
        font-size: 0.45rem;
      }
    }
  </style>
</head>

<body>
  <div id="splash" class="splash">
    <div class="splash-inner">
      <div class="splash-name">Umiseii</div>
      <div class="splash-hint">click here to continue</div>
    </div>
  </div>

  <div class="edges" aria-hidden="true">
    <div class="edge-t line-1"></div>
    <div class="edge-r line-1"></div>
    <div class="edge-b line-1"></div>
    <div class="edge-l line-1"></div>
    <div class="edge-t line-2"></div>
    <div class="edge-r line-2"></div>
    <div class="edge-b line-2"></div>
    <div class="edge-l line-2"></div>
  </div>

  <main>
    <h1 id="name" onclick="onNameClick(event)">Umiseii</h1>
    <p id="bio">wip</p>
    <p id="boop" hidden>boop</p>
  </main>

  <footer>
    OutOfTune - 2026<br>
    Umiseii
  </footer>

  <div class="track">
    <div class="track-name">Dust Cascade</div>
    <div class="track-sub">I'm a genshin addict</div>
  </div>

  <audio id="bgm" preload="auto" loop>
    <source src="./assets/audio/bgm.mp3" type="audio/mpeg">
  </audio>

  <audio id="click" preload="auto">
    <source src="./assets/audio/click-sound.mp3" type="audio/mpeg">
  </audio>

  <script>
    let meowResetTimer = null;

    function onNameClick(event) {
      playClick();

      const bio = document.getElementById('bio');
      const boop = document.getElementById('boop');
      const nameEl = document.getElementById('name');

      if (bio && boop) {
        bio.hidden = true;
        boop.hidden = false;
        boop.textContent = 'meow!';
      }

      if (nameEl) {
        nameEl.classList.remove('meow-bounce');
        void nameEl.offsetWidth; // trigger reflow for animation restart
        nameEl.classList.add('meow-bounce');
      }

      spawnFloatingMeow(event);

      if (meowResetTimer) {
        clearTimeout(meowResetTimer);
      }

      meowResetTimer = setTimeout(() => {
        if (bio && boop) {
          bio.hidden = false;
          boop.hidden = true;
        }
      }, 2500);
    }

    function spawnFloatingMeow(event) {
      const particle = document.createElement('div');
      particle.className = 'floating-meow';

      const variations = ['meow', 'meow~', 'meow!'];
      particle.textContent = variations[Math.floor(Math.random() * variations.length)];

      let x = event && typeof event.clientX === 'number' ? event.clientX : window.innerWidth / 2;
      let y = event && typeof event.clientY === 'number' ? event.clientY : window.innerHeight / 2;

      // Slight subtle offset
      x += (Math.random() - 0.5) * 20;
      y += (Math.random() - 0.5) * 10;

      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;

      document.body.appendChild(particle);

      particle.addEventListener('animationend', () => {
        particle.remove();
      });
    }

    function playClick() {
      const sfx = document.getElementById('click');
      if (!sfx) return;
      sfx.currentTime = 0;
      sfx.play().catch(() => {});
    }

    const bgm = document.getElementById('bgm');
    if (bgm) bgm.volume = 0.18;

    const click = document.getElementById('click');
    if (click) click.volume = 0.3;

    const splash = document.getElementById('splash');

    splash?.addEventListener('click', () => {
      splash.classList.add('gone');
      bgm?.play().catch(() => {});
    });
  </script>
</body>

</html>
