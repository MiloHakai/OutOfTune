<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bluerra-Sai</title>
  <meta name="description" content="Visual artist and Musician — Bluerra-Sai on OutOfTune.">
  <!-- Open Graph / Social Media Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Bluerra-Sai" />
  <meta property="og:description" content="Visual artist and Musician — Bluerra-Sai on OutOfTune." />
  <meta property="og:url" content="https://outoftune.dev/bluerra/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Bluerra-Sai" />
  <meta name="twitter:description" content="Visual artist and Musician — Bluerra-Sai on OutOfTune." />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./styles/style.css" />

  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      font-family: 'Press Start 2P', cursive;
      overflow: hidden;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-dark);
      position: relative;
      background-image: url('./images/background.png');
      background-size: cover;
      background-position: top center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(14, 15, 28, 0.72);
      z-index: 0;
      pointer-events: none;
    }

    #intro-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(12, 18, 30, 0.93);
      backdrop-filter: blur(14px);
      animation: intro-fade-out 1s ease-in-out forwards;
      animation-delay: 0.9s;
      overflow: hidden;
    }

    #intro-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center,
          rgba(168, 216, 234, 0.12) 0%,
          rgba(168, 216, 234, 0.04) 30%,
          rgba(12, 18, 30, 0) 65%);
      pointer-events: none;
    }

    .intro-logo {
      width: clamp(260px, 30vw, 420px);
      max-width: 82%;
      height: auto;
      opacity: 0;
      transform: translateY(8px) scale(0.9);
      image-rendering: auto;
      filter:
        drop-shadow(0 0 8px rgba(168, 216, 234, 0.75)) drop-shadow(0 0 18px rgba(168, 216, 234, 0.35));
      animation: intro-logo-in 0.9s ease-out forwards;
    }

    .page-shell {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      opacity: 0;
      transform: translateY(18px) scale(0.99);
      filter: blur(10px);
      animation: main-reveal 0.95s ease forwards;
      animation-delay: 1.05s;
    }

    .border-segments {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 1;
    }

    .border-top,
    .border-right,
    .border-bottom,
    .border-left {
      position: absolute;
      box-shadow: 0 0 10px var(--glow-color-dark);
      animation: border-glow 4.5s ease-in-out infinite;
    }

    .border-top { top: 0; left: 0; right: 0; height: 3px; }
    .border-right { top: 0; right: 0; bottom: 0; width: 3px; }
    .border-bottom { bottom: 0; left: 0; right: 0; height: 3px; }
    .border-left { top: 0; left: 0; bottom: 0; width: 3px; }

    .border-top::after,
    .border-right::after,
    .border-bottom::after,
    .border-left::after {
      content: '';
      position: absolute;
      will-change: transform, opacity;
      border-radius: 4px;
      opacity: 0;
    }

    .border-top::after,
    .border-bottom::after {
      top: -1px;
      bottom: -1px;
      width: 15vw;
    }

    .border-top::after {
      left: 0;
      background: linear-gradient(90deg, transparent, var(--pastel-blue), var(--pastel-blue-light), var(--pastel-blue), transparent);
      animation: snake-ltr 12s linear infinite;
    }

    .border-bottom::after {
      right: 0;
      background: linear-gradient(270deg, transparent, var(--pastel-blue), var(--pastel-blue-light), var(--pastel-blue), transparent);
      animation: snake-rtl 12s linear infinite;
    }

    .border-right::after,
    .border-left::after {
      left: -1px;
      right: -1px;
      height: 15vh;
    }

    .border-right::after {
      top: 0;
      background: linear-gradient(180deg, transparent, var(--pastel-blue), var(--pastel-blue-light), var(--pastel-blue), transparent);
      animation: snake-ttb 12s linear infinite;
    }

    .border-left::after {
      bottom: 0;
      background: linear-gradient(0deg, transparent, var(--pastel-blue), var(--pastel-blue-light), var(--pastel-blue), transparent);
      animation: snake-btt 12s linear infinite;
    }

    .border-line-1.border-top::after { animation-delay: 0s; }
    .border-line-1.border-right::after { animation-delay: 3s; }
    .border-line-1.border-bottom::after { animation-delay: 6s; }
    .border-line-1.border-left::after { animation-delay: 9s; }
    .border-line-2.border-top::after { animation-delay: 6s; }
    .border-line-2.border-right::after { animation-delay: 9s; }
    .border-line-2.border-bottom::after { animation-delay: 0s; }
    .border-line-2.border-left::after { animation-delay: 3s; }

    @keyframes snake-ltr {
      0% { transform: translateX(-15vw); opacity: 1; }
      25% { transform: translateX(100vw); opacity: 1; }
      25.01%, 100% { transform: translateX(100vw); opacity: 0; }
    }

    @keyframes snake-ttb {
      0% { transform: translateY(-15vh); opacity: 1; }
      25% { transform: translateY(100vh); opacity: 1; }
      25.01%, 100% { transform: translateY(100vh); opacity: 0; }
    }

    @keyframes snake-rtl {
      0% { transform: translateX(15vw); opacity: 1; }
      25% { transform: translateX(-100vw); opacity: 1; }
      25.01%, 100% { transform: translateX(-100vw); opacity: 0; }
    }

    @keyframes snake-btt {
      0% { transform: translateY(15vh); opacity: 1; }
      25% { transform: translateY(-100vh); opacity: 1; }
      25.01%, 100% { transform: translateY(-100vh); opacity: 0; }
    }

    @keyframes border-glow {
      0%, 100% { opacity: 0.75; filter: drop-shadow(0 0 10px rgba(137, 196, 225, 0.75)); }
      50% { opacity: 1; filter: drop-shadow(0 0 18px rgba(168, 216, 234, 0.9)); }
    }

    @keyframes intro-logo-in {
      0% { opacity: 0; transform: translateY(10px) scale(0.9); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes intro-fade-out {
      to { opacity: 0; visibility: hidden; pointer-events: none; }
    }

    @keyframes main-reveal {
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .container {
      position: relative;
      top: -4vh;
      z-index: 3;
      height: 100%;
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .logo-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 32px;
    }

    .logo {
      width: clamp(460px, 36vw, 620px);
      max-width: 92%;
      height: auto;
      cursor: pointer;
      user-select: none;
      image-rendering: auto;
      animation: logo-float 6s ease-in-out infinite;
      transition: transform 0.25s ease, filter 0.25s ease;
      filter: drop-shadow(0 0 6px rgba(168, 216, 234, 0.65)) drop-shadow(0 0 14px rgba(168, 216, 234, 0.35));
    }

    .logo:hover {
      transform: scale(1.03);
      filter: drop-shadow(0 0 8px rgba(168, 216, 234, 0.8)) drop-shadow(0 0 18px rgba(168, 216, 234, 0.45));
    }

    @keyframes logo-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    p {
      margin-top: 0;
      font-size: 0.9rem;
      font-family: 'Press Start 2P', cursive;
      font-weight: 400;
      opacity: 0.92;
      animation: subtle-pulse 12s ease-in-out infinite;
      line-height: 1.7;
      text-shadow: 0 0 10px var(--glow-color-dark);
    }

    @keyframes subtle-pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }

    .easter-egg-message {
      margin-top: 1rem;
      font-size: 0.8rem;
      opacity: 0.9;
      text-shadow: 0 0 10px var(--glow-color-dark);
      color: var(--text-dark);
    }

    .icons {
      margin-top: 1.5rem;
    }

    .icons a {
      margin: 0 15px;
      font-size: 1.8rem;
      color: inherit;
      text-decoration: none;
      transition: all 0.3s ease;
      filter: drop-shadow(0 0 8px var(--glow-color-dark));
      opacity: 0.82;
    }

    .icons a:hover {
      color: var(--pastel-blue);
      opacity: 1;
      transform: scale(1.16);
      filter: drop-shadow(0 0 15px var(--glow-color-dark));
    }

    footer {
      position: fixed;
      bottom: 15px;
      width: 100%;
      text-align: center;
      font-size: 0.6rem;
      color: rgba(255, 255, 255, 0.7);
      z-index: 2;
      font-family: 'Press Start 2P', cursive;
      line-height: 1.4;
      padding: 0 20px;
    }

    footer a {
      color: var(--pastel-blue);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    footer a:hover {
      color: var(--pastel-blue-light);
    }

    /* --- NOW PLAYING WIDGET --- */
    .now-playing {
      position: fixed;
      bottom: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .visualizer {
      display: flex;
      align-items: flex-end;
      height: 14px;
      gap: 3px;
    }

    .bar {
      width: 3px;
      background-color: var(--pastel-blue);
      border-radius: 2px;
      animation: bounce 1s ease-in-out infinite;
      box-shadow: 0 0 5px var(--glow-color-dark);
      transform-origin: bottom;
    }

    .bar:nth-child(1) { height: 100%; animation-delay: 0.0s; }
    .bar:nth-child(2) { height: 60%; animation-delay: 0.2s; }
    .bar:nth-child(3) { height: 80%; animation-delay: 0.4s; }
    .bar:nth-child(4) { height: 40%; animation-delay: 0.1s; }

    @keyframes bounce {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }

    .song-title {
      font-size: 0.55rem;
      color: var(--text-dark);
      text-shadow: 0 0 8px var(--glow-color-dark);
      white-space: nowrap;
      line-height: 1.2;
    }

    @media (max-width: 600px) {
      .logo { width: 320px; }
      p { font-size: 0.7rem; }
      .now-playing {
        bottom: 45px;
        left: 50%;
        transform: translateX(-50%);
        width: max-content;
      }
    }
  </style>
</head>

<body>

</body>
