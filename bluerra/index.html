  <script src="./scripts/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof THREE === 'undefined') return;

      const globeBox = document.getElementById('globe-target');
      if (!globeBox) return;

      function safeSize(el, fallbackW, fallbackH) {
        const w = Math.max(1, el.offsetWidth || el.clientWidth || fallbackW || 1);
        const h = Math.max(1, el.offsetHeight || el.clientHeight || fallbackH || 1);
        return { w, h, aspect: w / h };
      }

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const gScene = new THREE.Scene();
      const gs = safeSize(globeBox, 400, 400);
      const gCam = new THREE.PerspectiveCamera(75, gs.aspect, 0.1, 1000);
      const gRen = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      gRen.setPixelRatio(dpr);
      gRen.setSize(gs.w, gs.h);
      globeBox.appendChild(gRen.domElement);

      const globe = new THREE.Mesh(
        new THREE.IcosahedronGeometry(2.5, 3),
        new THREE.MeshBasicMaterial({ color: 0xc0e0ff, wireframe: true, transparent: true, opacity: 0.90 })
      );
      gScene.add(globe);
      gCam.position.z = 4.2;

      function layoutGlobe() {
        const s = safeSize(globeBox, 400, 400);
        gCam.aspect = s.aspect;
        gCam.updateProjectionMatrix();
        gRen.setSize(s.w, s.h);
      }

      window.addEventListener('resize', layoutGlobe);
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(layoutGlobe).observe(globeBox);
      }
      layoutGlobe();

      let tField = 0;
      function animate() {
        requestAnimationFrame(animate);
        tField += 1;
        globe.rotation.y = tField * 0.003;
        globe.rotation.x = tField * 0.001;
        gRen.render(gScene, gCam);
      }
      animate();
    });
  </script>
</body>
