<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bunnisu</title>
    <meta name="description" content="Silly artist" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bunnisu" />
    <meta property="og:description" content="Silly artist" />
    <meta property="og:url" content="https://outoftune.dev/buniisu" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Bunnisu" />
    <meta name="twitter:description" content="Silly artist" />
    <link class="icon" type="image/svg+xml" href="assets/icons/logo.svg">
    
    <!-- GOOGLE FONTS: Press Start 2P for the title, Lexend for Latin letters in the lyrics,
         Zen Kaku Gothic New (+ Noto Sans JP as backup) for Japanese characters -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Lexend:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            /* NEUTRAL GRAYSCALE PALETTE (matches the black and white video) */
            --bg-base: #0e0e10;
            --bg-base-dark: #080809;
            --primary: #d6d6da;       
            --text-main: #ededf0;     
            --text-muted: #8a8a92;    

            /* Glowing text wave palette */
            --wave-light: #f2f2f5;
            --wave-dark: #85858d;

            /* CELESTIAL BACKGROUND ELEMENTS */
            --moon-rim: rgba(255, 255, 255, 0.85);
            --moon-rim-soft: rgba(224, 235, 255, 0.25);
            --moon-halo: rgba(255, 255, 255, 0.08);
            
            --band-strong: rgba(255, 255, 255, 0.04);
            --band-soft: rgba(255, 255, 255, 0.01);
            --mist: rgba(255, 255, 255, 0.01);
            --dust: rgba(255, 255, 255, 0.15);
            
            /* CRT Overlay properties */
            --scanline: rgba(255, 255, 255, 0.015);
            --vignette: rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            height: 100%;
            width: 100%;
        }

        /* PAGE LAYOUT
           One grid holds the three visible pieces, so nothing depends on how tall
           the current lyric line is. The brand sits in the flexible top row; the
           lyrics and the footer share a fixed bottom row. */
        body {
            height: 100vh;   /* fallback */
            height: 100dvh;  /* follows the phone browser's address bar */
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-rows: minmax(0, 1fr) auto;
            grid-template-areas:
                "brand  brand"
                "lyrics footer";
            column-gap: 24px;
            row-gap: 20px;
            align-items: end;
            padding:
                max(40px, env(safe-area-inset-top))
                max(40px, env(safe-area-inset-right))
                max(40px, env(safe-area-inset-bottom))
                max(40px, env(safe-area-inset-left));
        }

        /* ─────────────────────────────────────────────────────────────
           CELESTIAL BACKGROUND SYSTEM
           ───────────────────────────────────────────────────────────── */
        .space-plate {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: linear-gradient(180deg, var(--bg-base) 0%, var(--bg-base-dark) 100%);
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        body.ambient-active .space-plate {
            opacity: 1;
        }

        .space-plate::before {
            content: "";
            position: absolute;
            inset: -25%;
            transform: rotate(-14deg) scale(1.15);
            opacity: 0.85;
            background:
                radial-gradient(ellipse 160% 20% at 68% 55%,
                    var(--band-strong) 0%,
                    var(--band-soft) 40%,
                    transparent 75%),
                radial-gradient(ellipse 60% 35% at 20% 30%,
                    var(--mist) 0%,
                    transparent 70%);
        }

        .space-plate::after {
            content: "";
            position: absolute;
            inset: 0;
            opacity: 0.3;
            mix-blend-mode: overlay;
            background-image: radial-gradient(var(--dust) 1px, transparent 1px);
            background-size: 4px 4px;
        }

        /* VIDEO BACKGROUND
           The video already has its own moon and stars, so the CSS moon and
           canvas stars below are hidden. To bring them back, delete the
           ".moon, #starCanvas { display: none; }" rule. */
        .bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;        /* fills the screen, no black bands */
            object-position: 32% 50%; /* keeps the moon in view on phones */
            z-index: 0;
            pointer-events: none;
            filter: brightness(0.55); /* dims the bright trees so text stays readable */
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        body.ambient-active .bg-video {
            opacity: 1;
        }

        .bg-scrim {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(8, 8, 10, 0.75) 0%, rgba(8, 8, 10, 0.35) 55%, rgba(8, 8, 10, 0.1) 100%),
                linear-gradient(0deg, rgba(8, 8, 10, 0.7) 0%, transparent 35%);
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        body.ambient-active .bg-scrim {
            opacity: 1;
        }

        .moon,
        #starCanvas {
            display: none;
        }

        .moon {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            filter: drop-shadow(0 0 25px var(--moon-halo));
            transition: opacity 1.5s ease 0.3s, transform 1.5s ease;
        }

        body.ambient-active .moon {
            opacity: 0.9;
        }

        .moon.big {
            width: 180px;
            height: 180px;
            top: 15%;
            right: 10%;
            background: radial-gradient(circle at 34% 36%,
                transparent 58%,
                var(--moon-rim) 59%,
                var(--moon-rim) 62%,
                var(--moon-rim-soft) 66%,
                transparent 72%);
            animation: moon-bob 16s ease-in-out infinite;
        }

        @keyframes moon-bob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(0.5deg); }
        }

        #starCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease;
        }
        
        body.ambient-active #starCanvas {
            opacity: 0.85;
        }

        /* ─────────────────────────────────────────────────────────────
           CRT SCANLINE LAYER
           ───────────────────────────────────────────────────────────── */
        .crt-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
        }

        .crt-overlay::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                var(--scanline) 0px,
                var(--scanline) 1px,
                transparent 1px,
                transparent 4px);
        }

        .crt-overlay::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 120% 110% at 50% 50%,
                transparent 0%,
                transparent 65%,
                var(--vignette) 100%);
        }

        /* ─────────────────────────────────────────────────────────────
           UI CORE WORKSPACE (DESKTOP MODES)
           ───────────────────────────────────────────────────────────── */
        .content-wrapper {
            grid-area: brand;
            align-self: center;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            min-width: 0;
        }

        .brand-section {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 16px;
        }

        .brand-section h1.wave-text {
            font-family: 'Press Start 2P', monospace !important;
            font-size: clamp(1.4rem, 3.5vw, 2.2rem);
            font-weight: 400;
            margin: 0;
            line-height: 1.2;
            letter-spacing: 0.02em;
            cursor: default;
            user-select: none;
            color: var(--primary);
            display: inline-block;
        }

        .brand-section h1.wave-text.glow-active {
            background: linear-gradient(90deg, 
                var(--wave-light) 0%, 
                var(--wave-dark) 25%, 
                var(--wave-light) 50%, 
                var(--wave-dark) 75%, 
                var(--wave-light) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: wave-slide 4s linear infinite;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4));
        }

        @keyframes wave-slide {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .subtitle {
            color: var(--text-muted);
            font-family: 'Press Start 2P', monospace;
            font-size: 0.65rem;
            font-weight: 400;
            max-width: 500px;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }

        .socials-row {
            display: flex;
            align-items: center;
            gap: 2px;
            /* each icon has 11px of tap padding; pull the row back so the first
               icon lines up with the left edge of the text above it */
            margin: 2px 0 0 -11px;
        }

        .social-icon-link {
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px; /* comfortable tap target */
            border-radius: 8px;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .social-icon-link:hover {
            color: #ffffff;
            transform: scale(1.1);
        }

        /* Quiet, staggered entrance after the intro overlay is dismissed. */
        .brand-section > * {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 700ms ease, transform 700ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        body.ambient-active .brand-section > * {
            opacity: 1;
            transform: translateY(0);
        }

        body.ambient-active .brand-section > :nth-child(1) { transition-delay: 100ms; }
        body.ambient-active .brand-section > :nth-child(2) { transition-delay: 220ms; }
        body.ambient-active .brand-section > :nth-child(3) { transition-delay: 340ms; }

        .track-title,
        .lyric-line,
        .footer-copy,
        .footer-author {
            transition: opacity 450ms ease;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        .social-icon-link:focus-visible {
            outline: 1px solid var(--primary);
            outline-offset: -2px;
        }

        .social-icon-link svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Audio Lyrics Display Box */
        .lyrics-container {
            grid-area: lyrics;
            position: relative;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: min(540px, 100%);
            min-width: 0;
        }

        .track-title {
            font-family: 'Lexend', 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.06em;
        }

        .lyric-line {
            font-family: 'Lexend', 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-main);
            line-height: 1.7;
            min-height: 3.4em;
            letter-spacing: 0.06em;
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.7);
        }

        /* Each line is animated from the script: it wipes in from the bottom to the top */
        .lyric-typed {
            display: inline-block;
            clip-path: inset(100% 0 0 0);
        }



        /* Stacked bottom-right footer system */
        .footer-right {
            grid-area: footer;
            position: relative;
            z-index: 100;
            font-family: 'Press Start 2P', monospace;
            color: var(--text-muted);
            font-size: 0.5rem;
            line-height: 1.7;
            letter-spacing: 0.5px;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .footer-copy {
            opacity: 0.8;
        }

        .footer-author {
            opacity: 0.85;
            color: var(--primary);
        }

        /* TEXT INTRO SLIDE OVERLAY ARCHITECTURE */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-base);
            transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .intro-holder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
            user-select: none;
        }

        .intro-title {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(1.1rem, 2.8vw, 1.6rem); 
            color: var(--primary);
            opacity: 0;
            transform: translateY(25px);
            animation: introSlideUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
        }

        .intro-sub-click {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.45rem, 1.2vw, 0.52rem); 
            color: var(--text-muted);
            opacity: 0;
            letter-spacing: 1px;
            animation: fadeInSimple 0.8s ease forwards 0.9s;
        }

        @keyframes introSlideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInSimple {
            to { opacity: 0.75; }
        }

        /* ─────────────────────────────────────────────────────────────
           UPDATED: CENTERED & VERTICALLY BALANCED MOBILE ARCHITECTURE
           ───────────────────────────────────────────────────────────── */
        /* DESKTOP AND TABLET (anything wider than a phone)
           The bottom edge is part of the page grid, so the song name lines up with
           the copyright line and the lyric lines up with "Bunnisu" on the right
           (each pair shares a text baseline). The two boxes dissolve
           (display: contents) so their text can sit directly in the grid. */
        @media (min-width: 769px) {
            body {
                grid-template-rows: minmax(0, 1fr) auto auto;
                row-gap: 0;
            }

            .content-wrapper {
                grid-row: 1;
                grid-column: 1 / -1;
                margin-bottom: 20px;
            }

            .lyrics-container,
            .footer-right {
                display: contents;
            }

            .track-title,
            .lyric-line,
            .footer-copy,
            .footer-author {
                position: relative;
                z-index: 100;
                align-self: baseline;
            }

            .track-title {
                grid-row: 2;
                grid-column: 1;
                margin-bottom: 4px;
            }

            .lyric-line {
                grid-row: 3;
                grid-column: 1;
                min-height: 0;
                max-width: 640px;
            }

            .footer-copy {
                grid-row: 2;
                grid-column: 2;
                justify-self: end;
                margin-bottom: 4px;
            }

            .footer-author {
                grid-row: 3;
                grid-column: 2;
                justify-self: end;
            }
        }

        /* Taller screens: center the title block on the whole page */
        @media (min-width: 769px) and (min-height: 561px) {
            .content-wrapper {
                grid-row: 1 / -1;
                margin-bottom: 0;
            }
        }

        @media (max-width: 768px) {
            body {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr) auto auto;
                grid-template-areas:
                    "brand"
                    "lyrics"
                    "footer";
                row-gap: 20px;
                padding:
                    max(24px, env(safe-area-inset-top))
                    max(24px, env(safe-area-inset-right))
                    max(20px, env(safe-area-inset-bottom))
                    max(24px, env(safe-area-inset-left));
            }

            .content-wrapper {
                align-items: center;
                text-align: center;
                padding-top: 28dvh; /* keeps the title below the moon in the video */
            }

            .brand-section {
                gap: 10px;
                width: 100%;
                align-items: center;
            }

            .brand-section h1.wave-text {
                font-size: 1.4rem;
            }

            .socials-row {
                justify-content: center;
                margin-left: 0;
            }

            .bg-scrim {
                /* text is centered on phones, so dim evenly instead of from the left */
                background: rgba(8, 8, 10, 0.5);
            }

            .lyrics-container {
                width: 100%;
                align-items: center;
                text-align: center;
            }

            .track-title {
                font-size: 0.7rem;
                line-height: 1.5;
                text-align: center;
            }

            .lyric-line {
                font-size: 1rem;
                text-align: center;
                min-height: 5.1em; /* room for three lines, so the layout never jumps */
                width: 100%;
            }

            .footer-right {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                width: 100%;
            }
        }

        /* Short screens, such as a phone held sideways */
        @media (max-height: 480px) {
            body {
                padding-top: max(20px, env(safe-area-inset-top));
                padding-bottom: max(20px, env(safe-area-inset-bottom));
            }
        }

        @media (max-width: 768px) and (max-height: 480px) {
            body {
                row-gap: 12px;
            }

            .content-wrapper {
                padding-top: 0;
            }

            .lyric-line {
                min-height: 3.4em;
            }
        }
    </style>
</head>

    </main>

    <div class="lyrics-container">

    <script>
        /* STARS DRAWING ENGINE */
        (function () {
            const canvas = document.getElementById('starCanvas');
            const ctx = canvas.getContext('2d', { alpha: true });
            let W = 0, H = 0;
            let stars = [];

            function resize() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = canvas.width = Math.floor(window.innerWidth * dpr);
                H = canvas.height = Math.floor(window.innerHeight * dpr);
                canvas.style.width = window.innerWidth + "px";
                canvas.style.height = window.innerHeight + "px";
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                initStars();
            }

            function rand(min, max) { return min + Math.random() * (max - min); }

            function initStars() {
                stars = [];
                const area = window.innerWidth * window.innerHeight;
                const count = Math.min(Math.floor(area / 1800), 450); 

                for (let i = 0; i < count; i++) {
                    const r = Math.random();
                    stars.push({
                        x: Math.random() * window.innerWidth,
                        y: Math.random() * window.innerHeight,
                        size: r < 0.85 ? rand(0.5, 1.2) : rand(1.2, 2.0),
                        a: rand(0.4, 0.95),
                        tw: rand(0.005, 0.015),
                        off: rand(0, Math.PI * 2)
                    });
                }
            }

            function draw(t) {
                ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                ctx.fillStyle = "rgba(230, 242, 255, 1)"; 
                
                for (const s of stars) {
                    const twinkle = Math.sin(t * s.tw * 60 + s.off);
                    const alpha = s.a * (0.5 + 0.5 * twinkle);
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;
                requestAnimationFrame(draw);
            }

            window.addEventListener('resize', resize);
            resize();
            requestAnimationFrame(draw);
        })();

        /* CORE AUDIO & LYRICS INTERACTION ENGINE */
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('overlay');
            const audio = document.getElementById('bgm');
            const brandTitle = document.getElementById('brand-title');
            const bodyNode = document.body;
            
            const lyricOutput = document.getElementById('lyric-output');
            const trackName = document.getElementById('track-name');

            let parsedLyrics = [];
            let currentLineIndex = -1;

            trackName.textContent = 'Sign 0 — chouchou';
            lyricOutput.textContent = '\u00A0';

            function parseLRC() {
                const lrcText = document.getElementById('lrc-content').textContent;
                const lines = lrcText.split('\n');
                const timeReg = /\[(\d+):(\d+)(?:\.(\d{1,3}))?\]/;

                lines.forEach(line => {
                    const match = timeReg.exec(line);
                    if (match) {
                        const minutes = parseInt(match[1]);
                        const seconds = parseInt(match[2]);
                        const fraction = match[3] ? Number(`0.${match[3]}`) : 0;
                        const timeInSeconds = (minutes * 60) + seconds + fraction;
                        const text = line.replace(timeReg, '').trim();
                        parsedLyrics.push({ time: timeInSeconds, text: text });
                    }
                });
                parsedLyrics.sort((a, b) => a.time - b.time);
            }
            parseLRC();

            overlay.addEventListener('click', () => {
                overlay.classList.add('hidden');
                bodyNode.classList.add('ambient-active');
                brandTitle.classList.add('glow-active');
                
                audio.volume = 0.25;
                audio.play()
                    .then(() => {
                        startLyricSyncLoop();
                    })
                    .catch(err => {
                        console.warn('Audio playback handled safely:', err);
                        lyricOutput.textContent = 'Playback initialized. Stream paused.';
                    });
            });

            function startLyricSyncLoop() {
                function frameCheck() {
                    if (!audio.paused && !audio.ended) {
                        const currentTime = audio.currentTime;
                        let activeIndex = -1;

                        for (let i = 0; i < parsedLyrics.length; i++) {
                            if (currentTime >= parsedLyrics[i].time) {
                                activeIndex = i;
                            } else {
                                break;
                            }
                        }

                        if (activeIndex === -1 && currentLineIndex !== -1) {
                            /* the song looped back to the start */
                            currentLineIndex = -1;
                            triggerLinePrint('');
                        }

                        if (activeIndex !== -1 && activeIndex !== currentLineIndex) {
                            currentLineIndex = activeIndex;
                            triggerLinePrint(parsedLyrics[currentLineIndex].text);
                        }
                    }
                    requestAnimationFrame(frameCheck);
                }
                requestAnimationFrame(frameCheck);
            }

            /* Each lyric line wipes in from the bottom to the top.
               An empty timestamp in the lyrics fades the previous line out. */
            let currentAnim = null;
            function triggerLinePrint(fullText) {
                if (currentAnim) currentAnim.cancel();

                if (!fullText) {
                    currentAnim = lyricOutput.animate(
                        [{ clipPath: 'inset(0 0 0 0)', opacity: 1 }, { clipPath: 'inset(0 0 0 0)', opacity: 0 }],
                        { duration: 500, easing: 'ease', fill: 'forwards' }
                    );
                    return;
                }

                lyricOutput.textContent = fullText;
                currentAnim = lyricOutput.animate(
                    [
                        { clipPath: 'inset(100% 0 0 0)', transform: 'translateY(0.5em)' },
                        { clipPath: 'inset(0 0 0 0)', transform: 'translateY(0)' }
                    ],
                    { duration: 800, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards' }
                );
            }
        });
    </script>
