<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indura</title>
    <meta name="description" content="Indura" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Indura" />
    <meta property="og:description" content="Indura" />
    <meta property="og:url" content="https://outoftune.dev/indura" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Indura" />
    <meta name="twitter:description" content="Indura" />
    <!-- Tab icon: small resized copies of logo.png (see favicon.png / apple-touch-icon.png) -->
    <link rel="icon" type="image/png" sizes="256x256" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <!-- GOOGLE FONTS: Noto Sans JP and KR for clean Japanese/Korean character fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            /* INDURA: TEAL & GOLD NIGHT PALETTE */
            --bg-base: #07040a;          /* near-black with a warm tint */
            --bg-base-dark: #030206;     /* near-black */
            --primary: #ff3d5a;          /* crimson, matches the red in bg.mp4 */
            --accent: #e8ecf5;           /* silver, matches the hair */
            --text-main: #fff6f7;        /* soft, warm white */
            --text-muted: #b9a5ab;       /* desaturated rose/grey */

            /* Glowing text wave palette */
            --wave-light: #ffb3c1;       /* soft pink */
            --wave-dark: #ff7a93;        /* rose */

            /* CELESTIAL BACKGROUND ELEMENTS (warmer highlights) */
            --moon-rim: rgba(255, 211, 107, 0.95);
            --moon-rim-soft: rgba(255, 211, 107, 0.20);
            --moon-halo: rgba(255, 211, 107, 0.06);

            --band-strong: rgba(255, 211, 107, 0.05);
            --band-soft: rgba(255, 211, 107, 0.012);
            --mist: rgba(255, 122, 182, 0.03);
            --dust: rgba(255, 210, 230, 0.12);

            /* CRT Overlay properties */
            --scanline: rgba(255, 255, 255, 0.012);
            --vignette: rgba(0, 0, 0, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            height: 100%;
            width: 100%;
        }

        body {
            height: 100svh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            background-color: #000000;
            position: relative;
        }

        /* bg.mp4 is a wide (~2:1) loop. object-position keeps the face in frame on tall/mobile screens.
           No CSS filter on purpose: filters on a 3830px video are expensive, the shade below does the dimming. */
        .video-background {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 70% center;
            transform-origin: 70% 50%;
            z-index: 0;
            display: block;
            background: #000000;
        }

        /* Real element (a ::after on <video> never renders): keeps the left-side text readable */
        .video-shade {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(3, 2, 6, 0.78) 0%, rgba(3, 2, 6, 0.42) 38%, rgba(3, 2, 6, 0.12) 68%, rgba(3, 2, 6, 0.38) 100%),
                linear-gradient(0deg, rgba(3, 2, 6, 0.82) 0%, rgba(3, 2, 6, 0) 38%),
                rgba(3, 2, 6, 0.18);
        }

        .video-shade::after {
            content: "";
            position: absolute;
            inset: 0;
            background: #000;
            opacity: 0;
        }

        .space-plate,
        .moon,
        #starCanvas,
        .crt-overlay {
            display: none !important;
        }

        /* ─────────────────────────────────────────────────────────────
           CELESTIAL BACKGROUND SYSTEM
           ───────────────────────────────────────────────────────────── */
        .space-plate {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: linear-gradient(180deg, var(--bg-base) 0%, var(--bg-base-dark) 100%);
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        body.ambient-active .space-plate {
            opacity: 1;
        }

        .space-plate::before {
            content: "";
            position: absolute;
            inset: -25%;
            transform: rotate(-14deg) scale(1.15);
            opacity: 0.85;
            background:
                radial-gradient(ellipse 160% 20% at 68% 55%,
                    var(--band-strong) 0%,
                    var(--band-soft) 40%,
                    transparent 75%),
                radial-gradient(ellipse 60% 35% at 20% 30%,
                    var(--mist) 0%,
                    transparent 70%);
        }

        .space-plate::after {
            content: "";
            position: absolute;
            inset: 0;
            opacity: 0.3;
            mix-blend-mode: overlay;
            background-image: radial-gradient(var(--dust) 1px, transparent 1px);
            background-size: 4px 4px;
        }

        .moon {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            filter: drop-shadow(0 0 25px var(--moon-halo));
            transition: opacity 1.5s ease 0.3s, transform 1.5s ease;
        }

        body.ambient-active .moon {
            opacity: 0.9;
        }

        .moon.big {
            width: 180px;
            height: 180px;
            top: 15%;
            right: 10%;
            background: radial-gradient(circle at 34% 36%,
                transparent 58%,
                var(--moon-rim) 59%,
                var(--moon-rim) 62%,
                var(--moon-rim-soft) 66%,
                transparent 72%);
            animation: moon-bob 16s ease-in-out infinite;
        }

        @keyframes moon-bob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(0.5deg); }
        }

        #starCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease;
        }
        
        body.ambient-active #starCanvas {
            opacity: 0.85;
        }

        /* ─────────────────────────────────────────────────────────────
           CRT SCANLINE LAYER
           ───────────────────────────────────────────────────────────── */
        .crt-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
        }

        .crt-overlay::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(0deg,
                var(--scanline) 0px,
                var(--scanline) 1px,
                transparent 1px,
                transparent 4px);
        }

        .crt-overlay::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse 120% 110% at 50% 50%,
                transparent 0%,
                transparent 65%,
                var(--vignette) 100%);
        }

        /* ─────────────────────────────────────────────────────────────
           UI CORE WORKSPACE (DESKTOP MODES)
           ───────────────────────────────────────────────────────────── */
        .content-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            text-align: left;
            z-index: 10;
            width: 100%;
            padding-left: 40px;
            padding-right: 40px;
            position: relative;
        }

        .brand-section {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 16px;
            z-index: 20;
        }

        .brand-section h1.wave-text {
            font-family: 'Press Start 2P', monospace !important;
            font-size: clamp(1.4rem, 3.5vw, 2.2rem);
            font-weight: 400;
            margin: 0;
            line-height: 1.2;
            letter-spacing: 0.02em;
            cursor: default;
            user-select: none;
            color: var(--primary);
            display: inline-block;
        }

        .brand-section h1.wave-text.glow-active {
            background: linear-gradient(90deg, 
                var(--wave-light) 0%, 
                var(--wave-dark) 25%, 
                var(--wave-light) 50%, 
                var(--wave-dark) 75%, 
                var(--wave-light) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: wave-slide 2.6s linear infinite;
            will-change: background-position;
            filter: none;
        }

        @keyframes wave-slide {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .subtitle {
            color: var(--text-muted);
            font-family: 'Press Start 2P', monospace;
            font-size: 0.65rem;
            font-weight: 400;
            max-width: 500px;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }

        .socials-row {
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .social-icon-link {
            color: var(--primary);
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.2s ease;
            will-change: transform;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 6px;
            background: transparent;
            text-decoration: none;
        }

        .social-icon-link:hover {
            color: var(--accent);
            transform: translateY(-2px) scale(1.06);
        }

        .social-icon-link svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            transition: filter 0.18s ease, transform 0.18s ease;
        }

        .social-icon-link:hover svg {
            filter: drop-shadow(0 0 12px var(--primary));
            transform: scale(1.08);
        }
        .social-icon-link i {
            font-size: 22px;
            line-height: 1;
        }

        /* Audio Lyrics Display Box */
        .lyrics-container {
            position: fixed;
            left: 28px;
            bottom: 28px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: min(540px, calc(100vw - 80px));
            padding-left: 6px;
        }

        .track-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.5rem;
            color: var(--text-muted);
            font-weight: bold;
            letter-spacing: 0.04em;
            padding-left: 4px;
        }

        .lyric-line {
            font-family: 'Press Start 2P', 'Noto Sans JP', 'Noto Sans KR', sans-serif;
            font-size: 0.43rem; 
            color: var(--text-main);
            line-height: 1.7;
            min-height: 3.2em; 
            transition: color 0.3s ease;
            letter-spacing: 0.04em;
            padding-left: 4px;
        }

        .lyric-typed {
            display: inline;
        }

        .lyric-caret {
            display: inline-block;
            width: 0.5ch;
            margin-left: 4px;
            color: var(--primary);
            animation: caretBlink 0.65s step-end infinite;
            vertical-align: baseline;
        }

        @keyframes caretBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Stacked bottom-right footer system */
        .footer-right {
            position: fixed;
            right: 40px;
            bottom: 40px;
            z-index: 100;
            font-family: 'Press Start 2P', monospace;
            color: var(--text-muted);
            font-size: 0.42rem;
            line-height: 1.7;
            letter-spacing: 0.5px;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .footer-copy {
            opacity: 0.6;
        }

        .footer-author {
            opacity: 0.85;
            color: var(--primary);
        }

        .lanyard-card {
            position: fixed;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: rgba(7, 11, 20, 0.45); /* Increased transparency from 0.8 to 0.45 for a premium glass aesthetic */
            border: 1px solid rgba(255, 61, 90, 0.22);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding-right: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            min-width: min(280px, calc(100vw - 80px));
        }

        .lanyard-avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }

        .lanyard-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: none;
        }

        .lanyard-status-dot {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid rgba(10, 14, 24, 0.9);
            background-color: #80848e;
        }

        .lanyard-status-dot.online { background-color: #23a55a; }
        .lanyard-status-dot.idle { background-color: #f0b232; }
        .lanyard-status-dot.dnd { background-color: #f23f43; }
        .lanyard-status-dot.offline { background-color: #80848e; }

        .lanyard-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .lanyard-username {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.42rem;
            color: var(--text-main);
            line-height: 1.4;
        }

        .lanyard-custom-status,
        .lanyard-status-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.34rem;
            color: var(--text-muted);
            line-height: 1.45;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* TEXT INTRO SLIDE OVERLAY ARCHITECTURE */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-base);
            transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .intro-holder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
            user-select: none;
        }

        .intro-title {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(1.1rem, 2.8vw, 1.6rem); 
            color: var(--primary);
            opacity: 0;
            transform: translateY(25px);
            animation: introSlideUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
        }

        .intro-sub-click {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.45rem, 1.2vw, 0.52rem); 
            color: var(--text-muted);
            opacity: 0;
            letter-spacing: 1px;
            animation: fadeInSimple 0.8s ease forwards 0.9s;
        }

        @keyframes introSlideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInSimple {
            to { opacity: 0.75; }
        }

        /* ─────────────────────────────────────────────────────────────
           CLICK-THROUGH TRANSITION + POST-CLICK ANIMATIONS
           (everything below starts when <body> gets .ambient-active)
           ───────────────────────────────────────────────────────────── */

        /* Intro screen: idle pulse, then a zoom/blur dissolve on click */
        .overlay {
            transition: opacity 0.9s cubic-bezier(0.25, 1, 0.5, 1),
                        transform 1s cubic-bezier(0.65, 0, 0.35, 1),
                        filter 0.9s ease;
        }

        .overlay.hidden {
            opacity: 0;
            transform: scale(1.12);
            filter: blur(12px);
            pointer-events: none;
        }

        .intro-title {
            animation: introSlideUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s,
                       introGlow 2.8s ease-in-out infinite 1.2s;
        }

        .intro-sub-click {
            animation: fadeInSimple 0.8s ease forwards 0.9s,
                       introBlink 2.2s ease-in-out infinite 1.8s;
        }

        @keyframes introGlow {
            0%, 100% { text-shadow: 0 0 0 rgba(255, 61, 90, 0); }
            50% { text-shadow: 0 0 18px rgba(255, 61, 90, 0.7); }
        }

        @keyframes introBlink {
            0%, 100% { opacity: 0.75; }
            50% { opacity: 0.3; }
        }

        /* Red pulse that expands from the exact click point */
        .click-ripple {
            position: fixed;
            z-index: 10000;
            width: 24px;
            height: 24px;
            margin: -12px 0 0 -12px;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(255, 61, 90, 0.6) 0%, rgba(255, 61, 90, 0) 70%);
            animation: ripple 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes ripple {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(90); opacity: 0; }
        }

        /* Video: slow push-in and a fade up from black */
        body.ambient-active .video-background {
            animation: videoIn 2.6s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }

        body.ambient-active .video-shade::after {
            animation: shadeOpen 2.4s ease-out backwards;
        }

        @keyframes videoIn {
            from { transform: scale(1.14); }
            to { transform: scale(1); }
        }

        @keyframes shadeOpen {
            from { opacity: 0.75; }
            to { opacity: 0; }
        }

        /* Staggered UI entrance. "backwards" fill so hover transforms still work afterwards */
        .title-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        .subtitle, .socials-row {
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.85);
        }

        .title-bar {
            height: 2px;
            width: 140px;
            background: linear-gradient(90deg, var(--primary), rgba(255, 61, 90, 0));
        }

        body.ambient-active .title-wrap {
            animation: revealUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.35s backwards;
        }

        body.ambient-active .title-bar {
            animation: barDraw 1.1s cubic-bezier(0.65, 0, 0.35, 1) 0.9s backwards;
        }

        body.ambient-active .subtitle {
            animation: revealUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.55s backwards;
        }

        body.ambient-active .social-icon-link {
            animation: iconPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }
        body.ambient-active .socials-row .social-icon-link:nth-child(1) { animation-delay: 0.55s; }
        body.ambient-active .socials-row .social-icon-link:nth-child(2) { animation-delay: 0.62s; }
        body.ambient-active .socials-row .social-icon-link:nth-child(3) { animation-delay: 0.69s; }
        body.ambient-active .socials-row .social-icon-link:nth-child(4) { animation-delay: 0.76s; }

        /* Discord card: slides in from the right, then floats gently (uses the separate
           `translate` property so it never fights the transform used for centering) */
        body.ambient-active .lanyard-card {
            animation: slideInRight 1s cubic-bezier(0.16, 1, 0.3, 1) 1s backwards,
                       floaty 6s ease-in-out 2.2s infinite;
        }

        body.ambient-active .lyrics-container {
            animation: revealUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.2s backwards;
        }

        body.ambient-active .footer-right {
            animation: revealUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.4s backwards;
        }

        @keyframes revealUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translate(70px, -50%); }
            to { opacity: 1; transform: translate(0, -50%); }
        }

        @keyframes iconPop {
            0% { opacity: 0; transform: translateY(14px) scale(0.4) rotate(-12deg); }
            100% { opacity: 1; transform: none; }
        }

        @keyframes barDraw {
            from { width: 0; opacity: 0; }
            to { width: 140px; opacity: 1; }
        }

        @keyframes floaty {
            0%, 100% { translate: 0 0; }
            50% { translate: 0 -6px; }
        }

        /* Equalizer bars next to the track name */
        .track-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mute-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .mute-btn:hover {
            transform: scale(1.15);
        }

        .mute-btn:focus,
        .mute-btn:focus-visible {
            outline: none;
        }

        .mute-btn:focus-visible .eq i {
            background: var(--accent);
        }

        /* Muted: bars freeze flat and grey, with a slash through them */
        .mute-btn.muted .eq i {
            animation: none !important;
            transform: scaleY(0.2);
            background: var(--text-muted);
        }

        .mute-btn.muted::after {
            content: "";
            position: absolute;
            left: 4px;
            right: 4px;
            top: 50%;
            height: 1.5px;
            background: var(--primary);
            transform: rotate(-35deg);
        }

        .eq {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 10px;
            padding-left: 4px;
        }

        .eq i {
            display: block;
            width: 2px;
            height: 100%;
            background: var(--primary);
            transform-origin: bottom;
            transform: scaleY(0.25);
        }

        body.ambient-active .eq i {
            animation: eqBar 0.9s ease-in-out infinite;
        }
        body.ambient-active .eq i:nth-child(2) { animation-duration: 0.7s; animation-delay: -0.3s; }
        body.ambient-active .eq i:nth-child(3) { animation-duration: 1.1s; animation-delay: -0.6s; }
        body.ambient-active .eq i:nth-child(4) { animation-duration: 0.8s; animation-delay: -0.15s; }

        @keyframes eqBar {
            0%, 100% { transform: scaleY(0.25); }
            50% { transform: scaleY(1); }
        }

        /* Each new lyric line flashes in with a short red glow */
        .lyric-line.line-in {
            animation: lineIn 0.5s ease-out;
        }

        @keyframes lineIn {
            from { opacity: 0; transform: translateY(8px); text-shadow: 0 0 14px rgba(255, 61, 90, 0.9); }
            to { opacity: 1; transform: none; text-shadow: 0 0 0 rgba(255, 61, 90, 0); }

    <script>
        /* STARS DRAWING ENGINE */
        const starEngine = (function () {
            const canvas = document.getElementById('starCanvas');
            const ctx = canvas.getContext('2d', { alpha: true });
            let W = 0, H = 0;
            let stars = [];
            let fallbackInterval = null;
            let animFrameId = null;
            let isRunning = false;

            function resize() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = canvas.width = Math.floor(window.innerWidth * dpr);
                H = canvas.height = Math.floor(window.innerHeight * dpr);
                canvas.style.width = window.innerWidth + "px";
                canvas.style.height = window.innerHeight + "px";
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                initStars();
            }

            function rand(min, max) { return min + Math.random() * (max - min); }

            function initStars() {
                stars = [];
                const area = window.innerWidth * window.innerHeight;
                const count = Math.min(Math.floor(area / 1800), 450); 

                for (let i = 0; i < count; i++) {
                    const r = Math.random();
                    stars.push({
                        x: Math.random() * window.innerWidth,
                        y: Math.random() * window.innerHeight,
                        size: r < 0.85 ? rand(0.5, 1.2) : rand(1.2, 2.0),
                        a: rand(0.4, 0.95),
                        tw: rand(0.005, 0.015),
                        off: rand(0, Math.PI * 2)
                    });
                }
            }

            function draw(t) {
                ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                ctx.fillStyle = "rgba(230, 242, 255, 1)"; 
                
                for (const s of stars) {
                    const twinkle = Math.sin(t * s.tw * 60 + s.off);
                    const alpha = s.a * (0.5 + 0.5 * twinkle);
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;
            }

            function tick(t) {
                if (!isRunning) return;
                draw(t);
                animFrameId = requestAnimationFrame(tick);
            }

            function start() {
                isRunning = true;
                if (fallbackInterval) {
                    clearInterval(fallbackInterval);
                    fallbackInterval = null;
                }
                if (!animFrameId) {
                    animFrameId = requestAnimationFrame(tick);
                }
            }

            function switchToFallback() {
                // If window loses focus, requestAnimationFrame stops completely. 
                // We pivot onto an independent timer thread to keep rendering.
                if (animFrameId) {
                    cancelAnimationFrame(animFrameId);
                    animFrameId = null;
                }
                if (!fallbackInterval && isRunning) {
                    fallbackInterval = setInterval(() => {
                        draw(performance.now());
                    }, 33); // Enforces rendering clock even during active games
                }
            }

            window.addEventListener('resize', resize);
            
            // Listeners to override tab dormancy immediately
            window.addEventListener('focus', start);
            window.addEventListener('blur', switchToFallback);

            resize();
            start();

            return { start, switchToFallback };
        })();

        /* CORE AUDIO & LYRICS INTERACTION ENGINE */
        document.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('overlay');
            const audio = document.getElementById('bgm');
            const video = document.getElementById('bg-video');
            const brandTitle = document.getElementById('brand-title');
            const bodyNode = document.body;
            
            const lyricOutput = document.getElementById('lyric-output');
            const lanyardUsername = document.getElementById('lanyardUsername');
            const lanyardStatusDot = document.getElementById('lanyardStatusDot');
            const lanyardStatusText = document.getElementById('lanyardStatusText');
            const lanyardCustomStatus = document.getElementById('lanyardCustomStatus');
            const lanyardAvatar = document.getElementById('lanyardAvatar');
            const trackName = document.getElementById('track-name');
            const lyricCaret = document.getElementById('lyric-caret');

            const muteBtn = document.getElementById('mute-btn');
            muteBtn.addEventListener('click', () => {
                audio.muted = !audio.muted;
                muteBtn.classList.toggle('muted', audio.muted);
                muteBtn.setAttribute('aria-pressed', String(audio.muted));
                muteBtn.setAttribute('aria-label', audio.muted ? 'Unmute audio' : 'Mute audio');
            });

            let parsedLyrics = [];
            let currentLineIndex = -1;

            trackName.textContent = 'Nightcrawler - Cloacks';
            lyricOutput.textContent = '';

            function parseLRC() {
                const lrcText = document.getElementById('lrc-content').textContent;
                const lines = lrcText.split('\n');
                const timeReg = /\[(\d+):(\d+)\.(\d+)\]/;

                lines.forEach(line => {
                    const match = timeReg.exec(line);
                    if (match) {
                        const minutes = parseInt(match[1]);
                        const seconds = parseInt(match[2]);
                        const milliseconds = parseInt(match[3]) * 10;
                        const timeInSeconds = (minutes * 60) + seconds + (milliseconds / 1000);
                        const text = line.replace(timeReg, '').trim();
                        // Empty text is kept on purpose: it clears the line (used for the outro)
                        parsedLyrics.push({ time: timeInSeconds, text: text });
                    }
                });
                parsedLyrics.sort((a, b) => a.time - b.time);
            }
            parseLRC();

            async function fetchLanyard() {
                try {
                    const response = await fetch('https://api.lanyard.rest/v1/users/292953257997762563');
                    const payload = await response.json();
                    if (!payload.success) throw new Error('No Lanyard data');

                    const data = payload.data;
                    const user = data.discord_user || {};
                    const status = data.discord_status || 'offline';
                    const activities = Array.isArray(data.activities) ? data.activities : [];
                    const customActivity = activities.find(activity => activity.type === 4);

                    lanyardUsername.textContent = user.username || 'indura';
                    lanyardStatusDot.className = `lanyard-status-dot ${status}`;
                    lanyardStatusText.textContent = status === 'offline' ? 'offline' : status;

                    if (user.avatar) {
                        lanyardAvatar.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png?size=128`;
                    } else {
                        lanyardAvatar.removeAttribute('src');
                    }

                    if (customActivity) {
                        let text = customActivity.state || '';
                        if (customActivity.emoji) {
                            text = `${customActivity.emoji.name || ''} ${text}`.trim();
                        }
                        lanyardCustomStatus.textContent = text || 'Addict';
                    } else {
                        lanyardCustomStatus.textContent = 'Addict';
                    }
                } catch (error) {
                    lanyardStatusText.textContent = 'status unavailable';
                    lanyardCustomStatus.textContent = 'Addict';
                    console.warn('Lanyard fetch failed:', error);
                }
            }

            let isOverlayClosed = false;
            let lastKnownTime = -1;
            let stallCounter = 0;
            
            // Watchdog: Triggers when the GPU / browser freezes rendering on your secondary screen
            const handleVideoPlayback = () => {
                if (!isOverlayClosed) return;
                
                // Force playback if paused
                if (video.paused) {
                    video.play().catch(() => {});
                }

                // If the clock isn't moving, the decoder is sleeping
                if (video.currentTime === lastKnownTime && !video.paused) {
                    stallCounter++;
                    if (stallCounter >= 2) { 
                        // Seek forward a fraction of a second to wake up the compositor
                        video.currentTime = video.currentTime + 0.05 >= video.duration ? 0 : video.currentTime + 0.05;
                        video.play().catch(() => {});
                        stallCounter = 0;
                    }
                } else {
                    stallCounter = 0;
                }
                lastKnownTime = video.currentTime;
            };

            overlay.addEventListener('click', (e) => {
                // Ripple from the click point
                const ripple = document.createElement('div');
                ripple.className = 'click-ripple';
                ripple.style.left = e.clientX + 'px';
                ripple.style.top = e.clientY + 'px';
                document.body.appendChild(ripple);
                setTimeout(() => ripple.remove(), 1100);

                overlay.classList.add('hidden');
                bodyNode.classList.add('ambient-active');
                brandTitle.classList.add('glow-active');
                isOverlayClosed = true;
                
                audio.volume = 0.25;
                video.play().catch(() => {});
                audio.play()
                    .then(() => {
                        startLyricSyncLoop();
                    })
                    .catch(err => {
                        console.warn('Audio playback handled safely:', err);
                        lyricOutput.textContent = 'Playback initialized. Stream paused.';
                    });
            });

            fetchLanyard();
            setInterval(fetchLanyard, 15000);

            // Visibility changes wake up the animation context
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    starEngine.start();
                    handleVideoPlayback();
                } else {
                    starEngine.switchToFallback();
                }
            });
            
            // Continuous watchdog running every second
            setInterval(handleVideoPlayback, 1000);

            function startLyricSyncLoop() {
                function frameCheck() {
                    if (!audio.paused && !audio.ended) {
                        const currentTime = audio.currentTime;
                        let activeIndex = -1;

                        for (let i = 0; i < parsedLyrics.length; i++) {
                            if (currentTime >= parsedLyrics[i].time) {
                                activeIndex = i;
                            } else {
                                break;
                            }
                        }

                        // activeIndex is -1 before the first line, including after the track loops
                        if (activeIndex !== currentLineIndex) {
                            currentLineIndex = activeIndex;
                            triggerLinePrint(activeIndex === -1 ? '' : parsedLyrics[activeIndex].text);
                        }
                    }
                    requestAnimationFrame(frameCheck);
                }
                requestAnimationFrame(frameCheck);
            }

            let printInterval = null;
            function triggerLinePrint(fullText) {
                if (printInterval) clearInterval(printInterval);
                lyricOutput.textContent = '';
                lyricCaret.hidden = false;

                // Restart the per-line glow animation
                const lineBox = document.getElementById('lyric-line-box');
                lineBox.classList.remove('line-in');
                void lineBox.offsetWidth;
                if (fullText) lineBox.classList.add('line-in');
                
                let charIdx = 0;
                printInterval = setInterval(() => {
                    if (charIdx < fullText.length) {
                        lyricOutput.textContent += fullText[charIdx];
                        charIdx++;
                    } else {
                        clearInterval(printInterval);
                    }
                }, 25); 
            }
        });
    </script>
