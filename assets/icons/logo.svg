<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Wireframe globe favicon — bolder strokes for 16/32px readability -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.95"/>
  <!-- Equator -->
  <ellipse cx="32" cy="32" rx="28" ry="9" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <!-- Longitude arcs -->
  <ellipse cx="32" cy="32" rx="10" ry="28" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <ellipse cx="32" cy="32" rx="22" ry="28" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.55"/>
  <!-- Icosahedron wireframe edges -->
  <!-- Top cap -->
  <line x1="32" y1="4" x2="12" y2="22" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
  <line x1="32" y1="4" x2="52" y2="22" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
  <!-- Upper-mid belt -->
  <line x1="12" y1="22" x2="52" y2="22" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="12" y1="22" x2="6"  y2="40" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
  <line x1="52" y1="22" x2="58" y2="40" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
  <!-- Lower-mid belt -->
  <line x1="6"  y1="40" x2="22" y2="44" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="58" y1="40" x2="42" y2="44" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <line x1="22" y1="44" x2="42" y2="44" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  <!-- Bottom cap -->
  <line x1="6"  y1="40" x2="32" y2="60" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
  <line x1="58" y1="40" x2="32" y2="60" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
</svg>
