<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no" />
  <title>Lavender</title>
  <meta name="description" content="Digital and Music Artist — Lavender on OutOfTune.">
  <!-- Open Graph / Social Media Sharing -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Lavender" />
  <meta property="og:description" content="Digital and Music Artist — Lavender on OutOfTune." />
  <meta property="og:url" content="https://outoftune.dev/lavender/" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Lavender" />
  <meta name="twitter:description" content="Digital and Music Artist — Lavender on OutOfTune." />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: rgb(26, 15, 46);
      --text-dark: #a8e6cf;
      --accent-cyan: #4dd9d9;
      --accent-gold: #bfa14a;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-dark);
      position: relative;
      background-image: url('./images/background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      /* MATCHED ALIGNMENT: Left-aligned content distribution matching image_502997.jpg */
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    /* Background overlay for dimming */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 10, 20, 0.57);
      z-index: 0;
    }

    /* Animated Border Lines */
    .border-segments {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 1;
    }

    .border-top,
    .border-right,
    .border-bottom,
    .border-left {
      position: absolute;
    }

    .border-top {
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, transparent 30%, #4dd9d9 40%, #bfa14a 50%, #4dd9d9 60%, transparent 70%, transparent 100%);
      background-size: 300% 100%;
      animation: move-horizontal 12s linear infinite;
    }

    .border-right {
      top: 0;
      right: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, transparent 0%, transparent 30%, #4dd9d9 40%, #bfa14a 50%, #4dd9d9 60%, transparent 70%, transparent 100%);
      background-size: 100% 300%;
      animation: move-vertical 12s linear infinite;
    }

    .border-bottom {
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(-90deg, transparent 0%, transparent 30%, #4dd9d9 40%, #bfa14a 50%, #4dd9d9 60%, transparent 70%, transparent 100%);
      background-size: 300% 100%;
      animation: move-horizontal-reverse 12s linear infinite;
    }

    .border-left {
      top: 0;
      left: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(-180deg, transparent 0%, transparent 30%, #4dd9d9 40%, #bfa14a 50%, #4dd9d9 60%, transparent 70%, transparent 100%);
      background-size: 100% 300%;
      animation: move-vertical-reverse 12s linear infinite;
    }

    .border-line-1.border-top { animation-delay: 0s; }
    .border-line-1.border-right { animation-delay: 3s; }
    .border-line-1.border-bottom { animation-delay: 6s; }
    .border-line-1.border-left { animation-delay: 9s; }
    .border-line-2.border-top { animation-delay: 6s; }
    .border-line-2.border-right { animation-delay: 9s; }
    .border-line-2.border-bottom { animation-delay: 0s; }
    .border-line-2.border-left { animation-delay: 3s; }

    @keyframes move-horizontal { 0% { background-position: -100% 0; } 100% { background-position: 200% 0; } }
    @keyframes move-horizontal-reverse { 0% { background-position: 200% 0; } 100% { background-position: -100% 0; } }
    @keyframes move-vertical { 0% { background-position: 0 -100%; } 100% { background-position: 0 200%; } }
    @keyframes move-vertical-reverse { 0% { background-position: 0 200%; } 100% { background-position: 0 -100%; } }

    /* MATCHED ALIGNMENT: Left padding shift away from window edges */
    .container {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding-left: 3.5rem;
      text-align: left;
      max-width: 600px;
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 2.5rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s ease;
      position: relative;
      display: inline-block;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      line-height: 1.2;
      margin: 0;
    }

    .wave-text {
      background: linear-gradient(90deg, #4dd9d9 0%, #a8e6cf 35%, #bfa14a 50%, #a8e6cf 65%, #4dd9d9 100%);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: wave-effect 6s linear infinite;
      text-shadow: 0 0 20px rgba(77, 217, 217, 0.4);
    }

    @keyframes wave-effect { 0% { background-position: 200% 0; } 100% { background-position: -100% 0; } }
    h1:active { transform: scale(0.98); }

    p {
      margin: 0;
      margin-top: 1.2rem;
      font-size: 0.75rem;
      font-family: 'Press Start 2P', monospace;
      font-weight: 400;
      color: #a8e6cf;
      letter-spacing: 0.02em;
      line-height: 1.4;
    }

    /* MATCHED LAYOUT: Left-justified icons list spacing */
    .icons {
      margin-top: 1.8rem;
      display: flex;
      justify-content: flex-start;
      gap: 18px;
    }

    .icons a {
      font-size: 1.4rem;
      color: #a8e6cf;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icons a:hover {
      color: #4dd9d9;
      transform: scale(1.1);
      filter: drop-shadow(0 0 8px rgba(77, 217, 217, 0.8));
    }

    .click-counter {
      margin-top: 1rem;
      margin-bottom: 0;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
    }

    .click-counter.show {
      opacity: 1;
      transform: translateY(0);
    }

    .click-counter p {
      font-size: 0.55rem;
      color: #33a3c2;
      margin: 0;
      text-shadow: 0 0 10px rgba(77, 217, 217, 0.5);
    }

    /* MATCHED FOOTER: OutOfTune dual split footer wrapper */
    footer {
      position: fixed;
      bottom: 20px;
      left: 30px;
      right: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.55rem;
      color: #557788;
      z-index: 2;
      font-family: 'Press Start 2P', monospace;
      pointer-events: none;
    }

    footer .track-info {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    footer .track-info i {
      font-size: 0.6rem;
      color: #4dd9d9;
    }

    footer .copyright-info {
      text-align: right;
      line-height: 1.6;
      pointer-events: auto;
    }

    footer a {
      color: #4dd9d9;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    footer a:hover {
      color: #bfa14a;
    }

    @media (max-width: 600px) {
      body {
        align-items: center;
        justify-content: center;
      }
      
      .container {
        padding-left: 1.5rem;
        padding-right: 1.5rem;
        align-items: center;
        text-align: center;
      }

      h1 {
        font-size: 1.8rem;
      }

      p {
        font-size: 0.65rem;
      }

      .icons {
        justify-content: center;
        gap: 16px;
      }

      footer {
        flex-direction: column;
        gap: 12px;
        bottom: 15px;
        left: 10px;
        right: 10px;
        text-align: center;
      }

      footer .copyright-info {
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <!-- Animated Border Lines -->
  <div class="border-segments">
    <div class="border-top border-line-1"></div>
    <div class="border-right border-line-1"></div>
    <div class="border-bottom border-line-1"></div>
    <div class="border-left border-line-1"></div>
    <div class="border-top border-line-2"></div>
    <div class="border-right border-line-2"></div>
    <div class="border-bottom border-line-2"></div>
    <div class="border-left border-line-2"></div>
  </div>

  <div class="container">
    <h1 id="username" class="wave-text" onclick="playClickSound()">Lavender</h1>
    <p>Your local artist man!</p>

    <div id="clickCounter" class="click-counter" style="display: none;">
      <p>Clicks: <span id="clickCount">0</span></p>
    </div>

    <div class="icons">
      <a href="https://discord.gg/Vj8dBkAhHq" title="Discord" target="_blank"><i class="fab fa-discord"></i></a>
      <a href="https://x.com/emptyamethyst" title="X" target="_blank"><i class="fab fa-x-twitter"></i></a>
      <a href="https://youtube.com/@emptyamethyst" title="YouTube" target="_blank"><i class="fab fa-youtube"></i></a>
      <a href="https://twitch.tv/empty_amethyst" title="Twitch" target="_blank"><i class="fab fa-twitch"></i></a>
    </div>
  </div>

  <!-- FIXED: Replaced standard footer with the standard OutOfTune network split player style -->
  <footer>
    <div class="track-info">
      <i class="fas fa-music"></i>
      <span></span>
    </div>
    <div class="copyright-info">
      © 2026 OutOfTune<br>
      Lavender
    </div>
  </footer>

  <!-- Audio element for background music -->
  <audio id="backgroundAudio" preload="auto" loop>
    <source src="./bgm.flac" type="audio/flac">
    <source src="./audio/bgm.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- Audio element for click sound effect -->
  <audio id="clickSound" preload="auto">
    <source src="./audio/click-sound.mp3" type="audio/mpeg">
    <source src="./click-sound.ogg" type="audio/ogg">
    Your browser does not support the audio element.
  </audio>

  <script>
    let clickCount = 0;
    const clickCounter = document.getElementById('clickCounter');
    const clickCountSpan = document.getElementById('clickCount');

    function playClickSound() {
      const clickSound = document.getElementById('clickSound');
      clickSound.currentTime = 0; 
      clickSound.play().catch(error => {
        console.log('Click sound could not be played:', error);
      });

      clickCount++;
      clickCountSpan.textContent = clickCount;

      if (clickCount === 1) {
        clickCounter.style.display = 'block';
        setTimeout(() => {
          clickCounter.classList.add('show');
        }, 10);
      }
    }

    const audio = document.getElementById('backgroundAudio');

    function startBackgroundAudio() {
      audio.play().catch(error => {
        console.log('Audio autoplay prevented:', error);
        document.addEventListener('click', function () {
          if (audio.paused) {
            audio.play().catch(err => console.log('Audio play failed:', err));
          }
        }, {
          once: true
        });
      });
    }

    audio.volume = 0.3; 
    const clickSound = document.getElementById('clickSound');
    clickSound.volume = 0.5; 

    window.addEventListener('load', () => {
      startBackgroundAudio();
    });

    document.addEventListener('click', function () {
      if (audio.paused) {
        startBackgroundAudio();
      }
    }, {
      once: true
    });
  </script>
</body>

</html>
